<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio · práctica y examen modelo</title>
  <meta name="description" content="Cargá tus preguntas en Markdown o JSON, practicá con feedback inmediato, rendí un examen con temporizador y revisá tus errores. Todo funciona en tu navegador.">
  <meta name="theme-color" content="#0B0E14">
  <script>
    /* Tema antes del primer pintado: evita el destello claro/oscuro. */
    (function () {
      try {
        var pref = localStorage.getItem('estudio.tema.v1');
        try { pref = JSON.parse(pref); } catch (e) { /* valor plano de versiones anteriores */ }
        var sistema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var oscuro = pref === 'oscuro' || (pref !== 'claro' && sistema);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuro ? '#0B0E14' : '#F4F6FB');
      } catch (e) { /* almacenamiento bloqueado: se usa el tema del sistema */ }
    })();
  </script>

/* ==========================================================================
   Estudio · hoja de estilos única
   Sistema visual adaptado de HefestoTech: tokens semánticos, doble tema,
   índigo para la acción, latón para el logro, foco visible y movimiento sobrio.
   ========================================================================== */

:root {
  color-scheme: dark;

  /* Primitivas (paleta HefestoTech) */
  --primitive-night: #0b0e14;
  --primitive-graphite: #121724;
  --primitive-armor: #171e2d;
  --primitive-armor-elevated: #1e2638;
  --primitive-line: #2a3449;
  --primitive-line-soft: #1a2233;
  --primitive-ink: #f1f5f9;
  --primitive-fog: #94a3b8;
  --primitive-fog-deep: #7a8aa3;
  --primitive-indigo: #6366f1;
  --primitive-indigo-solid: #4f46e5;
  --primitive-indigo-deep: #4338ca;
  --primitive-sky: #0ea5e9;
  --primitive-brass: #c9a86a;
  --primitive-brass-deep: #8c7146;
  --primitive-green: #10b981;
  --primitive-green-deep: #047857;
  --primitive-red: #e5484d;
  --primitive-red-deep: #dc2626;
  --primitive-amber: #f59e0b;
  --primitive-amber-deep: #b45309;
  --primitive-paper: #f4f6fb;
  --primitive-paper-surface: #ffffff;
  --primitive-paper-elevated: #eaf0f8;
  --primitive-day-ink: #0f172a;
  --primitive-day-muted: #475569;
  --primitive-day-faint: #64748b;
  --primitive-day-line: #d7dee9;
  --primitive-day-line-soft: #e5eaf2;

  /* Tokens semánticos · tema oscuro (por defecto) */
  --background: var(--primitive-night);
  --surface: var(--primitive-graphite);
  --surface-elevated: var(--primitive-armor);
  --surface-elevated-2: var(--primitive-armor-elevated);
  --text: var(--primitive-ink);
  --text-muted: var(--primitive-fog);
  --text-faint: var(--primitive-fog-deep);
  --border: var(--primitive-line);
  --border-soft: var(--primitive-line-soft);
  --accent: var(--primitive-indigo);
  --accent-solid: var(--primitive-indigo-solid);
  --accent-hover: var(--primitive-indigo-deep);
  --accent-ink: #a5b4fc;
  --accent-sky: var(--primitive-sky);
  --gold: var(--primitive-brass);
  --success: var(--primitive-green);
  --warning: var(--primitive-amber);
  --danger: #f87171;
  --on-accent: #ffffff;
  --on-success: #04150f;
  --on-danger: #0b0e14;
  --focus-ring: rgba(99, 102, 241, 0.45);

  /* Tintes y sombras */
  --accent-soft: rgba(99, 102, 241, 0.12);
  --accent-line: rgba(99, 102, 241, 0.38);
  --gold-soft: rgba(201, 168, 106, 0.1);
  --gold-line: rgba(201, 168, 106, 0.4);
  --success-soft: rgba(16, 185, 129, 0.12);
  --success-line: rgba(16, 185, 129, 0.4);
  --warning-soft: rgba(245, 158, 11, 0.12);
  --warning-line: rgba(245, 158, 11, 0.4);
  --danger-soft: rgba(248, 113, 113, 0.12);
  --danger-line: rgba(248, 113, 113, 0.45);
  --sky-soft: rgba(14, 165, 233, 0.12);
  --scrim: rgba(11, 14, 20, 0.62);
  --shadow-rest: 0 8px 28px rgba(0, 0, 0, 0.32);
  --shadow-lift: 0 12px 34px rgba(0, 0, 0, 0.42);
  --shadow-brand: 0 6px 24px rgba(99, 102, 241, 0.25);
  --grad-brand: linear-gradient(135deg, var(--accent-solid), var(--accent-hover));
  --grad-hairline: linear-gradient(90deg, transparent, var(--accent), transparent);

  /* Tipografía */
  --font-display: "Oswald", "Arial Narrow", "Impact", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --text-h1: clamp(2rem, 1.35rem + 3vw, 3.1rem);
  --text-h2: clamp(1.45rem, 1.1rem + 1.5vw, 2rem);
  --text-h3: clamp(1.12rem, 1rem + 0.55vw, 1.35rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-xs: 0.78rem;
  --tracking-label: 0.09em;

  /* Espaciado, radios, movimiento */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.5rem;
  --space-8: 3.5rem;
  --radio-sm: 8px;
  --radio-md: 12px;
  --radio-lg: 16px;
  --radio-full: 999px;
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 300ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ancho: 1120px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --background: var(--primitive-paper);
  --surface: var(--primitive-paper-surface);
  --surface-elevated: var(--primitive-paper-surface);
  --surface-elevated-2: var(--primitive-paper-elevated);
  --text: var(--primitive-day-ink);
  --text-muted: var(--primitive-day-muted);
  --text-faint: #5b6b80;
  --border: var(--primitive-day-line);
  --border-soft: var(--primitive-day-line-soft);
  --accent: #4f46e5;
  --accent-solid: #4f46e5;
  --accent-hover: #4338ca;
  --accent-ink: #4338ca;
  --accent-sky: #0369a1;
  --gold: #7d643d;
  --success: #036e4f;
  --warning: #92400e;
  --danger: #b91c1c;
  --on-accent: #ffffff;
  --on-success: #ffffff;
  --on-danger: #ffffff;
  --focus-ring: rgba(79, 70, 229, 0.35);
  --accent-soft: rgba(79, 70, 229, 0.09);
  --accent-line: rgba(79, 70, 229, 0.4);
  --gold-soft: rgba(125, 100, 61, 0.1);
  --gold-line: rgba(125, 100, 61, 0.45);
  --success-soft: rgba(4, 120, 87, 0.09);
  --success-line: rgba(4, 120, 87, 0.38);
  --warning-soft: rgba(146, 64, 14, 0.1);
  --warning-line: rgba(146, 64, 14, 0.38);
  --danger-soft: rgba(185, 28, 28, 0.08);
  --danger-line: rgba(185, 28, 28, 0.38);
  --sky-soft: rgba(3, 105, 161, 0.09);
  --scrim: rgba(15, 23, 42, 0.45);
  --shadow-rest: 0 8px 24px rgba(15, 23, 42, 0.07);
  --shadow-lift: 0 14px 34px rgba(15, 23, 42, 0.12);
  --shadow-brand: 0 6px 22px rgba(79, 70, 229, 0.18);
}

/* --------------------------------------------------------------------------
   Base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Profundidad de fondo muy sutil, desactivada con movimiento reducido. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 15% -10%, var(--accent-soft), transparent 65%),
    radial-gradient(700px 420px at 95% 0%, var(--sky-soft), transparent 70%);
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
strong { font-weight: 700; }
code, .mono {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.92em;
  background: var(--surface-elevated-2);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: 0.1em 0.35em;
}
::selection { background: var(--accent); color: var(--on-accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--focus-ring);
}

/* --------------------------------------------------------------------------
   Utilidades
   -------------------------------------------------------------------------- */
.contenedor {
  width: 100%;
  max-width: var(--ancho);
  margin-inline: auto;
  padding-inline: clamp(1rem, 4vw, 1.5rem);
}
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}
.oculto { display: none !important; }
.texto-muted { color: var(--text-muted); }
.texto-faint { color: var(--text-faint); }
.texto-chico { font-size: var(--text-small); }
.texto-xs { font-size: var(--text-xs); }
.centrado { text-align: center; }
.ahorarapido { overflow-wrap: anywhere; }
.fila { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.fila-entre { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.columna { display: grid; gap: var(--space-3); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mt-4 { margin-top: var(--space-4); }
.mt-5 { margin-top: var(--space-5); }
.mt-6 { margin-top: var(--space-6); }
.mb-3 { margin-bottom: var(--space-3); }
.mb-4 { margin-bottom: var(--space-4); }
.separador { height: 1px; background: var(--border-soft); border: 0; margin: var(--space-5) 0; }
.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.skip {
  position: fixed;
  top: 8px; left: 8px;
  z-index: 200;
  transform: translateY(-160%);
  background: var(--accent-solid);
  color: var(--on-accent);
  padding: 0.7rem 1rem;
  border-radius: var(--radio-md);
  font-weight: 700;
  text-decoration: none;
  transition: transform var(--dur-2) var(--ease);
}
.skip:focus { transform: translateY(0); color: var(--on-accent); }

/* --------------------------------------------------------------------------
   Cabecera y navegación
   -------------------------------------------------------------------------- */
.cabecera {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--background);
  background: color-mix(in srgb, var(--background) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border-soft);
}
.cabecera-in {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 64px;
  padding-block: var(--space-2);
  flex-wrap: wrap;
}
.marca {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
  border: 0;
  background: none;
  padding: 0.3rem 0.2rem;
  min-height: 44px;
}
.marca:hover { color: var(--text); }
.marca-icono {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--grad-brand);
  color: var(--on-accent);
  font-size: 0.95rem;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
}
.marca-punto { color: var(--gold); }

.nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
  flex-wrap: wrap;
}
.nav-btn {
  min-height: 44px;
  padding: 0.5rem 0.85rem;
  border: 1px solid transparent;
  border-radius: var(--radio-full);
  background: transparent;
  color: var(--text-muted);
  font-size: var(--text-small);
  font-weight: 600;
  transition: color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.nav-btn:hover { color: var(--text); background: var(--surface); }
.nav-btn[aria-current="page"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-line);
}
.btn-tema {
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radio-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 1.05rem;
  transition: color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
}
.btn-tema:hover { color: var(--accent-ink); border-color: var(--accent-line); background: var(--accent-soft); }

/* --------------------------------------------------------------------------
   Estructura de pantallas
   -------------------------------------------------------------------------- */
main { display: block; padding-block: clamp(1.5rem, 4vw, 2.75rem) var(--space-8); }
.pantalla { animation: aparecer var(--dur-3) var(--ease) both; }
@keyframes aparecer {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.pantalla-cabecera { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.eyebrow {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--gold);
}
.titulo-pagina {
  font-family: var(--font-display);
  font-size: var(--text-h2);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text);
  overflow-wrap: anywhere;
}
.subtitulo {
  color: var(--text-muted);
  max-width: 68ch;
  font-size: 1rem;
  overflow-wrap: anywhere;
}
.seccion { margin-top: var(--space-6); }
.seccion-cabecera {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.seccion-titulo {
  font-family: var(--font-display);
  font-size: var(--text-h3);
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.seccion-sub { color: var(--text-muted); font-size: var(--text-small); }

/* --------------------------------------------------------------------------
   Héroe de inicio
   -------------------------------------------------------------------------- */
.hero {
  position: relative;
  overflow: hidden;
  display: grid;
  gap: var(--space-4);
  padding: clamp(1.4rem, 4vw, 2.75rem);
  border: 1px solid var(--border);
  border-radius: calc(var(--radio-lg) + 6px);
  background:
    linear-gradient(150deg, var(--surface-elevated) 0%, var(--surface) 58%, var(--background) 100%);
  box-shadow: var(--shadow-rest);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: var(--grad-hairline);
  opacity: 0.85;
}
.hero::after {
  content: "";
  position: absolute;
  width: 380px; height: 380px;
  right: -140px; top: -190px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 68%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero-titulo {
  font-family: var(--font-display);
  font-size: var(--text-h1);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: 0.015em;
  text-transform: uppercase;
  max-width: 22ch;
}
.hero-titulo em {
  font-style: normal;
  color: var(--gold);
}
.hero-sub {
  color: var(--text-muted);
  max-width: 62ch;
  font-size: 1.02rem;
}
.hero-acciones { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.hero-datos { display: flex; gap: var(--space-5); flex-wrap: wrap; padding-top: var(--space-2); }
.hero-dato { display: grid; gap: 0.1rem; }
.hero-dato strong {
  font-family: var(--font-display);
  font-size: 1.55rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.hero-dato span {
  font-size: var(--text-xs);
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  font-weight: 700;
}

/* --------------------------------------------------------------------------
   Tarjetas y grillas
   -------------------------------------------------------------------------- */
.grid { display: grid; gap: var(--space-4); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }

.tarjeta {
  position: relative;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  padding: clamp(1rem, 3vw, 1.4rem);
  box-shadow: var(--shadow-rest);
  min-width: 0;
}
.tarjeta-plana { box-shadow: none; background: var(--surface); }
.tarjeta-destacada { background: linear-gradient(180deg, var(--surface-elevated) 0%, var(--surface) 100%); }
.tarjeta-destacada::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  border-radius: var(--radio-lg) var(--radio-lg) 0 0;
  background: var(--grad-hairline);
  opacity: 0.8;
}
.tarjeta-cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.tarjeta-titulo {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.15;
}
.tarjeta-texto { color: var(--text-muted); font-size: var(--text-small); }
.tarjeta-icono {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--accent-ink);
  font-size: 1.15rem;
}

/* --------------------------------------------------------------------------
   Botones
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 44px;
  padding: 0.66rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  color: var(--text);
  font-size: 0.94rem;
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  transition:
    transform var(--dur-1) var(--ease),
    border-color var(--dur-2) var(--ease),
    background var(--dur-2) var(--ease),
    color var(--dur-2) var(--ease),
    box-shadow var(--dur-2) var(--ease);
}
.btn:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
.btn:active { transform: scale(0.985); }
.btn[disabled], .btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-primario {
  border-color: transparent;
  background: var(--grad-brand);
  color: var(--on-accent);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08) inset;
}
.btn-primario:hover {
  background: var(--grad-brand);
  color: var(--on-accent);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: var(--shadow-brand);
}
.btn-primario:active { transform: translateY(0) scale(0.985); }
.btn-peligro {
  color: var(--danger);
  border-color: var(--danger-line);
  background: var(--danger-soft);
}
.btn-peligro:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.btn-fantasma { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn-fantasma:hover { background: var(--surface-elevated-2); border-color: var(--border); color: var(--text); }
.btn-chico { min-height: 36px; padding: 0.4rem 0.7rem; font-size: var(--text-xs); border-radius: var(--radio-sm); }
.btn-icono {
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-weight: 700;
}
.btn-icono:hover { color: var(--accent-ink); border-color: var(--accent-line); }
.btn-bloque { width: 100%; }

/* --------------------------------------------------------------------------
   Chips, badges y avisos
   -------------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 30px;
  padding: 0.28rem 0.7rem;
  border-radius: var(--radio-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.02em;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.chip-activo, .chip[aria-pressed="true"] {
  color: var(--accent-ink);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.chip-boton { cursor: pointer; }
.chip-boton:hover { color: var(--text); border-color: var(--accent-line); }
@media (pointer: coarse) {
  .chip-boton, .btn-chico { min-height: 44px; }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.18rem 0.55rem;
  border-radius: var(--radio-full);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  max-width: 100%;
  overflow-wrap: anywhere;
}
.badge-ok { color: var(--success); background: var(--success-soft); border-color: var(--success-line); }
.badge-mal { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
.badge-warn { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-line); }
.badge-info { color: var(--accent-sky); background: var(--sky-soft); border-color: var(--accent-sky); border-color: color-mix(in srgb, var(--accent-sky) 40%, transparent); }
.badge-gold { color: var(--gold); background: var(--gold-soft); border-color: var(--gold-line); }
.badge-accent { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-line); }

.alerta {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.85rem 1rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--text-small);
  color: var(--text-muted);
  overflow-wrap: anywhere;
}
.alerta strong { color: var(--text); }
.alerta-icono { flex: 0 0 auto; font-size: 1rem; line-height: 1.5; }
.alerta-error { border-color: var(--danger-line); background: var(--danger-soft); }
.alerta-warn { border-color: var(--warning-line); background: var(--warning-soft); }
.alerta-info { border-color: var(--accent-line); background: var(--accent-soft); }
.alerta-ok { border-color: var(--success-line); background: var(--success-soft); }

/* --------------------------------------------------------------------------
   Formularios
   -------------------------------------------------------------------------- */
.campo { display: grid; gap: 0.35rem; min-width: 0; }
.campo > label, .etiqueta {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-muted);
}
.campo input[type="text"],
.campo input[type="number"],
.campo input[type="search"],
.campo select,
.campo textarea,
.input {
  width: 100%;
  min-height: 44px;
  padding: 0.62rem 0.8rem;
  border-radius: var(--radio-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.campo textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.campo input:hover, .campo select:hover, .campo textarea:hover { border-color: var(--text-faint); }
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--focus-ring);
}
.campo input::placeholder, .campo textarea::placeholder { color: var(--text-faint); opacity: 1; }
.campo .ayuda { font-size: var(--text-xs); color: var(--text-faint); }
.campo .error-texto { font-size: var(--text-xs); color: var(--danger); font-weight: 600; }
.campo[data-invalido="true"] input, .campo[data-invalido="true"] textarea { border-color: var(--danger); }
.campo input[aria-invalid="true"], .campo textarea[aria-invalid="true"], .campo select[aria-invalid="true"] { border-color: var(--danger); }
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2.2rem;
}

.check {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
}
.check:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.check input {
  flex: 0 0 auto;
  width: 20px; height: 20px;
  margin-top: 0.15rem;
  accent-color: var(--accent-solid);
  cursor: pointer;
}
.check span { display: grid; gap: 0.1rem; }
.check strong { font-size: 0.92rem; font-weight: 650; }
.check small { color: var(--text-muted); font-size: var(--text-xs); line-height: 1.4; }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend {
  padding: 0;
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

/* --------------------------------------------------------------------------
   Carga de archivos
   -------------------------------------------------------------------------- */
.dropzone {
  display: grid;
  place-items: center;
  gap: 0.6rem;
  text-align: center;
  padding: 1.5rem 1rem;
  border: 1.5px dashed var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  color: var(--text-muted);
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.dropzone:hover, .dropzone.es-arrastrando {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.dropzone.es-arrastrando { transform: scale(1.01); }
.dropzone-icono { font-size: 1.6rem; line-height: 1; color: var(--accent-ink); }
.dropzone p { font-size: var(--text-small); }
.dropzone .texto-xs { color: var(--text-faint); }

/* --------------------------------------------------------------------------
   Listas de bancos
   -------------------------------------------------------------------------- */
.lista-bancos { display: grid; gap: var(--space-3); }
.banco-card {
  display: grid;
  gap: var(--space-3);
  padding: 1rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.banco-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-brand); transform: translateY(-1px); }
.banco-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.banco-nombre {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.banco-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; color: var(--text-muted); font-size: var(--text-xs); }
.banco-acciones { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* --------------------------------------------------------------------------
   Pantalla de revisión de carga
   -------------------------------------------------------------------------- */
.preview-grid { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) {
  .preview-grid { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; }
}
.preview-stats { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.stat {
  display: grid;
  gap: 0.1rem;
  min-width: 90px;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.stat-valor {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.1;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--text-faint);
  font-weight: 700;
}
.lista-issues { display: grid; gap: 0.4rem; max-height: 280px; overflow-y: auto; padding-right: 0.25rem; }
.issue {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  padding: 0.5rem 0.65rem;
  border-radius: var(--radio-sm);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font-size: var(--text-small);
  overflow-wrap: anywhere;
}
.issue-nro {
  flex: 0 0 auto;
  min-width: 2.2rem;
  padding: 0.1rem 0.35rem;
  border-radius: 5px;
  background: var(--surface-elevated-2);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.issue-error { border-color: var(--danger-line); }
.issue-error .issue-nro { background: var(--danger-soft); color: var(--danger); }
.issue-warn { border-color: var(--warning-line); }
.issue-warn .issue-nro { background: var(--warning-soft); color: var(--warning); }

/* --------------------------------------------------------------------------
   Configuración de sesión
   -------------------------------------------------------------------------- */
.modo-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.modo-card {
  position: relative;
  display: grid;
  gap: 0.35rem;
  padding: 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.modo-card:hover { border-color: var(--accent-line); }
.modo-card input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}
.modo-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-ring); }
.modo-card:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.modo-card-titulo {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 750;
  font-size: 0.98rem;
}
.modo-card-titulo .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
.modo-card:has(input:checked) .modo-card-titulo .punto { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.modo-card-desc { color: var(--text-muted); font-size: var(--text-xs); line-height: 1.45; }

.config-grid { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .config-grid { grid-template-columns: minmax(0, 1fr); } }
.config-panel { display: grid; gap: var(--space-4); }
.resumen-config {
  position: sticky;
  top: 88px;
  display: grid;
  gap: var(--space-3);
  padding: 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface-elevated);
}
@media (max-width: 860px) { .resumen-config { position: static; } }
.resumen-lista { display: grid; gap: 0.4rem; font-size: var(--text-small); }
.resumen-lista li { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: 0.4rem; border-bottom: 1px dashed var(--border-soft); }
.resumen-lista li:last-child { border-bottom: 0; padding-bottom: 0; }
.resumen-lista span:first-child { color: var(--text-muted); }
.resumen-lista span:last-child { font-weight: 650; text-align: right; }

/* --------------------------------------------------------------------------
   Examen / práctica
   -------------------------------------------------------------------------- */
.examen-barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.examen-barra-grupo { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.temporizador {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 40px;
  padding: 0.35rem 0.7rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
}
.temporizador.es-urgente {
  color: var(--danger);
  border-color: var(--danger-line);
  background: var(--danger-soft);
  animation: pulso 1.6s ease-in-out infinite;
}
@keyframes pulso { 50% { opacity: 0.62; } }

.progreso { display: grid; gap: 0.35rem; margin-bottom: var(--space-5); }
.progreso-texto {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: 650;
}
.progreso-barra {
  height: 7px;
  border-radius: var(--radio-full);
  background: var(--surface-elevated-2);
  overflow: hidden;
  border: 1px solid var(--border-soft);
}
.progreso-barra > div {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent-solid), var(--accent-sky));
  transition: width var(--dur-3) var(--ease);
}

.examen-grid { display: grid; gap: var(--space-5); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 940px) {
  .examen-grid { grid-template-columns: minmax(0, 1fr) 264px; }
}
.examen-main { min-width: 0; }
.examen-side {
  display: grid;
  gap: var(--space-3);
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface-elevated);
}
@media (min-width: 940px) { .examen-side { position: sticky; top: 88px; } }

.pregunta-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.pregunta-num {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-ink);
}
.enunciado {
  font-size: clamp(1.12rem, 1rem + 0.6vw, 1.38rem);
  font-weight: 650;
  line-height: 1.5;
  letter-spacing: -0.01em;
  max-width: 70ch;
  overflow-wrap: anywhere;
}
.enunciado code { font-size: 0.88em; }

.opciones { display: grid; gap: 0.65rem; margin-top: var(--space-5); }
.opcion {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  padding: 0.95rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
  cursor: pointer;
  transition:
    border-color var(--dur-2) var(--ease),
    background var(--dur-2) var(--ease),
    box-shadow var(--dur-2) var(--ease),
    transform var(--dur-1) var(--ease);
  overflow-wrap: anywhere;
}
.opcion:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.opcion:active { transform: scale(0.997); }
.opcion input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}
.opcion:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-ring); }
.opcion-letra {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--surface-elevated-2);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  text-transform: uppercase;
  transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.opcion-texto { flex: 1; min-width: 0; padding-top: 0.1rem; line-height: 1.5; }
.opcion-marca {
  flex: 0 0 auto;
  font-size: var(--text-xs);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 0.3rem;
}
.opcion.es-seleccionada {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.opcion.es-seleccionada .opcion-letra { background: var(--accent-solid); border-color: transparent; color: var(--on-accent); }
.opcion.es-correcta {
  border-color: var(--success);
  background: var(--success-soft);
  box-shadow: 0 0 0 1px var(--success) inset;
}
.opcion.es-correcta .opcion-letra { background: var(--success); border-color: transparent; color: var(--on-success); }
.opcion.es-correcta .opcion-marca { color: var(--success); }
.opcion.es-incorrecta {
  border-color: var(--danger);
  background: var(--danger-soft);
  box-shadow: 0 0 0 1px var(--danger) inset;
}
.opcion.es-incorrecta .opcion-letra { background: var(--danger); border-color: transparent; color: var(--on-danger); }
.opcion.es-incorrecta .opcion-marca { color: var(--danger); }
.opcion:has(input:disabled) { cursor: default; }

.feedback {
  display: grid;
  gap: 0.5rem;
  margin-top: var(--space-4);
  padding: 1rem 1.1rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  animation: aparecer var(--dur-2) var(--ease) both;
}
.feedback-ok { border-color: var(--success-line); background: var(--success-soft); }
.feedback-mal { border-color: var(--danger-line); background: var(--danger-soft); }
.feedback-titulo {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 800;
  font-size: 0.98rem;
}
.feedback-ok .feedback-titulo { color: var(--success); }
.feedback-mal .feedback-titulo { color: var(--danger); }
.feedback p { color: var(--text-muted); font-size: var(--text-small); }
.feedback strong { color: var(--text); }

.explicacion {
  display: grid;
  gap: 0.35rem;
  margin-top: var(--space-3);
  padding: 0.9rem 1rem;
  border-left: 2px solid var(--gold);
  border-radius: 0 var(--radio-sm) var(--radio-sm) 0;
  background: var(--gold-soft);
}
.explicacion-titulo {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--gold);
}
.explicacion p { color: var(--text); font-size: var(--text-small); line-height: 1.6; }

.acciones-pregunta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-soft);
}
.acciones-grupo { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.mapa { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 0.4rem; }
.mapa-btn {
  position: relative;
  aspect-ratio: 1;
  min-height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-weight: 750;
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.mapa-btn:hover { border-color: var(--accent-line); color: var(--text); }
.mapa-btn.es-respondida { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
.mapa-btn.es-marcada { border-color: var(--warning-line); background: var(--warning-soft); color: var(--warning); }
.mapa-btn.es-respondida.es-marcada {
  border-color: var(--warning);
  background: linear-gradient(135deg, var(--warning-soft) 0 50%, var(--accent-soft) 50% 100%);

  <script>
/* ==========================================================================
   Estudio · aplicación completa en un solo archivo
   Secciones: utilidades · almacenamiento · tema · parser · estado · vistas ·

(function () {

     ======================================================================== */

  const $ = (sel, raiz = document) => raiz.querySelector(sel);

  function escapeHtml(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'

  /**
   * Markdown inline mínimo y seguro: primero escapa todo el HTML y después
   * aplica negrita, cursiva y código. Nunca se inserta HTML del usuario.

  function renderInline(texto) {
    const crudo = String(texto == null ? '' : texto).replace(/\u0000/g, '');
    const codigos = [];
    let s = escapeHtml(crudo);

    s = s.replace(/`([^`]+)`/g, (_m, codigo) => {
      codigos.push(codigo);
      return `\u0000${codigos.length - 1}\u0000`;
    });

    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])__([^_]+)__(?=[\s.,;:!?)]|$)/g, '$1<strong>$2</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');

    s = s.replace(/\u0000(\d+)\u0000/g, (_m, i) => `<code>${codigos[Number(i)]}</code>`);
    return s;
  }

  function renderMarkdown(texto) {
    return String(texto == null ? '' : texto)
      .split(/\r?\n/)
      .map((linea) => renderInline(linea))
      .join('<br>');
  }

  function formatearTiempo(segundos) {
    const s = Math.max(0, Math.round(Number(segundos) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${m}:${String(r).padStart(2, '0')}`;

    try {
      const d = new Date(iso);

  function shuffle(lista) {

    return String(texto || 'banco')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'banco';
  }

  function reducido() {
    return typeof window.matchMedia === 'function' &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function descargar(nombre, contenido, tipo = 'application/json') {
    try {
      const blob = new Blob([contenido], { type: `${tipo};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      return true;
    } catch (error) {
      toast('No se pudo generar la descarga.', 'error');
      return false;
    }
  }

  let anuncioTimer = 0;

    const region = document.getElementById('anuncio');
    if (!region) return;
    region.textContent = '';
    window.clearTimeout(anuncioTimer);
    anuncioTimer = window.setTimeout(() => {
      region.textContent = String(mensaje);
    }, 60);

  function toast(mensaje, tipo = 'info') {
    const contenedor = document.getElementById('toasts');
    if (!contenedor) return;
    while (contenedor.children.length >= 3) contenedor.firstElementChild.remove();
    const iconos = { ok: '✓', error: '!', info: '·' };
    const div = document.createElement('div');
    div.className = `toast toast-${tipo}`;
    div.innerHTML =
      `<span class="toast-icono" aria-hidden="true">${iconos[tipo] || '·'}</span>` +
      `<span>${escapeHtml(mensaje)}</span>`;
    contenedor.appendChild(div);
    window.setTimeout(() => div.remove(), 4200);
  }


  /* ========================================================================
     2. Almacenamiento y normalización de datos
     ======================================================================== */

  const K = {
    bancos: 'estudio.bancos.v1',
    historial: 'estudio.historial.v1',
    sesion: 'estudio.sesion.v1',
    tema: 'estudio.tema.v1',
    prefs: 'estudio.prefs.v1',
    ultimo: 'estudio.ultimoResultado.v1',
    seedIngenieria: 'estudio.seed.ingenieria.v1'
  };

  const PREFS_DEFECTO = {
    modo: 'practica',
    cantidad: 0,
    bloque: '__todos__',
    ordenPreguntas: true,
    ordenOpciones: false,
    mostrarTemporizador: true,
    minutosPorPregunta: 1
  };

  let almacenamientoOK = true;
  let avisoAlmacen = false;

  try {
    const prueba = '__estudio_prueba__';
    localStorage.setItem(prueba, '1');
    localStorage.removeItem(prueba);
  } catch {
    almacenamientoOK = false;
  }

  function safeGet(clave, defecto) {
    try {
      const crudo = localStorage.getItem(clave);
      if (crudo == null || crudo === '') return defecto;
      const valor = JSON.parse(crudo);
      return valor == null ? defecto : valor;
    } catch {
      return defecto;
    }
  }

  function safeSet(clave, valor, silencioso = false) {
    if (!almacenamientoOK) {
      if (!silencioso && !avisoAlmacen) {
        avisoAlmacen = true;
        toast('Tu navegador bloqueó el almacenamiento local. La app funciona, pero no guarda datos.', 'error');
      }
      return false;
    }
    try {
      localStorage.setItem(clave, JSON.stringify(valor));
      return true;
    } catch {
      if (!silencioso && !avisoAlmacen) {
        avisoAlmacen = true;
        toast('No se pudo guardar en el navegador (espacio lleno o modo privado).', 'error');
      }
      return false;
    }
  }

  function safeRemove(clave) {
    try { localStorage.removeItem(clave); } catch { /* sin acceso */ }
  }

  function normalizarPregunta(p, indice) {
    if (!p || typeof p !== 'object') return null;
    const enunciado = typeof p.enunciado === 'string' ? p.enunciado.trim() : '';
    if (!enunciado) return null;
    const opciones = [];
    const mapaOpciones = [];
    (Array.isArray(p.opciones) ? p.opciones : []).forEach((o, i) => {
      const texto = String(o == null ? '' : o).trim();
      if (texto) {
        opciones.push(texto);
        mapaOpciones.push(i);
      }
    });
    if (opciones.length < 2) return null;
    const correctaOriginal = Number.isInteger(p.correcta) ? p.correcta : -1;
    const correctaVisible = mapaOpciones.indexOf(correctaOriginal);
    let correcta = correctaVisible >= 0 ? correctaVisible : -1;
    return {
      id: String(p.id == null ? indice + 1 : p.id),
      nro: Number.isInteger(p.nro) ? p.nro : indice + 1,
      bloque: typeof p.bloque === 'string' ? p.bloque.trim() : '',
      enunciado,
      opciones,
      correcta,
      explicacion: typeof p.explicacion === 'string' ? p.explicacion.trim() : '',
      sinClave: correcta < 0
    };
  }

  function normalizarBancos(crudo) {
    if (!Array.isArray(crudo)) return [];
    return crudo.map((b, i) => {
      if (!b || typeof b !== 'object') return null;
      const preguntas = (Array.isArray(b.preguntas) ? b.preguntas : [])
        .map((p, j) => normalizarPregunta(p, j))
        .filter(Boolean);
      const ids = new Set();
      preguntas.forEach((p, j) => {
        let id = p.id;
        while (ids.has(id)) id = `${p.id}-${j}`;
        ids.add(id);
        p.id = id;
      });
      return {
        id: String(b.id || uid('b')),
        nombre: String(b.nombre || 'Banco sin nombre'),
        creado: typeof b.creado === 'string' ? b.creado : new Date().toISOString(),
        dificiles: Array.isArray(b.dificiles) ? b.dificiles.map(String) : [],
        preguntas
      };
    }).filter(Boolean);
  }

  function normalizarHistorial(crudo) {
    if (!Array.isArray(crudo)) return [];
    const numero = (valor, porDefecto = 0) => (Number.isFinite(Number(valor)) ? Number(valor) : porDefecto);
    return crudo
      .filter((a) => a && typeof a === 'object' && Number.isFinite(Number(a.porcentaje)))
      .map((a) => ({
        id: String(a.id || uid('r')),
        fecha: typeof a.fecha === 'string' ? a.fecha : new Date().toISOString(),
        bancoId: String(a.bancoId || ''),
        bancoNombre: String(a.bancoNombre || 'Banco'),
        modo: ['practica', 'examen', 'repaso'].includes(a.modo) ? a.modo : 'practica',
        total: numero(a.total),
        correctas: numero(a.correctas),
        incorrectas: numero(a.incorrectas),
        sinResponder: numero(a.sinResponder),
        porcentaje: Math.max(0, Math.min(100, numero(a.porcentaje))),
        duracionSeg: Math.max(0, numero(a.duracionSeg)),
        promedioSeg: Math.max(0, numero(a.promedioSeg)),
        porBloque: Array.isArray(a.porBloque) ? a.porBloque : [],
        falladas: Array.isArray(a.falladas) ? a.falladas : [],
        cfg: a.cfg && typeof a.cfg === 'object' ? a.cfg : { ...PREFS_DEFECTO }
      }))
      .slice(-200);
  }

  function normalizarSesion(crudo) {
    if (!crudo || typeof crudo !== 'object') return null;
    if (!Array.isArray(crudo.preguntas) || !crudo.preguntas.length) return null;
    if (!['practica', 'examen', 'repaso'].includes(crudo.modo)) return null;

    const preguntas = [];
    const respuestas = [];
    const marcadas = [];
    const marcadasOriginales = new Set(
      Array.isArray(crudo.marcadas) ? crudo.marcadas.filter((i) => Number.isInteger(i)) : []
    );
    const actualOriginal = Number.isInteger(crudo.actual) ? crudo.actual : 0;
    let actualNuevo = null;

    crudo.preguntas.forEach((q, i) => {
      if (!q || typeof q.enunciado !== 'string' || !Array.isArray(q.opciones)) return;
      const mapa = [];
      const opciones = [];
      q.opciones.forEach((o, j) => {
        const texto = String(o && o.texto != null ? o.texto : '');
        if (texto) {
          opciones.push({ texto, ok: !!(o && o.ok) });
          mapa.push(j);
        }
      });
      if (opciones.length < 2) return;
      if (opciones.filter((o) => o.ok).length !== 1) return;

      const indiceNuevo = preguntas.length;
      preguntas.push({
        pid: String(q.pid == null ? '' : q.pid),
        nro: Number.isInteger(q.nro) ? q.nro : 0,
        bloque: typeof q.bloque === 'string' ? q.bloque : '',
        enunciado: q.enunciado,
        opciones,
        explicacion: typeof q.explicacion === 'string' ? q.explicacion : ''
      });

      const r = crudo.respuestas && crudo.respuestas[i];
      const rVisible = Number.isInteger(r) ? mapa.indexOf(r) : -1;
      respuestas.push(rVisible >= 0 ? rVisible : null);
      if (marcadasOriginales.has(i)) marcadas.push(indiceNuevo);
      if (i === actualOriginal) actualNuevo = indiceNuevo;
    });

    if (!preguntas.length) return null;
    const n = preguntas.length;
    const limite = Number.isFinite(crudo.limiteSeg) && crudo.limiteSeg > 0
      ? Math.round(crudo.limiteSeg)
      : null;

    return {
      id: String(crudo.id || uid('s')),
      bancoId: String(crudo.bancoId || ''),
      bancoNombre: String(crudo.bancoNombre || ''),
      modo: crudo.modo,
      cfg: crudo.cfg && typeof crudo.cfg === 'object' ? crudo.cfg : { ...PREFS_DEFECTO },
      preguntas,
      respuestas,
      marcadas,
      actual: actualNuevo != null && actualNuevo >= 0 && actualNuevo < n ? actualNuevo : 0,
      limiteSeg: limite,
      restanteSeg: limite == null
        ? null
        : (Number.isFinite(Number(crudo.restanteSeg)) ? Math.max(0, Number(crudo.restanteSeg)) : limite),
      iniciadoEn: Number.isFinite(crudo.iniciadoEn) ? crudo.iniciadoEn : Date.now(),
      mostrarTemporizador: crudo.mostrarTemporizador !== false
    };
  }

  function normalizarResultado(crudo) {
    if (!crudo || typeof crudo !== 'object') return null;
    if (!Array.isArray(crudo.detalle) || !Number.isFinite(Number(crudo.porcentaje))) return null;
    const numero = (valor, porDefecto = 0) => (Number.isFinite(Number(valor)) ? Number(valor) : porDefecto);
    const detalle = crudo.detalle
      .filter((d) => d && typeof d === 'object' && Array.isArray(d.opciones))
      .map((d) => ({
        pid: String(d.pid == null ? '' : d.pid),
        nro: Number.isInteger(d.nro) ? d.nro : 0,
        bloque: typeof d.bloque === 'string' ? d.bloque : 'Sin bloque',
        enunciado: typeof d.enunciado === 'string' ? d.enunciado : '',
        opciones: d.opciones.map((o) => String(o == null ? '' : o)),
        correcta: Number.isInteger(d.correcta) ? d.correcta : -1,
        respuesta: Number.isInteger(d.respuesta) ? d.respuesta : null,
        explicacion: typeof d.explicacion === 'string' ? d.explicacion : '',
        acierto: !!d.acierto,
        sinResponder: !!d.sinResponder,
        marcada: !!d.marcada
      }));
    if (!detalle.length) return null;
    return {
      ...crudo,
      fecha: typeof crudo.fecha === 'string' ? crudo.fecha : new Date().toISOString(),
      bancoNombre: String(crudo.bancoNombre || 'Sesión'),
      modo: ['practica', 'examen', 'repaso'].includes(crudo.modo) ? crudo.modo : 'practica',
      cfg: crudo.cfg && typeof crudo.cfg === 'object' ? crudo.cfg : { ...PREFS_DEFECTO },
      automatico: !!crudo.automatico,
      total: numero(crudo.total, detalle.length),
      correctas: numero(crudo.correctas),
      incorrectas: numero(crudo.incorrectas),
      sinResponder: numero(crudo.sinResponder),
      porcentaje: Math.max(0, Math.min(100, numero(crudo.porcentaje))),
      duracionSeg: Math.max(0, numero(crudo.duracionSeg)),
      promedioSeg: Math.max(0, numero(crudo.promedioSeg)),
      porBloque: Array.isArray(crudo.porBloque) ? crudo.porBloque : [],
      detalle,
      falladas: Array.isArray(crudo.falladas) ? crudo.falladas : [],
      marcadas: Array.isArray(crudo.marcadas) ? crudo.marcadas : []
    };
  }

  /* ========================================================================

  const mqOscuro = window.matchMedia

  function cargarTema() {
    const guardado = safeGet(K.tema, 'auto');

  }

  function temaResuelto(pref) {
    if (pref === 'claro') return 'light';
    if (pref === 'oscuro') return 'dark';
    return mqOscuro.matches ? 'dark' : 'light';
  }

  function aplicarTema() {
    const resuelto = temaResuelto(state.tema);
    document.documentElement.dataset.theme = resuelto;
    document.documentElement.style.colorScheme = resuelto;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resuelto === 'dark' ? '#0B0E14' : '#F4F6FB');

    const boton = document.getElementById('btn-tema');
    if (boton) {
      const iconos = { auto: '◐', claro: '☼', oscuro: '☾' };
      const etiquetas = { auto: 'automático', claro: 'claro', oscuro: 'oscuro' };
      boton.textContent = iconos[state.tema];
      boton.setAttribute('aria-label', `Tema ${etiquetas[state.tema]}. Cambiar tema`);
      boton.setAttribute('title', `Tema ${etiquetas[state.tema]}`);
    }
  }

  function cicloTema() {
    const orden = ['auto', 'claro', 'oscuro'];
    const siguiente = orden[(orden.indexOf(state.tema) + 1) % orden.length];
    state.tema = siguiente;
    safeSet(K.tema, siguiente, true);
    aplicarTema();
    const etiquetas = { auto: 'automático (según el sistema)', claro: 'claro', oscuro: 'oscuro' };
    toast(`Tema ${etiquetas[siguiente]}.`, 'ok');
  }

  mqOscuro.addEventListener?.('change', () => {
    if (state.tema === 'auto') aplicarTema();
  });


  /* ========================================================================
     4. Parser tolerante de Markdown y JSON
     ======================================================================== */

  const RE_ENCABEZADO = /^(#{1,6})\s+(.+?)\s*$/;
  const RE_PREGUNTA = /^#{1,6}\s*preguntas?\s*(?:n[°º]?\.?\s*)?(\d+)\b\s*[:.)\-–—]?\s*(.*)$/i;
  const RE_OPCION = /^\s*(?:[-*+]\s*)?([a-dA-D])\s*[).:\-–—]\s*(.+)$/;
  const RE_CLAVE = /^#{1,6}\s*(?:clave(?:\s+de\s+respuestas)?|respuestas|solucionario)\b/i;
  const RE_TRAMPA = /^#{1,6}\s*(?:qu[eé]\s+trampas?|trampas?\b|explicaci[oó]n(?:es)?(?:\s+(?:de\s+)?(?:las?\s+)?(?:respuestas|preguntas|trampas))?\s*$)/i;
  const RE_NO_BLOQUE = /^(instrucciones|indicaciones|consignas?|notas?|introducci[oó]n|objetivos?|contenidos?|bibliograf[ií]a|material(?:es)?|temario|[ií]ndice)\b/i;

  function limpiarBloque(texto) {
    const original = String(texto || '').replace(/[*_`#]/g, '').trim();
    const limpio = original
      .replace(/^bloque\s*\d+\s*[–—\-:.)]*\s*/i, '')
      .trim();
    return limpio || original;
  }

  function parsearClave(lineas, idxClave) {
    const mapa = new Map();
    if (idxClave < 0) return mapa;

    let fin = lineas.length;
    for (let i = idxClave + 1; i < lineas.length; i += 1) {
      if (RE_ENCABEZADO.test(lineas[i])) { fin = i; break; }
    }

    for (let i = idxClave + 1; i < fin; i += 1) {
      const linea = lineas[i].trim();
      if (!linea) continue;

      if (linea.startsWith('|')) {
        const celdas = linea.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
        for (let j = 0; j + 1 < celdas.length; j += 2) {
          const nTxt = celdas[j].replace(/[^\d]/g, '');
          const rTxt = celdas[j + 1].replace(/[^a-dA-D]/g, '').toLowerCase();
          if (nTxt && rTxt.length === 1) {
            mapa.set(parseInt(nTxt, 10), rTxt.charCodeAt(0) - 97);
          }
        }
      } else {
        const m = linea.match(/^(\d+)\s*[.)\-:]?\s*[-–—]?\s*([a-dA-D])\b/);
        if (m) mapa.set(parseInt(m[1], 10), m[2].toLowerCase().charCodeAt(0) - 97);
      }
    }
    return mapa;
  }

  function parsearExplicaciones(lineas, idxTrampa) {
    const mapa = new Map();
    if (idxTrampa < 0) return mapa;

    let fin = lineas.length;
    for (let i = idxTrampa + 1; i < lineas.length; i += 1) {
      if (RE_ENCABEZADO.test(lineas[i])) { fin = i; break; }
    }

    let actual = null;
    for (let i = idxTrampa + 1; i < fin; i += 1) {
      const linea = lineas[i];
      const m = linea.match(/^\s*(\d+)\s*[.)\-:]\s+(.+)$/);
      if (m) {
        actual = parseInt(m[1], 10);
        mapa.set(actual, m[2].trim());
        continue;
      }
      if (actual != null) {
        const t = linea.trim();
        if (t) mapa.set(actual, `${mapa.get(actual)} ${t}`.trim());
      }
    }
    return mapa;
  }

  function parsearCuerpo(cuerpo) {
    const enunciado = [];
    const opciones = [];

    for (const crudo of cuerpo) {
      const t = String(crudo).trim();
      if (!t) {
        if (!opciones.length && enunciado.length && enunciado[enunciado.length - 1] !== '') {
          enunciado.push('');
        }
        continue;
      }
      if (t.startsWith('>')) continue;

      const m = t.match(RE_OPCION);
      if (m) {
        const letra = m[1].toLowerCase().charCodeAt(0) - 97;
        if (!opciones.length && letra === 0) {
          opciones.push(m[2].trim());
          continue;
        }
        if (opciones.length && letra < opciones.length) {
          opciones[letra] = `${opciones[letra]} ${m[2].trim()}`.trim();
          continue;
        }
        if (opciones.length && letra < 4) {
          while (opciones.length < letra) opciones.push('');
          opciones.push(m[2].trim());
          continue;
        }
      }

      if (opciones.length) {
        opciones[opciones.length - 1] = `${opciones[opciones.length - 1]} ${t}`.trim();
      } else {
        enunciado.push(t);
      }
    }

    while (enunciado.length && !enunciado[0]) enunciado.shift();
    while (enunciado.length && !enunciado[enunciado.length - 1]) enunciado.pop();

    return {
      enunciado: enunciado.join('\n').replace(/\n{3,}/g, '\n\n').trim(),
      opciones
    };
  }

  function parsearMarkdown(texto, nombreSugerido = '') {
    const errores = [];
    const advertencias = [];
    const lineas = String(texto)
      .replace(/^\uFEFF/, '')
      .replace(/\r\n?/g, '\n')
      .split('\n');

    const idxClave = lineas.findIndex((l) => RE_CLAVE.test(l));
    const idxTrampa = lineas.findIndex((l) => RE_TRAMPA.test(l));
    const clave = parsearClave(lineas, idxClave);
    const explicaciones = parsearExplicaciones(lineas, idxTrampa);

    const crudas = [];
    let bloqueActual = '';
    let actual = null;

    for (let i = 0; i < lineas.length; i += 1) {
      if (i === idxClave || i === idxTrampa) break;
      const linea = lineas[i];

      const mP = linea.match(RE_PREGUNTA);
      if (mP) {
        if (actual) crudas.push(actual);
        const inicial = (mP[2] || '').trim();
        actual = {
          nro: parseInt(mP[1], 10),
          bloque: bloqueActual,
          cuerpo: inicial ? [inicial] : []
        };
        continue;
      }

      const mH = linea.match(RE_ENCABEZADO);
      if (mH) {
        if (RE_CLAVE.test(linea) || RE_TRAMPA.test(linea)) break;
        const nivel = mH[1].length;
        if (nivel >= 2 && !RE_NO_BLOQUE.test(mH[2])) {
          bloqueActual = limpiarBloque(mH[2]);
        }
        continue;
      }

      if (actual) actual.cuerpo.push(linea);
    }
    if (actual) crudas.push(actual);

    if (!crudas.length) {
      errores.push({ nro: 0, msg: 'No se detectó ninguna pregunta. Se esperaba un encabezado como "### Pregunta 1".' });
    }
    if (idxClave < 0) {
      advertencias.push({ nro: 0, msg: 'No se encontró la sección "CLAVE DE RESPUESTAS". Las preguntas quedarán sin respuesta correcta.' });
    }

    const preguntas = [];
    const numerosVistos = new Set();
    const conteoIds = new Map();

    for (const cruda of crudas) {
      const { enunciado, opciones } = parsearCuerpo(cruda.cuerpo);
      const nro = cruda.nro;

      if (numerosVistos.has(nro)) {
        advertencias.push({ nro, msg: `El número de pregunta ${nro} está repetido.` });
      }
      numerosVistos.add(nro);

      if (!enunciado) {
        errores.push({ nro, msg: 'No tiene enunciado; se omitió.' });
        continue;
      }
      if (opciones.filter(Boolean).length < 2) {
        errores.push({ nro, msg: 'Tiene menos de 2 opciones con texto; se omitió.' });
        continue;
      }

      const opcionesLimpias = [];
      const mapaIndices = [];
      opciones.forEach((opcion, indice) => {
        if (opcion && opcion.trim()) {
          opcionesLimpias.push(opcion.trim());
          mapaIndices.push(indice);
        }
      });

      let correcta = -1;
      let sinClave = false;
      if (!clave.has(nro)) {
        sinClave = true;
        advertencias.push({ nro, msg: 'No se encontró su respuesta en la clave. Se guarda, pero no se usa en práctica ni examen.' });
      } else {
        const original = clave.get(nro);
        const indiceVisible = mapaIndices.indexOf(original);
        if (indiceVisible === -1) {
          sinClave = true;
          advertencias.push({ nro, msg: 'La clave apunta a una opción que no existe en la pregunta. Se guarda sin clave.' });
        } else {
          correcta = indiceVisible;
        }
      }

      const repeticiones = (conteoIds.get(nro) || 0) + 1;
      conteoIds.set(nro, repeticiones);
      const id = repeticiones === 1 ? String(nro) : `${nro}-${repeticiones}`;

      preguntas.push({
        id,
        nro,
        bloque: cruda.bloque,
        enunciado,
        opciones: opcionesLimpias,
        correcta,
        explicacion: explicaciones.get(nro) || '',
        sinClave
      });
    }

    for (const nro of clave.keys()) {
      if (!numerosVistos.has(nro)) {
        advertencias.push({ nro, msg: `La clave incluye la pregunta ${nro}, pero no se encontró esa pregunta en el texto.` });
      }
    }

    const bloques = [...new Set(preguntas.map((p) => p.bloque).filter(Boolean))];

    return {
      formato: 'markdown',
      nombre: nombreSugerido || '',
      preguntas,
      errores,
      advertencias,
      bloques
    };
  }

  function parsearJSON(texto, nombreSugerido = '') {
    const errores = [];
    const advertencias = [];
    let data;

    try {
      data = JSON.parse(String(texto).replace(/^\uFEFF/, ''));
    } catch (error) {
      return {
        formato: 'json',
        nombre: nombreSugerido || '',
        preguntas: [],
        errores: [{ nro: 0, msg: `El JSON no es válido: ${error.message}` }],
        advertencias,
        bloques: []
      };
    }

    let lista;
    let nombre = nombreSugerido || '';
    if (Array.isArray(data)) {
      lista = data;
    } else if (data && typeof data === 'object' && Array.isArray(data.preguntas)) {
      lista = data.preguntas;
      nombre = String(data.nombre || data.titulo || nombreSugerido || '');
    } else {
      return {
        formato: 'json',
        nombre,
        preguntas: [],
        errores: [{ nro: 0, msg: 'El JSON debe ser una lista de preguntas o un objeto con la propiedad "preguntas".' }],
        advertencias,
        bloques: []
      };
    }

    const preguntas = [];
    const conteoIds = new Map();

    lista.forEach((item, i) => {
      const nro = i + 1;
      if (!item || typeof item !== 'object') {
        errores.push({ nro, msg: 'El elemento no es un objeto; se omitió.' });
        return;
      }

      const enunciado = String(item.enunciado ?? item.pregunta ?? item.texto ?? '').trim();
      if (!enunciado) {
        errores.push({ nro, msg: 'No tiene enunciado; se omitió.' });
        return;
      }

      let opcionesCrudas = item.opciones ?? item.options ?? item.alternativas ?? [];
      let opciones;
      if (Array.isArray(opcionesCrudas)) {
        opciones = opcionesCrudas.map((o) => String(o == null ? '' : o).trim());
      } else if (opcionesCrudas && typeof opcionesCrudas === 'object') {
        opciones = Object.values(opcionesCrudas).map((o) => String(o == null ? '' : o).trim());
      } else {
        opciones = [];
      }

      if (opciones.filter(Boolean).length < 2) {
        errores.push({ nro, msg: 'Tiene menos de 2 opciones con texto; se omitió.' });
        return;
      }

      const opcionesLimpias = [];
      const mapaIndices = [];
      opciones.forEach((opcion, indice) => {
        if (opcion) {
          opcionesLimpias.push(opcion);
          mapaIndices.push(indice);
        }
      });

      const correctaRaw = item.correcta ?? item.respuesta ?? item.correctaIndice;
      let correctaOriginal = -1;
      if (typeof correctaRaw === 'number' && Number.isInteger(correctaRaw)) {
        correctaOriginal = correctaRaw;
      } else if (typeof correctaRaw === 'string') {
        const t = correctaRaw.trim().toLowerCase();
        if (/^[a-d]$/.test(t)) correctaOriginal = t.charCodeAt(0) - 97;
        else if (/^\d+$/.test(t)) correctaOriginal = parseInt(t, 10);
      }

      let correcta = -1;
      if (correctaOriginal < 0) {
        advertencias.push({ nro, msg: 'No tiene una respuesta correcta válida. Se guarda sin clave.' });
      } else {
        const indiceVisible = mapaIndices.indexOf(correctaOriginal);
        if (indiceVisible === -1) {
          advertencias.push({ nro, msg: 'La respuesta correcta está fuera de rango. Se guarda sin clave.' });
        } else {
          correcta = indiceVisible;
        }
      }

      const idBase = String(item.id == null ? nro : item.id);
      const repeticiones = (conteoIds.get(idBase) || 0) + 1;
      conteoIds.set(idBase, repeticiones);
      const id = repeticiones === 1 ? idBase : `${idBase}-${repeticiones}`;

      preguntas.push({
        id,
        nro,
        bloque: String(item.bloque ?? item.tema ?? item.unidad ?? '').trim(),
        enunciado,
        opciones: opcionesLimpias,
        correcta,
        explicacion: String(item.explicacion ?? item.explicación ?? item.explanation ?? '').trim(),
        sinClave: correcta < 0
      });
    });

    if (!lista.length) {
      errores.push({ nro: 0, msg: 'La lista de preguntas está vacía.' });
    }

    const bloques = [...new Set(preguntas.map((p) => p.bloque).filter(Boolean))];

    return {
      formato: 'json',
      nombre,
      preguntas,
      errores,
      advertencias,
      bloques
    };
  }

  function parsearBanco(texto, nombreSugerido = '') {
    const limpio = String(texto == null ? '' : texto).replace(/^\uFEFF/, '').trim();
    if (!limpio) {
      return {
        formato: 'desconocido',
        nombre: nombreSugerido,
        preguntas: [],
        errores: [{ nro: 0, msg: 'El contenido está vacío.' }],
        advertencias: [],
        bloques: []
      };
    }
    const pareceJSON = limpio.startsWith('{') || limpio.startsWith('[');
    return pareceJSON
      ? parsearJSON(limpio, nombreSugerido)
      : parsearMarkdown(limpio, nombreSugerido);
  }

La integración continua (CI) consiste principalmente en...

b) Desplegar a producción todos los días sin pruebas
c) Revisar el código una vez al año

  /* El banco integrado se agrega una sola vez. Si la persona lo elimina,
     no vuelve a aparecer al recargar (la marca queda guardada). */
  function sembrarBancoIngenieria() {
    if (safeGet(K.seedIngenieria, false)) return;
    const yaExiste = state.bancos.some(
      (b) => b.id === 'b_ingenieria_software' || b.nombre === BANCO_INGENIERIA.nombre
    );
    if (!yaExiste) {
      const banco = normalizarBancos([{
        id: 'b_ingenieria_software',
        nombre: BANCO_INGENIERIA.nombre,
        creado: new Date().toISOString(),
        dificiles: [],
        preguntas: BANCO_INGENIERIA.preguntas.map((p) => ({ ...p, opciones: [...p.opciones] }))
      }])[0];
      if (banco) {
        state.bancos.push(banco);
        safeSet(K.bancos, state.bancos, true);
      }
    }
    safeSet(K.seedIngenieria, 1, true);
  }

  sembrarBancoIngenieria();

  if (state.bancos.length) {
    state.bancoActualId = state.bancos[0].id;
    state.bancoEditandoId = state.bancos[0].id;
  }

  function guardarBancos() {
    safeSet(K.bancos, state.bancos);
  }

  function guardarHistorial() {
    safeSet(K.historial, state.historial);
  }

  function guardarSesion() {
    if (state.sesion) safeSet(K.sesion, state.sesion);
    else safeRemove(K.sesion);
  }

  function guardarPrefs() {
    safeSet(K.prefs, state.prefs, true);
  }

  function bancoPorId(id) {
    return state.bancos.find((b) => b.id === id) || null;
  }

  function bancoActual() {
    return bancoPorId(state.bancoActualId) || state.bancos[0] || null;
  }

  function bloquesDeBanco(banco) {
    return [...new Set(banco.preguntas.map((p) => p.bloque || 'Sin bloque'))];
  }

  function preguntasUsables(banco) {
    return banco.preguntas.filter(
      (p) => !p.sinClave && p.correcta >= 0 && p.correcta < p.opciones.length
    );
  }

  /* ========================================================================
     7. Sesiones, puntajes e historial
     ======================================================================== */

  function pidsFalladosDeBanco(bancoId) {
    const set = new Set();
    state.historial.forEach((intento) => {
      if (intento.bancoId !== bancoId) return;
      (Array.isArray(intento.falladas) ? intento.falladas : []).forEach((f) => {
        if (f && f.pid != null) set.add(String(f.pid));
      });
    });
    return set;
  }

  function contarDisponibles(banco, cfg) {
    const usables = preguntasUsables(banco);
    let pool = usables;
    if (cfg.bloque && cfg.bloque !== '__todos__') {
      pool = pool.filter((p) => (p.bloque || 'Sin bloque') === cfg.bloque);
    }
    if (cfg.modo === 'repaso') {
      const falladas = pidsFalladosDeBanco(banco.id);
      const dificiles = new Set(banco.dificiles.map(String));
      pool = pool.filter((p) => falladas.has(String(p.id)) || dificiles.has(String(p.id)));
    }
    const total = pool.length;
    const usadas = cfg.cantidad > 0 ? Math.min(cfg.cantidad, total) : total;
    return {
      total,
      usadas,
      sinClave: banco.preguntas.filter((p) => p.sinClave).length,
      sinUsar: banco.preguntas.length - usables.length
    };
  }

  function construirSesion(banco, cfg, pidsOverride = null) {
    let pool = preguntasUsables(banco);

    if (cfg.bloque && cfg.bloque !== '__todos__') {
      pool = pool.filter((p) => (p.bloque || 'Sin bloque') === cfg.bloque);
    }

    if (cfg.modo === 'repaso') {
      const falladas = pidsFalladosDeBanco(banco.id);
      const dificiles = new Set(banco.dificiles.map(String));
      pool = pool.filter((p) => falladas.has(String(p.id)) || dificiles.has(String(p.id)));
    }

    if (Array.isArray(pidsOverride) && pidsOverride.length) {
      const set = new Set(pidsOverride.map(String));
      pool = pool.filter((p) => set.has(String(p.id)));
    }

    if (!pool.length) return null;

    const ordenOriginal = new Map(pool.map((p, i) => [p, i]));
    let seleccion = pool.slice();

    if (cfg.cantidad > 0 && cfg.cantidad < seleccion.length) {
      seleccion = shuffle(seleccion).slice(0, cfg.cantidad);
      if (!cfg.ordenPreguntas) {
        seleccion.sort((a, b) => ordenOriginal.get(a) - ordenOriginal.get(b));
      }
    } else if (cfg.ordenPreguntas) {
      seleccion = shuffle(seleccion);
    }

    const preguntas = seleccion.map((p) => {
      let opciones = p.opciones.map((texto, indice) => ({
        texto,
        ok: indice === p.correcta
      }));
      if (cfg.ordenOpciones) opciones = shuffle(opciones);
      return {
        pid: String(p.id),
        nro: p.nro,
        bloque: p.bloque || '',
        enunciado: p.enunciado,
        opciones,
        explicacion: p.explicacion || ''
      };
    });

    const n = preguntas.length;
    const minutos = Math.min(10, Math.max(0.5, Number(cfg.minutosPorPregunta) || 1));
    const limite = cfg.modo === 'examen' ? Math.max(30, Math.round(n * minutos * 60)) : null;

    return {
      id: uid('s'),
      bancoId: banco.id,
      bancoNombre: banco.nombre,
      modo: cfg.modo,
      cfg: {
        modo: cfg.modo,
        cantidad: cfg.cantidad,
        bloque: cfg.bloque,
        ordenPreguntas: !!cfg.ordenPreguntas,
        ordenOpciones: !!cfg.ordenOpciones,
        mostrarTemporizador: cfg.mostrarTemporizador !== false,
        minutosPorPregunta: minutos
      },
      preguntas,
      respuestas: Array(n).fill(null),
      marcadas: [],
      actual: 0,
      limiteSeg: limite,
      restanteSeg: limite,
      iniciadoEn: Date.now(),
      mostrarTemporizador: cfg.mostrarTemporizador !== false
    };
  }

  function calcularResultado(sesion, automatico = false) {
    const total = sesion.preguntas.length;
    const detalle = sesion.preguntas.map((q, i) => {
      const correcta = q.opciones.findIndex((o) => o.ok);
      const respuesta = sesion.respuestas[i];
      const sinResponder = respuesta == null;
      return {
        pid: String(q.pid),
        nro: q.nro,
        bloque: q.bloque || 'Sin bloque',
        enunciado: q.enunciado,
        opciones: q.opciones.map((o) => o.texto),
        correcta,
        respuesta,
        explicacion: q.explicacion || '',
        acierto: !sinResponder && respuesta === correcta,
        sinResponder,
        marcada: sesion.marcadas.includes(i)
      };
    });

    const correctas = detalle.filter((d) => d.acierto).length;
    const sinResponder = detalle.filter((d) => d.sinResponder).length;
    const incorrectas = total - correctas - sinResponder;

    const bloques = new Map();
    detalle.forEach((d) => {
      if (!bloques.has(d.bloque)) bloques.set(d.bloque, { bloque: d.bloque, total: 0, correctas: 0 });
      const b = bloques.get(d.bloque);
      b.total += 1;
      if (d.acierto) b.correctas += 1;
    });
    const porBloque = [...bloques.values()]
      .map((b) => ({ ...b, porcentaje: b.total ? Math.round((b.correctas / b.total) * 100) : 0 }))
      .sort((a, b) => a.porcentaje - b.porcentaje || a.bloque.localeCompare(b.bloque, 'es'));

    let duracion;
    if (sesion.modo === 'examen' && sesion.limiteSeg) {
      duracion = automatico
        ? sesion.limiteSeg
        : Math.max(0, sesion.limiteSeg - (sesion.restanteSeg ?? sesion.limiteSeg));
    } else {
      duracion = Math.max(0, Math.round((Date.now() - sesion.iniciadoEn) / 1000));
    }

    return {
      id: uid('r'),
      fecha: new Date().toISOString(),
      bancoId: sesion.bancoId,
      bancoNombre: sesion.bancoNombre,
      modo: sesion.modo,
      cfg: { ...sesion.cfg },
      automatico: !!automatico,
      total,
      correctas,
      incorrectas,
      sinResponder,
      porcentaje: total ? Math.round((correctas / total) * 100) : 0,
      duracionSeg: duracion,
      promedioSeg: total ? Math.round(duracion / total) : 0,
      porBloque,
      detalle,
      falladas: detalle
        .filter((d) => !d.acierto)
        .map((d) => ({ pid: d.pid, enunciado: d.enunciado, bloque: d.bloque })),
      marcadas: detalle.filter((d) => d.marcada).map((d) => d.pid)
    };
  }

  function resumenParaHistorial(resultado) {
    return {
      id: resultado.id,
      fecha: resultado.fecha,
      bancoId: resultado.bancoId,
      bancoNombre: resultado.bancoNombre,
      modo: resultado.modo,
      total: resultado.total,
      correctas: resultado.correctas,
      incorrectas: resultado.incorrectas,
      sinResponder: resultado.sinResponder,
      porcentaje: resultado.porcentaje,
      duracionSeg: resultado.duracionSeg,
      promedioSeg: resultado.promedioSeg,
      porBloque: resultado.porBloque,
      falladas: resultado.falladas,
      cfg: resultado.cfg
    };
  }

  function rankingFalladas() {
    const mapa = new Map();
    state.historial.forEach((intento) => {
      (Array.isArray(intento.falladas) ? intento.falladas : []).forEach((f) => {
        if (!f || f.pid == null) return;
        const clave = `${intento.bancoId}::${f.pid}`;
        if (!mapa.has(clave)) {
          mapa.set(clave, {
            pid: f.pid,
            enunciado: f.enunciado || 'Pregunta',
            bloque: f.bloque || '',
            bancoNombre: intento.bancoNombre || '',
            cuenta: 0
          });
        }
        const item = mapa.get(clave);
        item.cuenta += 1;
        if (f.enunciado) item.enunciado = f.enunciado;
      });
    });
    return [...mapa.values()]
      .sort((a, b) => b.cuenta - a.cuenta || a.enunciado.localeCompare(b.enunciado, 'es'))
      .slice(0, 8);
  }

  function promedioHistorial() {
    if (!state.historial.length) return null;
    const suma = state.historial.reduce((acc, a) => acc + (Number(a.porcentaje) || 0), 0);
    return Math.round(suma / state.historial.length);
  }

  function pidsDificiles(banco) {
    return new Set((banco?.dificiles || []).map(String));
  }
