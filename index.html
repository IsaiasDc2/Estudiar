  function tp7EjercicioPorId(id) {
    return TP7_EJERCICIOS.find((e) => e.id === id) || null;
  }

  function tp7ModuloPorId(id) {
    return TP7_MODULOS.find((m) => m.id === id) || null;
  }

  function tp7EjerciciosFiltrados() {
    return state.tp7.filtro === 'todos'
      ? TP7_EJERCICIOS
      : TP7_EJERCICIOS.filter((e) => e.modulo === state.tp7.filtro);
  }

  function tp7Resueltos() {
    return TP7_EJERCICIOS.filter((e) => state.tp7.progreso[e.id]).length;
  }

  function resetearTp7Ejercicio() {
    state.tp7.ejercicioId = null;
    state.tp7.borrador = '';
    state.tp7.resultado = null;
    state.tp7.pista = 0;
    state.tp7.solucion = false;
    state.tp7.intentos = 0;
    state.tp7.guia = null;
    state.tp7.guiaResultado = null;
  }

  function abrirTp7Ejercicio(id) {
    const ejercicio = tp7EjercicioPorId(id);
    if (!ejercicio) return;
    resetearTp7Ejercicio();
    state.tp7.ejercicioId = ejercicio.id;
    state.tp7.guia = { base: null, union: null, filtro: null };
    state.pantalla = 'tp7';
    render({ focus: '#tp7-respuesta' });
  }

  function volverListaTp7() {
    resetearTp7Ejercicio();
    state.pantalla = 'tp7';
    render({ focus: '#titulo-pantalla' });
  }

  function filtrarTp7(modulo) {
    state.tp7.filtro = modulo || 'todos';
    resetearTp7Ejercicio();
    state.pantalla = 'tp7';
    render({ focus: '#titulo-pantalla' });
  }

  function alternarModoTp7Examen() {
    state.tp7.modoExamen = !state.tp7.modoExamen;
    resetearTp7Ejercicio();
    state.pantalla = 'tp7';
    render({ focus: '#titulo-pantalla' });
    toast(
      state.tp7.modoExamen
        ? 'Modo examen activado: sin pistas ni solución hasta el primer intento.'
        : 'Modo examen desactivado: podés usar pistas cuando quieras.',
      'info'
    );
  }

  function normalizarSqlTp7(texto) {
    let sql = normalizarSql(texto);
    sql = sql.replace(/\b(interval\s+)?-?\s*2\s+day\b/g, '-2');
    return sql;
  }

  function tp7Evaluar(texto, ejercicio) {
    const normal = normalizarSqlTp7(texto);
    const criterios = (ejercicio.criterios || []).map((criterio) => {
      let ok = false;
      try {
        ok = typeof criterio.test === 'function'
          ? criterio.test(normal)
          : criterio.test.test(normal);
      } catch {
        ok = false;
      }
      return { etiqueta: criterio.etiqueta, ok };
    });
    return {
      ok: criterios.length > 0 && criterios.every((c) => c.ok),
      criterios,
      normal
    };
  }

  function tp7Comando(texto) {
    const t = normalizarActividadTexto(texto);
    if (!t) return null;
    if (t === 'pista') return 'pista';
    if (t === 'solucion' || t === 'ver solucion') return 'solucion';
    if (t === 'otra analogia' || t === 'analogia') return 'analogia';
    if (t === 'siguiente') return 'siguiente';
    if (t === 'repasar') return 'repasar';
    if (t === 'mas dificil' || t === 'dificil') return 'dificil';
    return null;
  }

  function comprobarTp7() {
    const ejercicio = tp7EjercicioPorId(state.tp7.ejercicioId);
    if (!ejercicio) return;
    const input = document.getElementById('tp7-respuesta');
    const texto = String(input?.value || '').trim();
    if (!texto) {
      toast('Escribí una consulta antes de comprobar.', 'error');
      input?.focus();
      return;
    }

    const comando = tp7Comando(texto);
    if (comando) {
      if (state.tp7.modoExamen && state.tp7.intentos === 0 && ['pista', 'solucion', 'analogia'].includes(comando)) {
        toast('Modo examen: primero intentá una consulta propia.', 'info');
        return;
      }
      state.tp7.borrador = '';
      if (comando === 'pista') {
        state.tp7.pista = 1;
        render({ focus: '#tp7-pista' });
      } else if (comando === 'analogia') {
        state.tp7.pista = 2;
        render({ focus: '#tp7-analogia' });
      } else if (comando === 'solucion') {
        state.tp7.solucion = true;
        render({ focus: '#tp7-solucion' });
      } else if (comando === 'siguiente') {
        siguienteTp7();
      } else if (comando === 'repasar') {
        volverListaTp7();
        toast('Elegí un reto para repasar.', 'info');
      } else if (comando === 'dificil') {
        tp7MasDificil();
      }
      return;
    }

    state.tp7.borrador = texto;
    state.tp7.intentos += 1;

    if (!sqlEmpiezaBien(texto)) {
      state.tp7.resultado = {
        acierto: false,
        criterios: [],
        mensaje: 'Empezá con SELECT. En el TP7 todas las consultas son de lectura.'
      };
      render({ focus: '#tp7-feedback' });
      anunciar('La consulta no empieza con una instrucción SQL reconocida.');
      return;
    }

    if (!sqlParentesisBalanceados(texto)) {
      state.tp7.resultado = {
        acierto: false,
        criterios: [],
        mensaje: 'Revisá los paréntesis y las comillas: hay algo que abre y no cierra.'
      };
      render({ focus: '#tp7-feedback' });
      anunciar('Hay paréntesis o comillas sin cerrar.');
      return;
    }

    const evaluacion = tp7Evaluar(texto, ejercicio);
    state.tp7.resultado = {
      acierto: evaluacion.ok,
      criterios: evaluacion.criterios,
      mensaje: evaluacion.ok
        ? ''
        : 'La consulta todavía no cumple todos los puntos. Mirá el checklist y ajustá lo que falta.'
    };

    if (evaluacion.ok) {
      state.tp7.progreso[ejercicio.id] = true;
      safeSet(K.tp7Progreso, state.tp7.progreso);
      anunciar('Consulta correcta. Reto resuelto.');
    } else {
      if (!state.tp7.modoExamen) state.tp7.pista = Math.max(1, state.tp7.pista);
      anunciar('Todavía no. Revisá el checklist y volvé a intentarlo.');
    }
    render({ focus: '#tp7-feedback' });
  }

  function siguienteTp7() {
    const lista = tp7EjerciciosFiltrados();
    const actual = lista.findIndex((e) => e.id === state.tp7.ejercicioId);
    const siguiente = actual >= 0 ? lista[actual + 1] : lista[0];
    if (siguiente) {
      abrirTp7Ejercicio(siguiente.id);
    } else {
      volverListaTp7();
      toast('Terminaste los retos de este filtro.', 'ok');
    }
  }

  function tp7MasDificil() {
    const actual = tp7EjercicioPorId(state.tp7.ejercicioId);
    if (!actual) return;
    const candidatos = TP7_EJERCICIOS.filter((e) => e.nivel > actual.nivel);
    if (!candidatos.length) {
      toast('Ya estás en el nivel más alto del TP7.', 'info');
      return;
    }
    abrirTp7Ejercicio(candidatos[0].id);
  }

  function alternarPistaTp7() {
    state.tp7.pista = state.tp7.pista ? 0 : 1;
    render();
  }

  function verAnalogiaTp7() {
    state.tp7.pista = 2;
    render();
  }

  function alternarSolucionTp7() {
    state.tp7.solucion = !state.tp7.solucion;
    render();
  }

  function seleccionarGuiaTp7(campo, indice) {
    if (!['base', 'union', 'filtro'].includes(campo)) return;
    const i = Number(indice);
    if (!Number.isInteger(i)) return;
    if (!state.tp7.guia) state.tp7.guia = { base: null, union: null, filtro: null };
    state.tp7.guia[campo] = i;
    state.tp7.guiaResultado = null;
    state._foco = `[data-accion="tp7-guia"][data-campo="${campo}"][data-i="${i}"]`;
    render();
  }

  function comprobarGuiaTp7() {
    const ejercicio = tp7EjercicioPorId(state.tp7.ejercicioId);
    if (!ejercicio) return;
    const guia = state.tp7.guia || {};
    const fallos = [];
    ['base', 'union', 'filtro'].forEach((campo) => {
      const def = ejercicio.guia[campo];
      const seleccion = guia[campo];
      if (seleccion == null) {
        fallos.push(`Falta responder: ${def.pregunta}`);
      } else if (!def.correctas.includes(seleccion)) {
        fallos.push(def.explicacion);
      }
    });

    if (!fallos.length) {
      state.tp7.guiaResultado = {
        ok: true,
        mensaje: 'Elegiste bien la tabla base, la conexión y el filtro. Ahora pasá esa idea a SQL.'
      };
      anunciar('Razonamiento correcto. Ahora escribí la consulta.');
    } else {
      state.tp7.guiaResultado = {
        ok: false,
        mensaje: 'Todavía hay decisiones para revisar.',
        fallos
      };
      anunciar('El razonamiento tiene puntos para corregir.');
    }
    render({ focus: '#tp7-guia-feedback' });
  }

  function copiarSolucionTp7() {
    const ejercicio = tp7EjercicioPorId(state.tp7.ejercicioId);
    if (ejercicio) copiarTexto(ejercicio.solucion, 'Solución del TP7 copiada.');

  function opcionesCantidad(total) {
    const valores = new Set([5, 10, 15, 20, 25, 30, 40, 50, 75, 100]);
    const limite = Math.min(Math.max(total - 1, 0), 10);
    for (let v = 1; v <= limite; v += 1) valores.add(v);
    if (state.prefs.cantidad > 0 && state.prefs.cantidad < total) {
      valores.add(Number(state.prefs.cantidad));
    }
    const opciones = [...valores].filter((v) => v > 0 && v < total).sort((a, b) => a - b);
    return `<option value="0">Todas (${total})</option>` + opciones
      .map((v) => `<option value="${v}" ${Number(state.prefs.cantidad) === v ? 'selected' : ''}>${v} al azar</option>`)
      .join('');
  }

  function vistaEstudiar() {
    const banco = bancoActual();
    if (!banco) {
      return `
        <section class="pantalla" aria-labelledby="titulo-pantalla">
          <div class="pantalla-cabecera">

            <button type="button" class="btn btn-primario" data-nav="inicio">Cargar preguntas</button>
          </div>
        </section>`;
    }

    state.bancoActualId = banco.id;
    const usables = preguntasUsables(banco);
    const bloques = bloquesDeBanco(banco);
    const falladas = pidsFalladosDeBanco(banco.id);
    const dificiles = pidsDificiles(banco);
    const repasoSet = new Set([...falladas, ...dificiles]);
    const repasoCount = usables.filter((p) => repasoSet.has(String(p.id))).length;

    const bancoOpciones = state.bancos.map((b) =>
      `<option value="${escapeHtml(b.id)}" ${b.id === banco.id ? 'selected' : ''}>${escapeHtml(b.nombre)} (${b.preguntas.length})</option>`
    ).join('');

    const bloqueOpciones = [
      `<option value="__todos__" ${state.prefs.bloque === '__todos__' ? 'selected' : ''}>Todos los bloques</option>`,
      ...bloques.map((b) => `<option value="${escapeHtml(b)}" ${state.prefs.bloque === b ? 'selected' : ''}>${escapeHtml(b)}</option>`)
    ].join('');

    const modo = state.prefs.modo;

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <p class="eyebrow">Sesión</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Configurar estudio</h1>
          <p class="subtitulo">Elegí cómo querés practicar. Todo se puede cambiar antes de empezar.</p>
        </div>

        <div class="config-grid">
          <form id="form-config" class="config-panel" novalidate>
            <div class="tarjeta">
              <div class="campo">
                <label for="cfg-banco">Banco de preguntas</label>
                <select id="cfg-banco" name="banco">${bancoOpciones}</select>
              </div>
            </div>

            <fieldset class="tarjeta">
              <legend>Modo</legend>
              <div class="modo-grid">
                <label class="modo-card">
                  <input type="radio" name="modo" value="practica" ${modo === 'practica' ? 'checked' : ''}>
                  <span class="modo-card-titulo"><span class="punto" aria-hidden="true"></span>Práctica</span>
                  <span class="modo-card-desc">Feedback inmediato, explicación y opción de reintentar. Sin límite de tiempo.</span>
                </label>
                <label class="modo-card">
                  <input type="radio" name="modo" value="examen" ${modo === 'examen' ? 'checked' : ''}>
                  <span class="modo-card-titulo"><span class="punto" aria-hidden="true"></span>Examen modelo</span>
                  <span class="modo-card-desc">Temporizador, navegación libre, marcas para revisar y sin respuestas hasta entregar.</span>
                </label>
                <label class="modo-card">
                  <input type="radio" name="modo" value="repaso" ${modo === 'repaso' ? 'checked' : ''}>
                  <span class="modo-card-titulo"><span class="punto" aria-hidden="true"></span>Repaso de errores</span>
                  <span class="modo-card-desc">Solo preguntas falladas antes o marcadas como difíciles. ${repasoCount ? `${repasoCount} disponibles.` : 'Todavía no hay ninguna.'}</span>
                </label>
              </div>
            </fieldset>

            <div class="tarjeta">
              <div class="grid grid-2">
                <div class="campo">
                  <label for="cfg-cantidad">Cantidad de preguntas</label>
                  <select id="cfg-cantidad" name="cantidad">${opcionesCantidad(usables.length)}</select>
                </div>
                <div class="campo">
                  <label for="cfg-bloque">Filtrar por bloque</label>
                  <select id="cfg-bloque" name="bloque">${bloqueOpciones}</select>
                </div>
              </div>

              <div class="columna mt-4">
                <label class="check">
                  <input type="checkbox" name="ordenPreguntas" ${state.prefs.ordenPreguntas ? 'checked' : ''}>
                  <span><strong>Orden aleatorio de preguntas</strong><small>Mezcla el orden en cada intento.</small></span>
                </label>
                <label class="check">
                  <input type="checkbox" name="ordenOpciones" ${state.prefs.ordenOpciones ? 'checked' : ''}>
                  <span><strong>Orden aleatorio de opciones</strong><small>La corrección sigue apuntando a la opción correcta, no a la letra original.</small></span>
                </label>
                <label class="check">
                  <input type="checkbox" name="mostrarTemporizador" ${state.prefs.mostrarTemporizador ? 'checked' : ''}>
                  <span><strong>Mostrar temporizador</strong><small>En examen, el límite se aplica igual aunque ocultes el reloj.</small></span>
                </label>
              </div>

              <div class="campo mt-4" id="cfg-tiempo">
                <label for="cfg-minutos">Minutos por pregunta</label>
                <input type="number" id="cfg-minutos" name="minutosPorPregunta" min="0.5" max="10" step="0.5" value="${escapeHtml(state.prefs.minutosPorPregunta)}">
                <p class="ayuda" id="cfg-tiempo-ayuda">El límite total se calcula al empezar.</p>
              </div>
            </div>
          </form>

          <aside class="resumen-config" aria-label="Resumen de la sesión">
            <h2 class="seccion-titulo">Resumen</h2>
            <ul class="resumen-lista">
              <li><span>Banco</span><span id="res-banco">${escapeHtml(banco.nombre)}</span></li>
              <li><span>Modo</span><span id="res-modo">—</span></li>
              <li><span>Preguntas</span><span id="res-preguntas">—</span></li>
              <li><span>Sin clave</span><span id="res-excluidas">—</span></li>
              <li><span>Tiempo</span><span id="res-tiempo">—</span></li>
            </ul>
            <div id="res-aviso" class="alerta alerta-warn oculto" role="status"></div>
            <button type="submit" form="form-config" class="btn btn-primario btn-bloque" id="btn-empezar">Empezar</button>
            <p class="texto-xs texto-faint">Atajos: 1–4 para responder, M para marcar, Enter para avanzar.</p>
          </aside>
        </div>
      </section>`;
  }

  function leerConfigFormulario() {
    const form = document.getElementById('form-config');
    if (!form) return { ...state.prefs };
    const fd = new FormData(form);
    return {
      modo: ['practica', 'examen', 'repaso'].includes(String(fd.get('modo'))) ? String(fd.get('modo')) : 'practica',
      cantidad: Math.max(0, Number(fd.get('cantidad')) || 0),
      bloque: String(fd.get('bloque') || '__todos__'),
      ordenPreguntas: fd.has('ordenPreguntas'),
      ordenOpciones: fd.has('ordenOpciones'),
      mostrarTemporizador: fd.has('mostrarTemporizador'),
      minutosPorPregunta: Math.min(10, Math.max(0.5, Number(fd.get('minutosPorPregunta')) || 1))
    };
  }

  function capturarConfig() {
    const cfg = leerConfigFormulario();
    state.prefs = cfg;
    guardarPrefs();
    return cfg;
  }

  function actualizarResumenConfig() {
    const banco = bancoActual();
    if (!banco) return;
    const cfg = leerConfigFormulario();
    const datos = contarDisponibles(banco, cfg);
    const resBanco = document.getElementById('res-banco');
    const resModo = document.getElementById('res-modo');
    const resPreguntas = document.getElementById('res-preguntas');
    const resExcluidas = document.getElementById('res-excluidas');
    const resTiempo = document.getElementById('res-tiempo');
    const aviso = document.getElementById('res-aviso');
    const btn = document.getElementById('btn-empezar');
    const tiempo = document.getElementById('cfg-tiempo');
    const ayuda = document.getElementById('cfg-tiempo-ayuda');

    if (resBanco) resBanco.textContent = banco.nombre;
    if (resModo) {
      resModo.textContent = cfg.modo === 'examen' ? 'Examen modelo' : cfg.modo === 'repaso' ? 'Repaso de errores' : 'Práctica';
    }
    if (resPreguntas) resPreguntas.textContent = `${datos.usadas} de ${datos.total}`;
    if (resExcluidas) resExcluidas.textContent = datos.sinClave ? `${datos.sinClave} (no se usan)` : 'Ninguna';
    if (resTiempo) {
      if (cfg.modo === 'examen') {
        const minutos = Math.min(10, Math.max(0.5, Number(cfg.minutosPorPregunta) || 1));
        resTiempo.textContent = `${formatearTiempo(Math.max(30, Math.round(datos.usadas * minutos * 60)))} en total`;
      } else {
        resTiempo.textContent = 'Sin límite';
      }
    }
    if (tiempo) tiempo.classList.toggle('oculto', cfg.modo !== 'examen');
    if (ayuda && cfg.modo === 'examen') {
      const minutos = Math.min(10, Math.max(0.5, Number(cfg.minutosPorPregunta) || 1));
      ayuda.textContent = `Límite total: ${formatearTiempo(Math.max(30, Math.round(datos.usadas * minutos * 60)))}. Se aplica aunque ocultes el reloj.`;
    }

    let mensaje = '';
    if (!datos.total) {
      mensaje = cfg.modo === 'repaso'
        ? 'No hay errores ni preguntas difíciles en este banco. Hacé una práctica o marcá preguntas como difíciles.'
        : 'No hay preguntas usables con este filtro. Revisá la clave o elegí otro bloque.';
    } else if (cfg.modo === 'repaso' && datos.usadas === 0) {
      mensaje = 'No hay preguntas para repasar con este filtro.';
    }
    if (aviso) {
      aviso.textContent = mensaje;
      aviso.classList.toggle('oculto', !mensaje);
    }
    if (btn) {
      btn.disabled = datos.usadas === 0;
      btn.textContent = cfg.modo === 'examen'
        ? 'Empezar examen'
        : cfg.modo === 'repaso'
          ? 'Repasar errores'
          : 'Empezar práctica';
    }
  }

  /* ========================================================================
     14. Vista: examen / práctica
     ======================================================================== */

  function htmlTemporizador(sesion) {
    if (!sesion.mostrarTemporizador) return '';
    const esExamen = sesion.modo === 'examen';
    const segundos = esExamen
      ? (sesion.restanteSeg ?? sesion.limiteSeg ?? 0)
      : Math.max(0, Math.round((Date.now() - sesion.iniciadoEn) / 1000));
    const urgente = esExamen && segundos <= 60;
    return `<span class="temporizador ${urgente ? 'es-urgente' : ''}" id="temporizador" role="timer" aria-label="${esExamen ? 'Tiempo restante' : 'Tiempo transcurrido'}">◷ ${formatearTiempo(segundos)}</span>`;
  }

  function htmlOpciones(sesion, pregunta, indice) {
    const esExamen = sesion.modo === 'examen';
    const respuesta = sesion.respuestas[indice];
    const respondida = respuesta != null;
    const bloqueada = !esExamen && respondida;
    const correcta = pregunta.opciones.findIndex((o) => o.ok);

    const opciones = pregunta.opciones.map((opcion, j) => {
      let clases = 'opcion';
      let marca = '';
      if (esExamen) {
        if (respuesta === j) {
          clases += ' es-seleccionada';
          marca = '<span class="opcion-marca">Elegida</span>';
        }
      } else if (respondida) {
        if (j === correcta) {
          clases += ' es-correcta';
          marca = '<span class="opcion-marca">Correcta</span>';
        } else if (j === respuesta) {
          clases += ' es-incorrecta';
          marca = '<span class="opcion-marca">Tu respuesta</span>';
        }
      }
      return `
        <label class="${clases}">
          <input type="radio" name="opcion" value="${j}" ${respuesta === j ? 'checked' : ''} ${bloqueada ? 'disabled' : ''}>
          <span class="opcion-letra" aria-hidden="true">${String.fromCharCode(97 + j)}</span>
          <span class="opcion-texto">${renderInline(opcion.texto)}</span>
          ${marca}
        </label>`;
    }).join('');

    return `<div class="opciones" role="radiogroup" aria-labelledby="enunciado">${opciones}</div>`;
  }

  function htmlFeedback(sesion, pregunta, indice) {
    if (sesion.modo === 'examen') return '';
    const respuesta = sesion.respuestas[indice];
    if (respuesta == null) return '';

    const correcta = pregunta.opciones.findIndex((o) => o.ok);
    const acierto = respuesta === correcta;
    const textoCorrecto = pregunta.opciones[correcta]?.texto || '';
    const banco = bancoPorId(sesion.bancoId);
    const esDificil = banco ? pidsDificiles(banco).has(String(pregunta.pid)) : false;

    return `
      <div class="feedback ${acierto ? 'feedback-ok' : 'feedback-mal'}" id="feedback" tabindex="-1">
        <div class="feedback-titulo">
          <span aria-hidden="true">${acierto ? '✓' : '✕'}</span>
          ${acierto ? 'Correcto' : 'Incorrecto'}
        </div>
        <p>
          ${acierto
            ? 'Elegiste la opción correcta.'
            : `La respuesta correcta era <strong>${String.fromCharCode(97 + correcta)}) ${renderInline(textoCorrecto)}</strong>.`}
        </p>
        ${pregunta.explicacion ? `
          <div class="explicacion">
            <p class="explicacion-titulo">Por qué</p>
            <p>${renderMarkdown(pregunta.explicacion)}</p>
          </div>` : '<p class="texto-xs texto-faint">Esta pregunta no tiene explicación cargada.</p>'}
        ${banco ? `
          <div class="fila mt-2">
            <button type="button" class="btn btn-chico" data-accion="dificil" data-pid="${escapeHtml(pregunta.pid)}" aria-pressed="${esDificil}">
              ${esDificil ? 'Quitar de difíciles' : 'Marcar como difícil'}
            </button>
          </div>` : ''}
      </div>`;
  }

  function htmlMapa(sesion) {
    return `<div class="mapa" id="mapa" aria-label="Mapa de preguntas">${sesion.preguntas.map((_q, i) => {
      const respondida = sesion.respuestas[i] != null;
      const marcada = sesion.marcadas.includes(i);
      const actual = i === sesion.actual;
      const clases = ['mapa-btn'];
      if (respondida) clases.push('es-respondida');
      if (marcada) clases.push('es-marcada');
      if (actual) clases.push('es-actual');
      const estados = [respondida ? 'respondida' : 'sin responder'];
      if (marcada) estados.push('marcada');
      if (actual) estados.push('actual');
      return `<button type="button" class="${clases.join(' ')}" data-accion="ir-pregunta" data-q="${i}" aria-label="Pregunta ${i + 1}: ${estados.join(', ')}" ${actual ? 'aria-current="true"' : ''}>${i + 1}</button>`;
    }).join('')}</div>`;
  }

  function vistaExamen() {
    const sesion = state.sesion;
    if (!sesion) {
      state.pantalla = 'inicio';
      return vistaInicio();
    }

    const indice = sesion.actual;
    const pregunta = sesion.preguntas[indice];
    if (!pregunta) {
      state.pantalla = 'inicio';
      return vistaInicio();
    }

    const total = sesion.preguntas.length;
    const respondidas = sesion.respuestas.filter((r) => r != null).length;
    const esExamen = sesion.modo === 'examen';
    const marcada = sesion.marcadas.includes(indice);
    const ultima = indice === total - 1;
    const respondida = sesion.respuestas[indice] != null;
    const porcentaje = Math.round(((indice + 1) / total) * 100);

    return `
      <section class="pantalla" aria-labelledby="enunciado">
        <h1 class="sr-only" id="titulo-pantalla" tabindex="-1">${esExamen ? 'Examen modelo' : sesion.modo === 'repaso' ? 'Repaso de errores' : 'Práctica'}</h1>
        <div class="examen-barra">
          <div class="examen-barra-grupo">
            <button type="button" class="btn btn-chico" data-accion="salir-examen">← Salir</button>
            ${htmlBadgeModo(sesion.modo)}
            ${marcada ? '<span class="badge badge-warn">Marcada</span>' : ''}
          </div>
          <div class="examen-barra-grupo">
            ${htmlTemporizador(sesion)}
            <button type="button" class="btn btn-chico" data-accion="ayuda" aria-label="Ayuda y atajos de teclado">?</button>
            <button type="button" class="btn ${esExamen ? 'btn-primario' : ''} btn-chico" data-accion="entregar">
              ${esExamen ? 'Entregar' : 'Finalizar'}
            </button>
          </div>
        </div>

        <div class="progreso">
          <div class="progreso-texto">
            <span id="progreso-texto">Pregunta ${indice + 1} de ${total}</span>
            <span id="progreso-resp">${respondidas} de ${total} respondidas</span>
          </div>
          <div class="progreso-barra" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${indice + 1}" aria-label="Progreso del cuestionario" id="progreso">
            <div id="progreso-barra" style="width: ${porcentaje}%"></div>
          </div>
        </div>

        <div class="examen-grid">
          <div class="examen-main">
            <div class="pregunta-meta">
              <span class="pregunta-num">Pregunta ${indice + 1} de ${total}</span>
              ${pregunta.bloque ? `<span class="badge badge-info">${escapeHtml(pregunta.bloque)}</span>` : ''}
              ${marcada ? '<span class="badge badge-warn">Para revisar</span>' : ''}
            </div>
            <h2 class="enunciado" id="enunciado" tabindex="-1">${renderMarkdown(pregunta.enunciado)}</h2>
            ${htmlOpciones(sesion, pregunta, indice)}
            ${htmlFeedback(sesion, pregunta, indice)}

            <div class="acciones-pregunta">
              <div class="acciones-grupo">
                <button type="button" class="btn" data-accion="anterior" ${indice === 0 ? 'disabled' : ''}>← Anterior</button>
                <button type="button" class="btn" data-accion="saltar">Saltar</button>
              </div>
              <div class="acciones-grupo">
                <button type="button" class="btn" data-accion="marcar" id="btn-marcar" aria-pressed="${marcada}">
                  ${marcada ? 'Quitar marca' : 'Marcar para revisar'}
                </button>
                ${!esExamen && respondida ? '<button type="button" class="btn" data-accion="reintentar">Reintentar</button>' : ''}
                <button type="button" class="btn btn-primario" data-accion="siguiente">
                  ${ultima ? 'Ver resultados' : 'Siguiente →'}
                </button>
              </div>
            </div>
          </div>

          ${esExamen ? `
            <aside class="examen-side" aria-label="Mapa y entrega">
              <div class="fila-entre">
                <h2 class="seccion-titulo">Mapa</h2>
                <span class="texto-xs texto-muted">${respondidas}/${total}</span>
              </div>
              ${htmlMapa(sesion)}
              <div class="leyenda">
                <span class="leyenda-item"><span class="punto punto-respondida" aria-hidden="true"></span>Respondida</span>
                <span class="leyenda-item"><span class="punto punto-marcada" aria-hidden="true"></span>Marcada</span>
                <span class="leyenda-item"><span class="punto punto-actual" aria-hidden="true"></span>Actual</span>
              </div>
              <button type="button" class="btn btn-primario btn-bloque" data-accion="entregar">Entregar examen</button>
              <p class="texto-xs texto-faint">Las respuestas no se revelan hasta entregar.</p>
            </aside>` : ''}
        </div>
      </section>`;
  }


  /* ========================================================================
     15. Vista: resultados
     ======================================================================== */

  function clasePuntaje(p) {
    if (p >= 75) return 'es-ok';
    if (p >= 50) return 'es-warn';
    return 'es-bad';
  }

  function mensajeDesempeno(p) {
    if (p >= 90) return 'Excelente. Tenés el tema aceitado.';
    if (p >= 75) return 'Muy bien. Estás cerca del examen.';
    if (p >= 60) return 'Vas bien, pero hay temas para reforzar.';
    if (p >= 40) return 'Necesitás repasar antes de rendir.';
    return 'Conviene volver al material y practicar de nuevo.';
  }

  function htmlRevisionItem(d, banco) {
    const estado = d.acierto ? 'ok' : d.sinResponder ? 'blanco' : 'mal';
    const esDificil = banco ? pidsDificiles(banco).has(String(d.pid)) : false;
    const letras = ['a', 'b', 'c', 'd'];

    const opciones = d.opciones.map((texto, j) => {
      const esCorrecta = j === d.correcta;
      const esElegida = d.respuesta === j;
      let clases = 'revision-opcion';
      let marca = '';
      if (esCorrecta && esElegida) {
        clases += ' es-elegida-ok';
        marca = '<span class="marca">Tu respuesta · correcta</span>';
      } else if (esCorrecta) {
        clases += ' es-correcta';
        marca = '<span class="marca">Correcta</span>';
      } else if (esElegida) {
        clases += ' es-elegida-mal';
        marca = '<span class="marca">Tu respuesta</span>';
      }
      return `<div class="${clases}"><span class="letra">${letras[j] || j + 1})</span><span>${renderInline(texto)}</span>${marca}</div>`;
    }).join('');

    return `
      <article class="revision-item" data-estado="${estado}">
        <div class="revision-cabecera">
          <span class="revision-num">Pregunta ${d.nro || ''}</span>
          ${d.acierto ? '<span class="badge badge-ok">Correcta</span>' : d.sinResponder ? '<span class="badge badge-warn">Sin responder</span>' : '<span class="badge badge-mal">Incorrecta</span>'}
          ${d.marcada ? '<span class="badge badge-warn">Marcada</span>' : ''}
          ${d.bloque ? `<span class="badge badge-info">${escapeHtml(d.bloque)}</span>` : ''}
          ${banco ? `<button type="button" class="btn btn-chico" data-accion="dificil" data-pid="${escapeHtml(d.pid)}" aria-pressed="${esDificil}">${esDificil ? 'Quitar de difíciles' : 'Marcar como difícil'}</button>` : ''}
        </div>
        <p class="revision-enunciado">${renderMarkdown(d.enunciado)}</p>
        <div class="revision-opciones">${opciones}</div>
        ${d.explicacion ? `<p class="revision-explicacion"><strong>Por qué:</strong> ${renderMarkdown(d.explicacion)}</p>` : ''}
      </article>`;
  }

  function vistaResultados() {
    const r = state.ultimoResultado;
    if (!r) {
      return `
        <section class="pantalla" aria-labelledby="titulo-pantalla">
          <div class="pantalla-cabecera">
            <p class="eyebrow">Resultados</p>
            <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Sin resultados</h1>
          </div>
          <div class="vacio">
            <span class="vacio-icono" aria-hidden="true">◎</span>
            <h3>Todavía no terminaste una sesión</h3>
            <p>Cuando entregues un examen o finalices una práctica, vas a ver acá el puntaje, el desglose por bloque y la revisión completa.</p>
            <button type="button" class="btn btn-primario" data-nav="estudiar">Empezar a estudiar</button>
          </div>
        </section>`;
    }

    const pct = Math.max(0, Math.min(100, Number(r.porcentaje) || 0));
    const clase = clasePuntaje(pct);
    const circunferencia = 2 * Math.PI * 58;
    const offset = circunferencia * (1 - pct / 100);
    const banco = bancoPorId(r.bancoId);
    const marcadas = (r.detalle || []).filter((d) => d.marcada).length;

    const filtros = [
      { id: 'todas', texto: `Todas (${r.total})` },
      { id: 'incorrectas', texto: `Incorrectas (${r.incorrectas})` },
      { id: 'sinresponder', texto: `Sin responder (${r.sinResponder})` },
      { id: 'marcadas', texto: `Marcadas (${marcadas})` }
    ];

    let detalle = r.detalle || [];
    if (state.filtroRevision === 'incorrectas') detalle = detalle.filter((d) => !d.acierto && !d.sinResponder);

  function svgEvolucion() {
    const datos = state.historial.slice(-20);
    if (!datos.length) return '';

    const W = 640;
    const H = 220;
    const padL = 38;
    const padR = 16;
    const padT = 18;
    const padB = 30;
    const ancho = W - padL - padR;
    const alto = H - padT - padB;

    const x = (i) => datos.length === 1
      ? padL + ancho / 2
      : padL + (i / (datos.length - 1)) * ancho;
    const y = (p) => padT + (1 - Math.max(0, Math.min(100, p)) / 100) * alto;

    const grilla = [0, 25, 50, 75, 100].map((v) => `
      <line class="grilla" x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}"></line>
      <text class="eje-texto" x="${padL - 8}" y="${y(v) + 3}" text-anchor="end">${v}%</text>`).join('');

    const puntos = datos.map((d, i) => `${x(i).toFixed(1)},${y(d.porcentaje).toFixed(1)}`).join(' ');
    const circulos = datos.map((d, i) => `
      <circle class="punto" cx="${x(i).toFixed(1)}" cy="${y(d.porcentaje).toFixed(1)}" r="4">
        <title>${escapeHtml(fechaCorta(d.fecha))}: ${Number(d.porcentaje) || 0}%</title>
      </circle>`).join('');

    const indicesEtiqueta = new Set([0, datos.length - 1]);
    if (datos.length > 6) indicesEtiqueta.add(Math.floor((datos.length - 1) / 2));
    const etiquetas = datos.map((d, i) => indicesEtiqueta.has(i)
      ? `<text class="eje-texto" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${escapeHtml(fechaCorta(d.fecha))}</text>`
      : '').join('');

    return `
      <div class="grafico">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del puntaje en los últimos ${datos.length} intentos">
          ${grilla}
          ${datos.length > 1 ? `<polyline class="linea" points="${puntos}"></polyline>` : ''}
          ${circulos}
          ${etiquetas}
        </svg>
      </div>`;
  }

  let modalAlCerrar = null;

  function abrirModal({ titulo, cuerpo, acciones = [], alCerrar = null }) {
    const modal = document.getElementById('modal');
    if (!modal) return;
    if (modal.open) {
      modal.onclose = null;
      modal.close();
    }
    modalAlCerrar = alCerrar;

    modal.innerHTML = `
      <button type="button" class="modal-cerrar" data-cerrar-modal aria-label="Cerrar">✕</button>
      <div class="modal-in">
        <div class="modal-cabecera">
          <h2 class="modal-titulo" id="modal-titulo">${escapeHtml(titulo)}</h2>
        </div>
        <div class="modal-cuerpo">${cuerpo}</div>
        ${acciones.length ? '<div class="modal-acciones"></div>' : ''}
      </div>`;

    const contenedor = modal.querySelector('.modal-acciones');
    acciones.forEach((accion, i) => {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = `btn ${accion.clase || ''}`.trim();
      boton.textContent = accion.texto;
      if (i === acciones.length - 1) boton.dataset.principal = 'true';
      boton.addEventListener('click', () => {
        const cerrar = accion.cerrar !== false;
        if (cerrar) cerrarModal();
        if (typeof accion.onClick === 'function') accion.onClick();
      });
      contenedor.appendChild(boton);
    });

    modal.onclose = () => {
      const fn = modalAlCerrar;
      modalAlCerrar = null;
      if (typeof fn === 'function') fn();
    };

    modal.showModal();

    const foco = modal.querySelector('[data-principal="true"]') ||
      modal.querySelector('input:not([type="hidden"]), textarea, select') ||
      modal.querySelector('button:not(.modal-cerrar)');
    if (foco) foco.focus();
  }

  function cerrarModal() {
    const modal = document.getElementById('modal');
    if (modal && modal.open) modal.close();
  }

  function confirmar({ titulo, mensaje, textoOk = 'Confirmar', textoCancelar = 'Cancelar', peligro = false }) {
    return new Promise((resolver) => {
      let resuelto = false;
      const terminar = (valor) => {
        if (resuelto) return;
        resuelto = true;
        resolver(valor);
      };
      abrirModal({
        titulo,
        cuerpo: `<p>${mensaje}</p>`,
        acciones: [
          { texto: textoCancelar, onClick: () => terminar(false) },
          {
            texto: textoOk,
            clase: peligro ? 'btn-peligro' : 'btn-primario',
            onClick: () => terminar(true)
          }
        ],
        alCerrar: () => terminar(false)
      });
    });
  }

    const base = numericos.length ? Math.max(...numericos) + 1 : banco.preguntas.length + 1;

  function guardarPreguntaForm(form) {
    const banco = bancoPorId(state.bancoEditandoId) || bancoActual();
    if (!banco) return;

    const fd = new FormData(form);
    const pid = String(fd.get('pid') || '');
    const enunciado = String(fd.get('enunciado') || '').trim();
    const bloque = String(fd.get('bloque') || '').trim();
    const explicacion = String(fd.get('explicacion') || '').trim();
    const crudas = [0, 1, 2, 3].map((i) => String(fd.get(`opcion${i}`) || '').trim());
    const correctaOriginal = Number(fd.get('correcta'));

    const error = document.getElementById('p-error');
    form.querySelectorAll('[aria-invalid="true"]').forEach((el) => {
      el.removeAttribute('aria-invalid');
      el.removeAttribute('aria-describedby');
    });
    if (error) {
      error.textContent = '';
      error.classList.add('oculto');
    }
    const mostrarError = (msg, campo) => {
      if (error) {
        error.textContent = msg;
        error.classList.remove('oculto');
      }
      if (campo) {
        campo.setAttribute('aria-invalid', 'true');
        campo.setAttribute('aria-describedby', 'p-error');
        campo.focus();
      }
      toast(msg, 'error');
    };

    if (!enunciado) { mostrarError('El enunciado no puede estar vacío.', form.elements.enunciado); return; }

    const indices = [];
    const opciones = [];
    crudas.forEach((o, i) => {
      if (o) {
        opciones.push(o);
        indices.push(i);
      }
    });
    if (opciones.length < 2) {
      const primerVacio = crudas.findIndex((o) => !o);
      mostrarError('Cargá al menos dos opciones con texto.', form.elements[`opcion${primerVacio >= 0 ? primerVacio : 0}`]);
      return;
    }
    if (!indices.includes(correctaOriginal)) {
      mostrarError('La opción marcada como correcta está vacía. Completala o elegí otra.', form.elements[`opcion${correctaOriginal}`]);
      return;
    }
    const correcta = indices.indexOf(correctaOriginal);

    if (pid) {
      const original = banco.preguntas.find((p) => String(p.id) === pid);
      if (original) {
        original.enunciado = enunciado;
        original.bloque = bloque;
        original.opciones = opciones;
        original.correcta = correcta;
        original.explicacion = explicacion;
        original.sinClave = false;
      }
    } else {
      const nros = banco.preguntas.map((p) => p.nro).filter(Number.isInteger);
      banco.preguntas.push({
        id: siguienteIdPregunta(banco),
        nro: nros.length ? Math.max(...nros) + 1 : 1,
        bloque,
        enunciado,
        opciones,
        correcta,
        explicacion,
        sinClave: false
      });
    }

    guardarBancos();
    cerrarModal();
    render({ focus: '#titulo-pantalla' });
    toast(pid ? 'Pregunta actualizada.' : 'Pregunta agregada.', 'ok');
  }


  /* ========================================================================
     18. Carga de archivos y bancos
     ======================================================================== */

  function leerTexto(archivo) {
    return new Promise((resolver, rechazar) => {
      if (typeof archivo.text === 'function') {
        archivo.text().then(resolver, rechazar);
        return;
      }
      const lector = new FileReader();
      lector.onload = () => resolver(String(lector.result || ''));
      lector.onerror = () => rechazar(lector.error);
      lector.readAsText(archivo);
    });
  }

  async function leerArchivo(archivo) {
    if (!archivo) return;
    if (archivo.size > 2 * 1024 * 1024) {
      toast('El archivo supera los 2 MB. Probá con un banco más chico.', 'error');
      return;
    }
    try {
      const texto = await leerTexto(archivo);
      const nombre = String(archivo.name || '').replace(/\.[^.]+$/, '');
      prepararCarga(texto, nombre);
    } catch {
      toast('No se pudo leer el archivo. Verificá que sea texto UTF-8.', 'error');
    }
  }

  function prepararCarga(texto, nombreSugerido = '') {
    const limpio = String(texto || '').replace(/^\uFEFF/, '').trim();
    if (!limpio) {
      toast('No hay contenido para cargar.', 'error');
      return;
    }
    const resultado = parsearBanco(limpio, nombreSugerido);
    state.preview = {
      ...resultado,
      nombreSugerido: nombreSugerido || resultado.nombre || ''
    };
    state.pantalla = 'carga';
    render();
  }

  function confirmarCarga() {
    const preview = state.preview;
    if (!preview || !preview.preguntas.length) {
      toast('No hay preguntas válidas para guardar.', 'error');
      return;
    }
    const input = document.getElementById('nombre-banco');
    const nombre = String(input?.value || preview.nombreSugerido || preview.nombre || '').trim() || 'Banco sin nombre';

    const banco = {
      id: uid('b'),
      nombre,
      creado: new Date().toISOString(),
      dificiles: [],
      preguntas: preview.preguntas.map((p) => ({
        ...p,
        opciones: [...p.opciones],
        sinClave: p.correcta < 0
      }))
    };

    state.bancos.push(banco);
    state.bancoActualId = banco.id;
    state.bancoEditandoId = banco.id;
    guardarBancos();
    state.preview = null;
    state.pantalla = 'estudiar';
    render();
    toast(`Banco "${banco.nombre}" guardado con ${plural(banco.preguntas.length, 'pregunta', 'preguntas')}.`, 'ok');
  }

  /* ========================================================================
     19. Inicio, salida y finalización de sesiones
     ======================================================================== */

  async function iniciarSesion(banco, cfg, pidsOverride = null) {
    if (!banco) {
      toast('No hay un banco seleccionado.', 'error');
      return;
    }

    if (state.sesion) {
      const ok = await confirmar({
        titulo: 'Sesión en curso',
        mensaje: 'Ya tenés una sesión sin terminar. Si empezás esta, se descarta la anterior y su progreso se pierde.',
        textoOk: 'Empezar igual',
        peligro: true
      });
      if (!ok) return;
    }

    const sesion = construirSesion(banco, cfg, pidsOverride);
    if (!sesion) {
      toast('No hay preguntas disponibles con esa configuración.', 'error');
      return;
    }

    state.bancoActualId = banco.id;
    state.bancoEditandoId = banco.id;
    state.sesion = sesion;
    guardarSesion();
    state.pantalla = 'examen';
    state._ultimaPregunta = null;
    render();
  }

  function empezarDesdeConfig() {
    const banco = bancoActual();
    if (!banco) return;
    const cfg = capturarConfig();
    const datos = contarDisponibles(banco, cfg);
    if (!datos.usadas) {
      actualizarResumenConfig();
      toast('No hay preguntas disponibles con esa configuración.', 'error');
      return;
    }
    iniciarSesion(banco, cfg);
  }

  function finalizarSesion(automatico = false) {
    const sesion = state.sesion;
    if (!sesion) return;

    const resultado = calcularResultado(sesion, automatico);
    state.ultimoResultado = resultado;
    safeSet(K.ultimo, resultado);

    state.historial.push(resumenParaHistorial(resultado));
    if (state.historial.length > 200) state.historial = state.historial.slice(-200);
    guardarHistorial();

    state.sesion = null;
    guardarSesion();
    detenerReloj();
    const modal = document.getElementById('modal');
    if (modal && modal.open) {
      modal.onclose = null;
      modalAlCerrar = null;
      modal.close();
    }
    state.pantalla = 'resultados';
    state.filtroRevision = 'todas';
    render();
    toast(automatico ? 'Se terminó el tiempo: entregamos el examen.' : 'Sesión finalizada.', 'ok');
    anunciar('Resultados listos.');
  }

  async function pedirEntregar() {
    const sesion = state.sesion;
    if (!sesion) return;
    const respondidas = sesion.respuestas.filter((r) => r != null).length;
    const faltan = sesion.preguntas.length - respondidas;
    const esExamen = sesion.modo === 'examen';

    const ok = await confirmar({
      titulo: esExamen ? 'Entregar examen' : 'Finalizar sesión',
      mensaje: esExamen
        ? `Vas a entregar el examen. Respondiste <strong>${respondidas} de ${sesion.preguntas.length}</strong>${faltan ? ` y quedan <strong>${faltan} sin responder</strong>` : ''}. Después no se puede cambiar.`
        : `Vas a finalizar la sesión. Respondiste <strong>${respondidas} de ${sesion.preguntas.length}</strong>${faltan ? ` y quedan <strong>${faltan} sin responder</strong>` : ''}.`,
      textoOk: esExamen ? 'Entregar' : 'Finalizar',
      peligro: esExamen
    });
    if (ok) finalizarSesion(false);
  }

  async function confirmarSalida(alSalir) {
    const ok = await confirmar({
      titulo: 'Salir de la sesión',
      mensaje: 'El progreso queda guardado y podés retomarlo desde el inicio. ¿Querés salir ahora?',
      textoOk: 'Salir y guardar',
      textoCancelar: 'Seguir'

    guardarSesion();

    if (!state.sesion) return;
    const ok = await confirmar({

      textoOk: 'Descartar',

     20. Interacción con la sesión
     ======================================================================== */

  function manejarOpcion(indice) {
    const sesion = state.sesion;
    if (!sesion || state.pantalla !== 'examen') return;
    const pregunta = sesion.preguntas[sesion.actual];
    if (!pregunta || indice < 0 || indice >= pregunta.opciones.length) return;
    if (sesion.modo !== 'examen' && sesion.respuestas[sesion.actual] != null) return;

    sesion.respuestas[sesion.actual] = indice;
    guardarSesion();

    if (sesion.modo === 'examen') {
      actualizarUIExamen();
    } else {
      state._foco = '#feedback';
      render();
    }
  }

  function actualizarUIExamen() {
    const sesion = state.sesion;
    if (!sesion) return;
    const respuesta = sesion.respuestas[sesion.actual];

    $$('.opcion').forEach((label) => {
      const input = label.querySelector('input');
      if (!input) return;
      const indice = Number(input.value);
      const seleccionada = indice === respuesta;
      input.checked = seleccionada;
      label.classList.toggle('es-seleccionada', seleccionada);
    });

    actualizarProgresoUI();
    actualizarMapaUI();
  }

  function actualizarProgresoUI() {
    const sesion = state.sesion;
    if (!sesion) return;
    const total = sesion.preguntas.length;
    const respondidas = sesion.respuestas.filter((r) => r != null).length;
    const resp = document.getElementById('progreso-resp');
    if (resp) resp.textContent = `${respondidas} de ${total} respondidas`;
    const barra = document.getElementById('progreso');
    if (barra) barra.setAttribute('aria-valuenow', String(sesion.actual + 1));
  }

  function actualizarMapaUI() {
    const mapa = document.getElementById('mapa');
    const sesion = state.sesion;
    if (!mapa || !sesion) return;
    const botones = $$('.mapa-btn', mapa);
    botones.forEach((boton, i) => {
      const respondida = sesion.respuestas[i] != null;
      const marcada = sesion.marcadas.includes(i);
      const actual = i === sesion.actual;
      boton.classList.toggle('es-respondida', respondida);
      boton.classList.toggle('es-marcada', marcada);
      boton.classList.toggle('es-actual', actual);
      if (actual) boton.setAttribute('aria-current', 'true');
      else boton.removeAttribute('aria-current');
      const estados = [respondida ? 'respondida' : 'sin responder'];
      if (marcada) estados.push('marcada');
      if (actual) estados.push('actual');
      boton.setAttribute('aria-label', `Pregunta ${i + 1}: ${estados.join(', ')}`);
    });
  }

  function navegar(dir, opciones = {}) {
    const sesion = state.sesion;
    if (!sesion) return;
    const nuevo = sesion.actual + dir;

    if (nuevo < 0) return;
    if (nuevo >= sesion.preguntas.length) {
      if (opciones.saltar) {
        toast('Ya estás en la última pregunta.', 'info');
      } else {
        pedirEntregar();
      }
      return;
    }

    sesion.actual = nuevo;
    guardarSesion();
    render();
  }

  function irPregunta(indice) {
    const sesion = state.sesion;
    if (!sesion) return;
    if (!Number.isInteger(indice) || indice < 0 || indice >= sesion.preguntas.length) return;
    sesion.actual = indice;
    guardarSesion();
    render();
  }

  function alternarMarcada() {
    const sesion = state.sesion;
    if (!sesion) return;
    const i = sesion.actual;
    const pos = sesion.marcadas.indexOf(i);
    if (pos >= 0) sesion.marcadas.splice(pos, 1);
    else sesion.marcadas.push(i);
    guardarSesion();
    state._foco = '#btn-marcar';
    render();
    anunciar(sesion.marcadas.includes(i) ? 'Pregunta marcada para revisar.' : 'Marca quitada.');
  }

  function reintentarPregunta() {
    const sesion = state.sesion;
    if (!sesion || sesion.modo === 'examen') return;
    sesion.respuestas[sesion.actual] = null;
    guardarSesion();
    render({ focus: '.opciones input' });
    anunciar('Podés responder de nuevo.');
  }

  function marcarDificil(pid) {
    const banco = bancoPorId(state.sesion?.bancoId || state.ultimoResultado?.bancoId || state.bancoActualId);
    if (!banco) {
      toast('No se encontró el banco para guardar la marca.', 'error');
      return;
    }
    const id = String(pid);
    const pos = banco.dificiles.findIndex((d) => String(d) === id);
    let agregada;
    if (pos >= 0) {
      banco.dificiles.splice(pos, 1);
      agregada = false;
    } else {
      banco.dificiles.push(id);
      agregada = true;
    }
    guardarBancos();

    $$('[data-accion="dificil"]').forEach((boton) => {
      if (String(boton.dataset.pid) !== id) return;
      boton.setAttribute('aria-pressed', String(agregada));
      boton.textContent = agregada ? 'Quitar de difíciles' : 'Marcar como difícil';
    });

    toast(agregada ? 'Pregunta marcada como difícil.' : 'Pregunta quitada de difíciles.', 'ok');
  }

    const r = state.ultimoResultado;
    if (!r) return;
    const fecha = String(r.fecha || '').slice(0, 10);
    descargar(`resultado-${slug(r.bancoNombre)}-${fecha}.json`, JSON.stringify(r, null, 2));
    toast('Resultados exportados.', 'ok');

     21. Temporizador
     ======================================================================== */

  function actualizarRelojUI() {
    const el = document.getElementById('temporizador');
    const sesion = state.sesion;
    if (!el || !sesion) return;
    const esExamen = sesion.modo === 'examen';
    const segundos = esExamen
      ? Math.max(0, sesion.restanteSeg ?? 0)
      : Math.max(0, Math.round((Date.now() - sesion.iniciadoEn) / 1000));
    el.textContent = `◷ ${formatearTiempo(segundos)}`;
    el.classList.toggle('es-urgente', esExamen && segundos <= 60);
    el.setAttribute('aria-label', `${esExamen ? 'Tiempo restante' : 'Tiempo transcurrido'}: ${formatearTiempo(segundos)}`);
  }

  function detenerReloj() {
    if (state._reloj != null) {
      window.clearInterval(state._reloj);
      state._reloj = null;
    }
  }

  function iniciarReloj() {
    detenerReloj();
    const sesion = state.sesion;
    if (!sesion) return;

    sesion._marcaTiempo = Date.now();
    actualizarRelojUI();

    state._reloj = window.setInterval(() => {
      if (!state.sesion || state.pantalla !== 'examen') {
        detenerReloj();
        return;
      }

      const ahora = Date.now();
      const delta = Math.floor((ahora - sesion._marcaTiempo) / 1000);
      if (delta <= 0) return;
      sesion._marcaTiempo += delta * 1000;

      if (sesion.modo === 'examen') {
        const antes = sesion.restanteSeg ?? 0;
        sesion.restanteSeg = Math.max(0, antes - delta);
        actualizarRelojUI();

        if (antes > 60 && sesion.restanteSeg <= 60) anunciar('Queda un minuto de examen.');
        if (antes > 10 && sesion.restanteSeg <= 10) anunciar('Quedan diez segundos.');

        if (sesion.restanteSeg <= 0) {
          guardarSesion();
          finalizarSesion(true);
          return;
        }
        if (Math.round(sesion.restanteSeg) % 5 === 0) guardarSesion();
      } else {
        actualizarRelojUI();
      }
    }, 1000);
  }

  function aplicarDestino(destinoFinal) {
    if (destinoFinal === 'actividades' && state.pantalla !== 'actividades') {
      state.actividad = null;
    }
    if (destinoFinal === 'sql' && (state.pantalla !== 'sql' || state.sql.ejercicioId || state.sql.relacion)) {

    if (destinoFinal === 'tp7' && (state.pantalla !== 'tp7' || state.tp7.ejercicioId)) {
      resetearTp7Ejercicio();
    }
    state.pantalla = destinoFinal === 'examen' && !state.sesion ? 'inicio' : destinoFinal;
    render();
  }

  function ir(destino) {
    const validas = ['inicio', 'bancos', 'preguntas', 'carga', 'actividades', 'sql', 'tp7', 'estudiar', 'examen', 'resultados', 'historial'];
    const destinoFinal = validas.includes(destino) ? destino : 'inicio';

    if (state.pantalla === 'examen' && state.sesion && destinoFinal !== 'examen') {
      confirmarSalida(() => aplicarDestino(destinoFinal));
      return;

    aplicarDestino(destinoFinal);

        break;
      case 'tp7-guia':
        seleccionarGuiaTp7(el.dataset.campo, el.dataset.i);
        break;
      case 'tp7-guia-comprobar':
        comprobarGuiaTp7();
        break;
      case 'tp7-copiar-solucion':
        copiarSolucionTp7();
        break;
      case 'tp7-modo-examen':
        alternarModoTp7Examen();
        break;
      case 'tp7-reiniciar':
        reiniciarProgresoTp7();
        break;
      case 'sql-match-izq':
        manejarSqlMatch('izq', Number(el.dataset.id));
        break;
      case 'sql-match-der':
        manejarSqlMatch('der', Number(el.dataset.id));
        break;
      case 'calidad-siguiente':
        siguienteCalidad();
        break;
      case 'match-izq':
        manejarMatch('izq', Number(el.dataset.id));
        break;
      case 'match-der':
        manejarMatch('der', Number(el.dataset.id));
        break;
      case 'relacionar-reiniciar':
        iniciarActividadRelacionar(state.actividad?.rondaId || 'calidad');
        break;
      case 'orden-subir':
        moverOrden(Number(el.dataset.i), -1);
        break;
      case 'orden-bajar':
        moverOrden(Number(el.dataset.i), 1);
        break;
      case 'orden-comprobar':
        comprobarOrden();
        break;
      case 'orden-mezclar':
        iniciarActividadOrdenar(state.actividad?.secuenciaId || 'sdlc');
        break;
      case 'pegar': {
        const texto = document.getElementById('texto-pegar')?.value || '';
        prepararCarga(texto, '');
        break;
      }
      case 'confirmar-carga':
        confirmarCarga();
        break;
      case 'cancelar-carga':
        state.preview = null;
        ir('inicio');
        break;
      case 'reanudar':
        if (state.sesion) {
          state.pantalla = 'examen';
          state._ultimaPregunta = null;
          render();
        }
        break;
      case 'descartar-sesion':
        descartarSesion();
        break;
      case 'ver-ultimo':
        if (state.ultimoResultado) {
          state.pantalla = 'resultados';
          state.filtroRevision = 'todas';
          render();
        }
        break;
      case 'estudiar-banco': {
        const banco = bancoPorId(el.dataset.id) || bancoActual();
        if (!banco) {
          toast('No se encontró el banco.', 'error');
          break;
        }
        state.bancoActualId = banco.id;
        state.bancoEditandoId = banco.id;
        ir('estudiar');
        break;
      }
      case 'banco-preguntas': {
        const banco = bancoPorId(el.dataset.id);
        if (!banco) break;
        state.bancoEditandoId = banco.id;
        state.bancoActualId = banco.id;
        ir('preguntas');
        break;
      }
      case 'banco-renombrar':
        abrirModalRenombrar(bancoPorId(el.dataset.id));
        break;
      case 'banco-duplicar':
        duplicarBanco(bancoPorId(el.dataset.id));
        break;
      case 'banco-exportar':
        exportarBanco(bancoPorId(el.dataset.id));
        break;
      case 'banco-eliminar':
        eliminarBanco(bancoPorId(el.dataset.id));
        break;
      case 'banco-nuevo':
        abrirModalBancoNuevo();
        break;
      case 'pregunta-nueva':
        abrirModalPregunta(null);
        break;
      case 'pregunta-editar': {
        const banco = bancoPorId(state.bancoEditandoId) || bancoActual();
        const pregunta = banco?.preguntas.find((p) => String(p.id) === String(el.dataset.pid));
        if (pregunta) abrirModalPregunta(pregunta);
        break;
      }
      case 'pregunta-eliminar': {
        const banco = bancoPorId(state.bancoEditandoId) || bancoActual();
        const pregunta = banco?.preguntas.find((p) => String(p.id) === String(el.dataset.pid));
        if (banco && pregunta) eliminarPregunta(banco, pregunta);
        break;
      }
      case 'salir-examen':
        confirmarSalida(() => {
          state.pantalla = 'inicio';
          render();
        });
        break;
      case 'ayuda':
        abrirAyuda();
        break;
      case 'entregar':
        pedirEntregar();
        break;
      case 'anterior':
        navegar(-1);
        break;
      case 'siguiente': {
        const sesion = state.sesion;
        if (sesion && sesion.actual === sesion.preguntas.length - 1) pedirEntregar();
        else navegar(1);
        break;
      }
      case 'saltar':
        navegar(1, { saltar: true });
        break;
      case 'marcar':
        alternarMarcada();
        break;
      case 'ir-pregunta':
        irPregunta(Number(el.dataset.q));
        break;
      case 'reintentar':
        reintentarPregunta();
        break;
      case 'dificil':
        marcarDificil(el.dataset.pid);
        break;
      case 'filtro-revision':
        state.filtroRevision = el.dataset.filtro || 'todas';
        render({ focus: `[data-filtro="${state.filtroRevision}"]` });
        break;
      case 'reintentar-resultado': {
        const r = state.ultimoResultado;
        const banco = r ? bancoPorId(r.bancoId) : null;
        if (!r || !banco) {
          toast('El banco de este intento ya no existe.', 'error');
          break;
        }
        iniciarSesion(banco, { ...r.cfg, modo: r.modo === 'repaso' ? 'repaso' : r.modo });
        break;
      }
      case 'repasar-errores': {
        const r = state.ultimoResultado;
        const banco = r ? bancoPorId(r.bancoId) : null;
        if (!r || !banco) {
          toast('El banco de este intento ya no existe.', 'error');
          break;
        }
        const pids = (r.falladas || []).map((f) => f.pid);
        if (!pids.length) {
          toast('No hay errores para repasar en este intento.', 'info');
          break;
        }
        iniciarSesion(banco, { ...r.cfg, modo: 'repaso', cantidad: 0, bloque: '__todos__' }, pids);
        break;
      }
      case 'exportar-resultado':
        exportarResultado();
        break;
      case 'borrar-historial':
        borrarHistorial();
        break;
      default:
        break;
    }
  });

  /* ========================================================================
     23. Formularios
     ======================================================================== */

  document.addEventListener('submit', (evento) => {
    const form = evento.target;
    if (form.id === 'form-config') {
      evento.preventDefault();
      empezarDesdeConfig();
      return;
    }

    if (form.id === 'form-pregunta') {
      evento.preventDefault();
      guardarPreguntaForm(form);
      return;
    }

    if (form.id === 'form-calidad') {
      evento.preventDefault();
      comprobarCalidad();
      return;
    }

    if (form.id === 'form-sql') {
      evento.preventDefault();
      comprobarSql();
      return;
    }

    if (form.id === 'form-tp7') {
      evento.preventDefault();
      comprobarTp7();
      return;
    }

    if (form.id === 'form-renombrar') {
      evento.preventDefault();
      const fd = new FormData(form);
      const banco = bancoPorId(String(fd.get('bancoId') || ''));
      const nombre = String(fd.get('nombre') || '').trim();
      if (!banco || !nombre) {
        toast('El nombre no puede estar vacío.', 'error');
        return;
      }
      banco.nombre = nombre;
      if (state.sesion && state.sesion.bancoId === banco.id) {
        state.sesion.bancoNombre = nombre;
        guardarSesion();
      }
      guardarBancos();
      cerrarModal();
      render({ focus: '#titulo-pantalla' });
      toast('Nombre actualizado.', 'ok');
      return;
    }

    if (form.id === 'form-banco-nuevo') {
      evento.preventDefault();
      const fd = new FormData(form);
      const nombre = String(fd.get('nombre') || '').trim() || 'Banco sin nombre';
      const banco = {
        id: uid('b'),
        nombre,
        creado: new Date().toISOString(),
        dificiles: [],
        preguntas: []
      };
      state.bancos.push(banco);
      state.bancoActualId = banco.id;
      state.bancoEditandoId = banco.id;
      guardarBancos();
      cerrarModal();
      state.pantalla = 'preguntas';
      render();
      toast('Banco creado. Agregá tu primera pregunta.', 'ok');
    }
  });

  document.addEventListener('input', (evento) => {
    const el = evento.target;
    if (el && el.id === 'sql-respuesta' && state.pantalla === 'sql') {
      state.sql.borrador = el.value;
      return;
    }
    if (el && el.id === 'tp7-respuesta' && state.pantalla === 'tp7') {
      state.tp7.borrador = el.value;
      state.tp7.resultado = null;
      return;
    }
    if (!el || !el.name || !/^opcion[0-3]$/.test(el.name)) return;
    const form = el.form;
    if (!form || form.id !== 'form-pregunta') return;
    const select = form.querySelector('#p-correcta');
    if (!select) return;
    const letras = ['a', 'b', 'c', 'd'];
    Array.from(select.options).forEach((opcion, i) => {
      const input = form.elements[`opcion${i}`];
      const texto = input ? String(input.value || '').trim() : '';
      opcion.textContent = `${letras[i]}) ${texto || '—'}`;
    });
  });

  document.addEventListener('change', (evento) => {
    const el = evento.target;

    if (el.id === 'input-archivo') {
      const archivo = el.files?.[0];
      el.value = '';
      if (archivo) leerArchivo(archivo);
      return;
    }

    if (el.matches('input[name="opcion"]')) {
      manejarOpcion(Number(el.value));
      return;
    }

    if (el.id === 'cfg-banco') {
      capturarConfig();
      state.bancoActualId = el.value;
      state.bancoEditandoId = el.value;
      const banco = bancoPorId(el.value);
      if (banco) {
        const bloques = bloquesDeBanco(banco);
        if (state.prefs.bloque !== '__todos__' && !bloques.includes(state.prefs.bloque)) {
          state.prefs.bloque = '__todos__';
        }
        if (state.prefs.cantidad >= preguntasUsables(banco).length) {
          state.prefs.cantidad = 0;
        }
      }
      guardarPrefs();
      render({ focus: '#cfg-banco' });
      return;
    }

    if (el.closest('#form-config')) {
      capturarConfig();
      actualizarResumenConfig();
    }
  });

  /* ========================================================================
     24. Teclado
     ======================================================================== */

  document.addEventListener('keydown', (evento) => {
    const modal = document.getElementById('modal');
    if (modal && modal.open) return;

    const objetivo = evento.target;
    if (objetivo && objetivo.id === 'sql-respuesta' && (evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      evento.preventDefault();
      document.getElementById('form-sql')?.requestSubmit();
      return;
    }
    if (objetivo && objetivo.id === 'tp7-respuesta' && (evento.ctrlKey || evento.metaKey) && evento.key === 'Enter') {
      evento.preventDefault();
      document.getElementById('form-tp7')?.requestSubmit();
      return;
    }
    const esCampo = objetivo && (
      objetivo.tagName === 'TEXTAREA' ||
      objetivo.tagName === 'SELECT' ||
      (objetivo.tagName === 'INPUT' && !['radio', 'checkbox', 'button'].includes(objetivo.type))
    );
    if (esCampo) return;

    if (state.pantalla !== 'examen' || !state.sesion) return;

    const sesion = state.sesion;
    const pregunta = sesion.preguntas[sesion.actual];
    if (!pregunta) return;
    const tecla = evento.key;

    if (tecla === '?' || (tecla === '/' && evento.shiftKey)) {
      evento.preventDefault();
      abrirAyuda();
      return;
    }

    if (tecla === 'm' || tecla === 'M') {
      evento.preventDefault();
      alternarMarcada();
      return;
    }

    if (tecla === 'Enter' || tecla === 'ArrowRight') {
      if (tecla === 'Enter' && objetivo.closest('button, a')) return;
      evento.preventDefault();
      if (sesion.actual === sesion.preguntas.length - 1) pedirEntregar();
      else navegar(1);
      return;
    }

    if (tecla === 'ArrowLeft') {
      evento.preventDefault();
      navegar(-1);
      return;
    }

    if (/^[1-4]$/.test(tecla)) {
      evento.preventDefault();
      manejarOpcion(Number(tecla) - 1);
      return;
    }

    if (/^[a-dA-D]$/.test(tecla)) {
      evento.preventDefault();
      manejarOpcion(tecla.toLowerCase().charCodeAt(0) - 97);
    }
  });

  /* ========================================================================
     25. Arranque
     ======================================================================== */

  function init() {
    aplicarTema();
    render();
    if (state.sesion) {
      window.setTimeout(abrirModalRetomar, 350);
    }
  }

  ['dragover', 'drop'].forEach((tipo) => {
    document.addEventListener(tipo, (evento) => {
      const tipos = evento.dataTransfer && Array.from(evento.dataTransfer.types || []);
      if (tipos && tipos.includes('Files')) evento.preventDefault();
    });
  });

  // API mínima de diagnóstico (útil para probar el parser desde la consola).
  window.Estudio = Object.freeze({
    version: '1.0.0',
    parsearBanco,
    parsearMarkdown,
    parsearJSON,
    estado: () => JSON.parse(JSON.stringify(state))
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
