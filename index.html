  <script>
/* ==========================================================================
   Estudio · aplicación completa en un solo archivo
   Secciones: utilidades · almacenamiento · tema · parser · estado · vistas ·
   acciones · temporizador · arranque.
   ========================================================================== */
(function () {
  'use strict';

  /* ========================================================================
     1. Utilidades
     ======================================================================== */

  const $ = (sel, raiz = document) => raiz.querySelector(sel);
  const $$ = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));

  const uid = (prefijo = 'id') =>
    `${prefijo}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

  function escapeHtml(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));
  }

  /**
   * Markdown inline mínimo y seguro: primero escapa todo el HTML y después
   * aplica negrita, cursiva y código. Nunca se inserta HTML del usuario.
   */
  function renderInline(texto) {
    const crudo = String(texto == null ? '' : texto).replace(/\u0000/g, '');
    const codigos = [];
    let s = escapeHtml(crudo);

    s = s.replace(/`([^`]+)`/g, (_m, codigo) => {
      codigos.push(codigo);
      return `\u0000${codigos.length - 1}\u0000`;
    });

    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])__([^_]+)__(?=[\s.,;:!?)]|$)/g, '$1<strong>$2</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,;:!?)]|$)/g, '$1<em>$2</em>');

    s = s.replace(/\u0000(\d+)\u0000/g, (_m, i) => `<code>${codigos[Number(i)]}</code>`);
    return s;
  }

  function renderMarkdown(texto) {
    return String(texto == null ? '' : texto)
      .split(/\r?\n/)
      .map((linea) => renderInline(linea))
      .join('<br>');
  }

  function formatearTiempo(segundos) {
    const s = Math.max(0, Math.round(Number(segundos) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${m}:${String(r).padStart(2, '0')}`;
  }

  function formatearFecha(iso) {
    try {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleString('es-AR', { dateStyle: 'medium', timeStyle: 'short' });
    } catch {
      return '—';
    }
  }

  function fechaCorta(iso) {
    try {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
    } catch {
      return '';
    }
  }

  function plural(n, singular, plural_) {
    return `${n} ${n === 1 ? singular : plural_ || `${singular}s`}`;
  }

  function shuffle(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function slug(texto) {
    return String(texto || 'banco')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'banco';
  }

  function reducido() {
    return typeof window.matchMedia === 'function' &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function descargar(nombre, contenido, tipo = 'application/json') {
    try {
      const blob = new Blob([contenido], { type: `${tipo};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      return true;
    } catch (error) {
      toast('No se pudo generar la descarga.', 'error');
      return false;
    }
  }

  let anuncioTimer = 0;
  function anunciar(mensaje) {
    const region = document.getElementById('anuncio');
    if (!region) return;
    region.textContent = '';
    window.clearTimeout(anuncioTimer);
    anuncioTimer = window.setTimeout(() => {
      region.textContent = String(mensaje);
    }, 60);
  }

  function toast(mensaje, tipo = 'info') {
    const contenedor = document.getElementById('toasts');
    if (!contenedor) return;
    while (contenedor.children.length >= 3) contenedor.firstElementChild.remove();
    const iconos = { ok: '✓', error: '!', info: '·' };
    const div = document.createElement('div');
    div.className = `toast toast-${tipo}`;
    div.innerHTML =
      `<span class="toast-icono" aria-hidden="true">${iconos[tipo] || '·'}</span>` +
      `<span>${escapeHtml(mensaje)}</span>`;
    contenedor.appendChild(div);
    window.setTimeout(() => div.remove(), 4200);
  }


  /* ========================================================================
     2. Almacenamiento y normalización de datos
     ======================================================================== */

  const K = {
    bancos: 'estudio.bancos.v1',
    historial: 'estudio.historial.v1',
    sesion: 'estudio.sesion.v1',
    tema: 'estudio.tema.v1',
    prefs: 'estudio.prefs.v1',
    ultimo: 'estudio.ultimoResultado.v1',
    seedIngenieria: 'estudio.seed.ingenieria.v1',
    sqlProgreso: 'estudio.sql.progreso.v1',
    tp7Progreso: 'estudio.tp7.jardineria.v1'
  };

  const PREFS_DEFECTO = {
    modo: 'practica',
    cantidad: 0,
    bloque: '__todos__',
    ordenPreguntas: true,
    ordenOpciones: false,
    mostrarTemporizador: true,
    minutosPorPregunta: 1
  };

  let almacenamientoOK = true;
  let avisoAlmacen = false;

  try {
    const prueba = '__estudio_prueba__';
    localStorage.setItem(prueba, '1');
    localStorage.removeItem(prueba);
  } catch {
    almacenamientoOK = false;
  }

  function safeGet(clave, defecto) {
    try {
      const crudo = localStorage.getItem(clave);
      if (crudo == null || crudo === '') return defecto;
      const valor = JSON.parse(crudo);
      return valor == null ? defecto : valor;
    } catch {
      return defecto;
    }
  }

  function safeSet(clave, valor, silencioso = false) {
    if (!almacenamientoOK) {
      if (!silencioso && !avisoAlmacen) {
        avisoAlmacen = true;
        toast('Tu navegador bloqueó el almacenamiento local. La app funciona, pero no guarda datos.', 'error');
      }
      return false;
    }
    try {
      localStorage.setItem(clave, JSON.stringify(valor));
      return true;
    } catch {
      if (!silencioso && !avisoAlmacen) {
        avisoAlmacen = true;
        toast('No se pudo guardar en el navegador (espacio lleno o modo privado).', 'error');
      }
      return false;
    }
  }

  function safeRemove(clave) {
    try { localStorage.removeItem(clave); } catch { /* sin acceso */ }
  }

  function normalizarPregunta(p, indice) {
    if (!p || typeof p !== 'object') return null;
    const enunciado = typeof p.enunciado === 'string' ? p.enunciado.trim() : '';
    if (!enunciado) return null;
    const opciones = [];
    const mapaOpciones = [];
    (Array.isArray(p.opciones) ? p.opciones : []).forEach((o, i) => {
      const texto = String(o == null ? '' : o).trim();
      if (texto) {
        opciones.push(texto);
        mapaOpciones.push(i);
      }
    });
    if (opciones.length < 2) return null;
    const correctaOriginal = Number.isInteger(p.correcta) ? p.correcta : -1;
    const correctaVisible = mapaOpciones.indexOf(correctaOriginal);
    let correcta = correctaVisible >= 0 ? correctaVisible : -1;
    return {
      id: String(p.id == null ? indice + 1 : p.id),
      nro: Number.isInteger(p.nro) ? p.nro : indice + 1,
      bloque: typeof p.bloque === 'string' ? p.bloque.trim() : '',
      enunciado,
      opciones,
      correcta,
      explicacion: typeof p.explicacion === 'string' ? p.explicacion.trim() : '',
      sinClave: correcta < 0
    };
  }

  function normalizarBancos(crudo) {
    if (!Array.isArray(crudo)) return [];
    return crudo.map((b, i) => {
      if (!b || typeof b !== 'object') return null;
      const preguntas = (Array.isArray(b.preguntas) ? b.preguntas : [])
        .map((p, j) => normalizarPregunta(p, j))
        .filter(Boolean);
      const ids = new Set();
      preguntas.forEach((p, j) => {
        let id = p.id;
        while (ids.has(id)) id = `${p.id}-${j}`;
        ids.add(id);
        p.id = id;
      });
      return {
        id: String(b.id || uid('b')),
        nombre: String(b.nombre || 'Banco sin nombre'),
        creado: typeof b.creado === 'string' ? b.creado : new Date().toISOString(),
        dificiles: Array.isArray(b.dificiles) ? b.dificiles.map(String) : [],
        preguntas
      };
    }).filter(Boolean);
  }

  function normalizarHistorial(crudo) {
    if (!Array.isArray(crudo)) return [];
    const numero = (valor, porDefecto = 0) => (Number.isFinite(Number(valor)) ? Number(valor) : porDefecto);
    return crudo
      .filter((a) => a && typeof a === 'object' && Number.isFinite(Number(a.porcentaje)))
      .map((a) => ({
        id: String(a.id || uid('r')),
        fecha: typeof a.fecha === 'string' ? a.fecha : new Date().toISOString(),
        bancoId: String(a.bancoId || ''),
        bancoNombre: String(a.bancoNombre || 'Banco'),
        modo: ['practica', 'examen', 'repaso'].includes(a.modo) ? a.modo : 'practica',
        total: numero(a.total),
        correctas: numero(a.correctas),
        incorrectas: numero(a.incorrectas),
        sinResponder: numero(a.sinResponder),
        porcentaje: Math.max(0, Math.min(100, numero(a.porcentaje))),
        duracionSeg: Math.max(0, numero(a.duracionSeg)),
        promedioSeg: Math.max(0, numero(a.promedioSeg)),
        porBloque: Array.isArray(a.porBloque) ? a.porBloque : [],
        falladas: Array.isArray(a.falladas) ? a.falladas : [],
        cfg: a.cfg && typeof a.cfg === 'object' ? a.cfg : { ...PREFS_DEFECTO }
      }))
      .slice(-200);
  }

  function normalizarSesion(crudo) {
    if (!crudo || typeof crudo !== 'object') return null;
    if (!Array.isArray(crudo.preguntas) || !crudo.preguntas.length) return null;
    if (!['practica', 'examen', 'repaso'].includes(crudo.modo)) return null;

    const preguntas = [];
    const respuestas = [];
    const marcadas = [];
    const marcadasOriginales = new Set(
      Array.isArray(crudo.marcadas) ? crudo.marcadas.filter((i) => Number.isInteger(i)) : []
    );
    const actualOriginal = Number.isInteger(crudo.actual) ? crudo.actual : 0;
    let actualNuevo = null;

    crudo.preguntas.forEach((q, i) => {
      if (!q || typeof q.enunciado !== 'string' || !Array.isArray(q.opciones)) return;
      const mapa = [];
      const opciones = [];
      q.opciones.forEach((o, j) => {
        const texto = String(o && o.texto != null ? o.texto : '');
        if (texto) {
          opciones.push({ texto, ok: !!(o && o.ok) });
          mapa.push(j);
        }
      });
      if (opciones.length < 2) return;
      if (opciones.filter((o) => o.ok).length !== 1) return;

      const indiceNuevo = preguntas.length;
      preguntas.push({
        pid: String(q.pid == null ? '' : q.pid),
        nro: Number.isInteger(q.nro) ? q.nro : 0,
        bloque: typeof q.bloque === 'string' ? q.bloque : '',
        enunciado: q.enunciado,
        opciones,
        explicacion: typeof q.explicacion === 'string' ? q.explicacion : ''
      });

      const r = crudo.respuestas && crudo.respuestas[i];
      const rVisible = Number.isInteger(r) ? mapa.indexOf(r) : -1;
      respuestas.push(rVisible >= 0 ? rVisible : null);
      if (marcadasOriginales.has(i)) marcadas.push(indiceNuevo);
      if (i === actualOriginal) actualNuevo = indiceNuevo;
    });

    if (!preguntas.length) return null;
    const n = preguntas.length;
    const limite = Number.isFinite(crudo.limiteSeg) && crudo.limiteSeg > 0
      ? Math.round(crudo.limiteSeg)
      : null;

    return {
      id: String(crudo.id || uid('s')),
      bancoId: String(crudo.bancoId || ''),
      bancoNombre: String(crudo.bancoNombre || ''),
      modo: crudo.modo,
      cfg: crudo.cfg && typeof crudo.cfg === 'object' ? crudo.cfg : { ...PREFS_DEFECTO },
      preguntas,
      respuestas,
      marcadas,
      actual: actualNuevo != null && actualNuevo >= 0 && actualNuevo < n ? actualNuevo : 0,
      limiteSeg: limite,
      restanteSeg: limite == null
        ? null
        : (Number.isFinite(Number(crudo.restanteSeg)) ? Math.max(0, Number(crudo.restanteSeg)) : limite),
      iniciadoEn: Number.isFinite(crudo.iniciadoEn) ? crudo.iniciadoEn : Date.now(),
      mostrarTemporizador: crudo.mostrarTemporizador !== false
    };
  }

  function normalizarResultado(crudo) {
    if (!crudo || typeof crudo !== 'object') return null;
    if (!Array.isArray(crudo.detalle) || !Number.isFinite(Number(crudo.porcentaje))) return null;
    const numero = (valor, porDefecto = 0) => (Number.isFinite(Number(valor)) ? Number(valor) : porDefecto);
    const detalle = crudo.detalle
      .filter((d) => d && typeof d === 'object' && Array.isArray(d.opciones))
      .map((d) => ({
        pid: String(d.pid == null ? '' : d.pid),
        nro: Number.isInteger(d.nro) ? d.nro : 0,
        bloque: typeof d.bloque === 'string' ? d.bloque : 'Sin bloque',
        enunciado: typeof d.enunciado === 'string' ? d.enunciado : '',
        opciones: d.opciones.map((o) => String(o == null ? '' : o)),
        correcta: Number.isInteger(d.correcta) ? d.correcta : -1,
        respuesta: Number.isInteger(d.respuesta) ? d.respuesta : null,
        explicacion: typeof d.explicacion === 'string' ? d.explicacion : '',
        acierto: !!d.acierto,
        sinResponder: !!d.sinResponder,
        marcada: !!d.marcada
      }));
    if (!detalle.length) return null;
    return {
      ...crudo,
      fecha: typeof crudo.fecha === 'string' ? crudo.fecha : new Date().toISOString(),
      bancoNombre: String(crudo.bancoNombre || 'Sesión'),
      modo: ['practica', 'examen', 'repaso'].includes(crudo.modo) ? crudo.modo : 'practica',
      cfg: crudo.cfg && typeof crudo.cfg === 'object' ? crudo.cfg : { ...PREFS_DEFECTO },
      automatico: !!crudo.automatico,
      total: numero(crudo.total, detalle.length),
      correctas: numero(crudo.correctas),
      incorrectas: numero(crudo.incorrectas),
      sinResponder: numero(crudo.sinResponder),
      porcentaje: Math.max(0, Math.min(100, numero(crudo.porcentaje))),
      duracionSeg: Math.max(0, numero(crudo.duracionSeg)),
      promedioSeg: Math.max(0, numero(crudo.promedioSeg)),
      porBloque: Array.isArray(crudo.porBloque) ? crudo.porBloque : [],
      detalle,
      falladas: Array.isArray(crudo.falladas) ? crudo.falladas : [],
      marcadas: Array.isArray(crudo.marcadas) ? crudo.marcadas : []
    };
  }

  /* ========================================================================
     3. Tema (automático por sistema, con preferencia manual)
     ======================================================================== */

  const mqOscuro = window.matchMedia
    ? window.matchMedia('(prefers-color-scheme: dark)')
    : { matches: true, addEventListener: null };

  function cargarTema() {
    const guardado = safeGet(K.tema, 'auto');
    return ['auto', 'claro', 'oscuro'].includes(guardado) ? guardado : 'auto';
  }

  function temaResuelto(pref) {
    if (pref === 'claro') return 'light';
    if (pref === 'oscuro') return 'dark';
    return mqOscuro.matches ? 'dark' : 'light';
  }

  function aplicarTema() {
    const resuelto = temaResuelto(state.tema);
    document.documentElement.dataset.theme = resuelto;
    document.documentElement.style.colorScheme = resuelto;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resuelto === 'dark' ? '#0B0E14' : '#F4F6FB');

    const boton = document.getElementById('btn-tema');
    if (boton) {
      const iconos = { auto: '◐', claro: '☼', oscuro: '☾' };
      const etiquetas = { auto: 'automático', claro: 'claro', oscuro: 'oscuro' };
      boton.textContent = iconos[state.tema];
      boton.setAttribute('aria-label', `Tema ${etiquetas[state.tema]}. Cambiar tema`);
      boton.setAttribute('title', `Tema ${etiquetas[state.tema]}`);
    }
  }

  function cicloTema() {
    const orden = ['auto', 'claro', 'oscuro'];
    const siguiente = orden[(orden.indexOf(state.tema) + 1) % orden.length];
    state.tema = siguiente;
    safeSet(K.tema, siguiente, true);
    aplicarTema();
    const etiquetas = { auto: 'automático (según el sistema)', claro: 'claro', oscuro: 'oscuro' };
    toast(`Tema ${etiquetas[siguiente]}.`, 'ok');
  }

  mqOscuro.addEventListener?.('change', () => {
    if (state.tema === 'auto') aplicarTema();
  });


  /* ========================================================================
     4. Parser tolerante de Markdown y JSON
     ======================================================================== */

  const RE_ENCABEZADO = /^(#{1,6})\s+(.+?)\s*$/;
  const RE_PREGUNTA = /^#{1,6}\s*preguntas?\s*(?:n[°º]?\.?\s*)?(\d+)\b\s*[:.)\-–—]?\s*(.*)$/i;
  const RE_OPCION = /^\s*(?:[-*+]\s*)?([a-dA-D])\s*[).:\-–—]\s*(.+)$/;
  const RE_CLAVE = /^#{1,6}\s*(?:clave(?:\s+de\s+respuestas)?|respuestas|solucionario)\b/i;
  const RE_TRAMPA = /^#{1,6}\s*(?:qu[eé]\s+trampas?|trampas?\b|explicaci[oó]n(?:es)?(?:\s+(?:de\s+)?(?:las?\s+)?(?:respuestas|preguntas|trampas))?\s*$)/i;
  const RE_NO_BLOQUE = /^(instrucciones|indicaciones|consignas?|notas?|introducci[oó]n|objetivos?|contenidos?|bibliograf[ií]a|material(?:es)?|temario|[ií]ndice)\b/i;

  function limpiarBloque(texto) {
    const original = String(texto || '').replace(/[*_`#]/g, '').trim();
    const limpio = original
      .replace(/^bloque\s*\d+\s*[–—\-:.)]*\s*/i, '')
      .trim();
    return limpio || original;
  }

  function parsearClave(lineas, idxClave) {
    const mapa = new Map();
    if (idxClave < 0) return mapa;

    let fin = lineas.length;
    for (let i = idxClave + 1; i < lineas.length; i += 1) {
      if (RE_ENCABEZADO.test(lineas[i])) { fin = i; break; }
    }

    for (let i = idxClave + 1; i < fin; i += 1) {
      const linea = lineas[i].trim();
      if (!linea) continue;

      if (linea.startsWith('|')) {
        const celdas = linea.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
        for (let j = 0; j + 1 < celdas.length; j += 2) {
          const nTxt = celdas[j].replace(/[^\d]/g, '');
          const rTxt = celdas[j + 1].replace(/[^a-dA-D]/g, '').toLowerCase();
          if (nTxt && rTxt.length === 1) {
            mapa.set(parseInt(nTxt, 10), rTxt.charCodeAt(0) - 97);
          }
        }
      } else {
        const m = linea.match(/^(\d+)\s*[.)\-:]?\s*[-–—]?\s*([a-dA-D])\b/);
        if (m) mapa.set(parseInt(m[1], 10), m[2].toLowerCase().charCodeAt(0) - 97);
      }
    }
    return mapa;
  }

  function parsearExplicaciones(lineas, idxTrampa) {
    const mapa = new Map();
    if (idxTrampa < 0) return mapa;

    let fin = lineas.length;
    for (let i = idxTrampa + 1; i < lineas.length; i += 1) {
      if (RE_ENCABEZADO.test(lineas[i])) { fin = i; break; }
    }

    let actual = null;
    for (let i = idxTrampa + 1; i < fin; i += 1) {
      const linea = lineas[i];
      const m = linea.match(/^\s*(\d+)\s*[.)\-:]\s+(.+)$/);
      if (m) {
        actual = parseInt(m[1], 10);
        mapa.set(actual, m[2].trim());
        continue;
      }
      if (actual != null) {
        const t = linea.trim();
        if (t) mapa.set(actual, `${mapa.get(actual)} ${t}`.trim());
      }
    }
    return mapa;
  }

  function parsearCuerpo(cuerpo) {
    const enunciado = [];
    const opciones = [];

    for (const crudo of cuerpo) {
      const t = String(crudo).trim();
      if (!t) {
        if (!opciones.length && enunciado.length && enunciado[enunciado.length - 1] !== '') {
          enunciado.push('');
        }
        continue;
      }
      if (t.startsWith('>')) continue;

      const m = t.match(RE_OPCION);
      if (m) {
        const letra = m[1].toLowerCase().charCodeAt(0) - 97;
        if (!opciones.length && letra === 0) {
          opciones.push(m[2].trim());
          continue;
        }
        if (opciones.length && letra < opciones.length) {
          opciones[letra] = `${opciones[letra]} ${m[2].trim()}`.trim();
          continue;
        }
        if (opciones.length && letra < 4) {
          while (opciones.length < letra) opciones.push('');
          opciones.push(m[2].trim());
          continue;
        }
      }

      if (opciones.length) {
        opciones[opciones.length - 1] = `${opciones[opciones.length - 1]} ${t}`.trim();
      } else {
        enunciado.push(t);
      }
    }

    while (enunciado.length && !enunciado[0]) enunciado.shift();
    while (enunciado.length && !enunciado[enunciado.length - 1]) enunciado.pop();

    return {
      enunciado: enunciado.join('\n').replace(/\n{3,}/g, '\n\n').trim(),
      opciones
    };
  }

  function parsearMarkdown(texto, nombreSugerido = '') {
    const errores = [];
    const advertencias = [];
    const lineas = String(texto)
      .replace(/^\uFEFF/, '')
      .replace(/\r\n?/g, '\n')
      .split('\n');

    const idxClave = lineas.findIndex((l) => RE_CLAVE.test(l));
    const idxTrampa = lineas.findIndex((l) => RE_TRAMPA.test(l));
    const clave = parsearClave(lineas, idxClave);
    const explicaciones = parsearExplicaciones(lineas, idxTrampa);

    const crudas = [];
    let bloqueActual = '';
    let actual = null;

    for (let i = 0; i < lineas.length; i += 1) {
      if (i === idxClave || i === idxTrampa) break;
      const linea = lineas[i];

      const mP = linea.match(RE_PREGUNTA);
      if (mP) {
        if (actual) crudas.push(actual);
        const inicial = (mP[2] || '').trim();
        actual = {
          nro: parseInt(mP[1], 10),
          bloque: bloqueActual,
          cuerpo: inicial ? [inicial] : []
        };
        continue;
      }

      const mH = linea.match(RE_ENCABEZADO);
      if (mH) {
        if (RE_CLAVE.test(linea) || RE_TRAMPA.test(linea)) break;
        const nivel = mH[1].length;
        if (nivel >= 2 && !RE_NO_BLOQUE.test(mH[2])) {
          bloqueActual = limpiarBloque(mH[2]);
        }
        continue;
      }

      if (actual) actual.cuerpo.push(linea);
    }
    if (actual) crudas.push(actual);

    if (!crudas.length) {
      errores.push({ nro: 0, msg: 'No se detectó ninguna pregunta. Se esperaba un encabezado como "### Pregunta 1".' });
    }
    if (idxClave < 0) {
      advertencias.push({ nro: 0, msg: 'No se encontró la sección "CLAVE DE RESPUESTAS". Las preguntas quedarán sin respuesta correcta.' });
    }

    const preguntas = [];
    const numerosVistos = new Set();
    const conteoIds = new Map();

    for (const cruda of crudas) {
      const { enunciado, opciones } = parsearCuerpo(cruda.cuerpo);
      const nro = cruda.nro;

      if (numerosVistos.has(nro)) {
        advertencias.push({ nro, msg: `El número de pregunta ${nro} está repetido.` });
      }
      numerosVistos.add(nro);

      if (!enunciado) {
        errores.push({ nro, msg: 'No tiene enunciado; se omitió.' });
        continue;
      }
      if (opciones.filter(Boolean).length < 2) {
        errores.push({ nro, msg: 'Tiene menos de 2 opciones con texto; se omitió.' });
        continue;
      }

      const opcionesLimpias = [];
      const mapaIndices = [];
      opciones.forEach((opcion, indice) => {
        if (opcion && opcion.trim()) {
          opcionesLimpias.push(opcion.trim());
          mapaIndices.push(indice);
        }
      });

      let correcta = -1;
      let sinClave = false;
      if (!clave.has(nro)) {
        sinClave = true;
        advertencias.push({ nro, msg: 'No se encontró su respuesta en la clave. Se guarda, pero no se usa en práctica ni examen.' });
      } else {
        const original = clave.get(nro);
        const indiceVisible = mapaIndices.indexOf(original);
        if (indiceVisible === -1) {
          sinClave = true;
          advertencias.push({ nro, msg: 'La clave apunta a una opción que no existe en la pregunta. Se guarda sin clave.' });
        } else {
          correcta = indiceVisible;
        }
      }

      const repeticiones = (conteoIds.get(nro) || 0) + 1;
      conteoIds.set(nro, repeticiones);
      const id = repeticiones === 1 ? String(nro) : `${nro}-${repeticiones}`;

      preguntas.push({
        id,
        nro,
        bloque: cruda.bloque,
        enunciado,
        opciones: opcionesLimpias,
        correcta,
        explicacion: explicaciones.get(nro) || '',
        sinClave
      });
    }

    for (const nro of clave.keys()) {
      if (!numerosVistos.has(nro)) {
        advertencias.push({ nro, msg: `La clave incluye la pregunta ${nro}, pero no se encontró esa pregunta en el texto.` });
      }
    }

    const bloques = [...new Set(preguntas.map((p) => p.bloque).filter(Boolean))];

    return {
      formato: 'markdown',
      nombre: nombreSugerido || '',
      preguntas,
      errores,
      advertencias,
      bloques
    };
  }

  function parsearJSON(texto, nombreSugerido = '') {
    const errores = [];
    const advertencias = [];
    let data;

    try {
      data = JSON.parse(String(texto).replace(/^\uFEFF/, ''));
    } catch (error) {
      return {
        formato: 'json',
        nombre: nombreSugerido || '',
        preguntas: [],
        errores: [{ nro: 0, msg: `El JSON no es válido: ${error.message}` }],
        advertencias,
        bloques: []
      };
    }

    let lista;
    let nombre = nombreSugerido || '';
    if (Array.isArray(data)) {
      lista = data;
    } else if (data && typeof data === 'object' && Array.isArray(data.preguntas)) {
      lista = data.preguntas;
      nombre = String(data.nombre || data.titulo || nombreSugerido || '');
    } else {
      return {
        formato: 'json',
        nombre,
        preguntas: [],
        errores: [{ nro: 0, msg: 'El JSON debe ser una lista de preguntas o un objeto con la propiedad "preguntas".' }],
        advertencias,
        bloques: []
      };
    }

    const preguntas = [];
    const conteoIds = new Map();

    lista.forEach((item, i) => {
      const nro = i + 1;
      if (!item || typeof item !== 'object') {
        errores.push({ nro, msg: 'El elemento no es un objeto; se omitió.' });
        return;
      }

      const enunciado = String(item.enunciado ?? item.pregunta ?? item.texto ?? '').trim();
      if (!enunciado) {
        errores.push({ nro, msg: 'No tiene enunciado; se omitió.' });
        return;
      }

      let opcionesCrudas = item.opciones ?? item.options ?? item.alternativas ?? [];
      let opciones;
      if (Array.isArray(opcionesCrudas)) {
        opciones = opcionesCrudas.map((o) => String(o == null ? '' : o).trim());
      } else if (opcionesCrudas && typeof opcionesCrudas === 'object') {
        opciones = Object.values(opcionesCrudas).map((o) => String(o == null ? '' : o).trim());
      } else {
        opciones = [];
      }

      if (opciones.filter(Boolean).length < 2) {
        errores.push({ nro, msg: 'Tiene menos de 2 opciones con texto; se omitió.' });
        return;
      }

      const opcionesLimpias = [];
      const mapaIndices = [];
      opciones.forEach((opcion, indice) => {
        if (opcion) {
          opcionesLimpias.push(opcion);
          mapaIndices.push(indice);
        }
      });

      const correctaRaw = item.correcta ?? item.respuesta ?? item.correctaIndice;
      let correctaOriginal = -1;
      if (typeof correctaRaw === 'number' && Number.isInteger(correctaRaw)) {
        correctaOriginal = correctaRaw;
      } else if (typeof correctaRaw === 'string') {
        const t = correctaRaw.trim().toLowerCase();
        if (/^[a-d]$/.test(t)) correctaOriginal = t.charCodeAt(0) - 97;
        else if (/^\d+$/.test(t)) correctaOriginal = parseInt(t, 10);
      }

      let correcta = -1;
      if (correctaOriginal < 0) {
        advertencias.push({ nro, msg: 'No tiene una respuesta correcta válida. Se guarda sin clave.' });
      } else {
        const indiceVisible = mapaIndices.indexOf(correctaOriginal);
        if (indiceVisible === -1) {
          advertencias.push({ nro, msg: 'La respuesta correcta está fuera de rango. Se guarda sin clave.' });
        } else {
          correcta = indiceVisible;
        }
      }

      const idBase = String(item.id == null ? nro : item.id);
      const repeticiones = (conteoIds.get(idBase) || 0) + 1;
      conteoIds.set(idBase, repeticiones);
      const id = repeticiones === 1 ? idBase : `${idBase}-${repeticiones}`;

      preguntas.push({
        id,
        nro,
        bloque: String(item.bloque ?? item.tema ?? item.unidad ?? '').trim(),
        enunciado,
        opciones: opcionesLimpias,
        correcta,
        explicacion: String(item.explicacion ?? item.explicación ?? item.explanation ?? '').trim(),
        sinClave: correcta < 0
      });
    });

    if (!lista.length) {
      errores.push({ nro: 0, msg: 'La lista de preguntas está vacía.' });
    }

    const bloques = [...new Set(preguntas.map((p) => p.bloque).filter(Boolean))];

    return {
      formato: 'json',
      nombre,
      preguntas,
      errores,
      advertencias,
      bloques
    };
  }

  function parsearBanco(texto, nombreSugerido = '') {
    const limpio = String(texto == null ? '' : texto).replace(/^\uFEFF/, '').trim();
    if (!limpio) {
      return {
        formato: 'desconocido',
        nombre: nombreSugerido,
        preguntas: [],
        errores: [{ nro: 0, msg: 'El contenido está vacío.' }],
        advertencias: [],
        bloques: []
      };
    }
    const pareceJSON = limpio.startsWith('{') || limpio.startsWith('[');
    return pareceJSON
      ? parsearJSON(limpio, nombreSugerido)
      : parsearMarkdown(limpio, nombreSugerido);
  }

  function filasSql(tabla, columnas, filtro) {
    const t = SQL_VENTAS[tabla];
    if (!t) return [];
    return t.filas
      .map((fila) => Object.fromEntries(t.columnas.map((c, i) => [c, fila[i]])))
      .filter(filtro || (() => true))
      .map((obj) => columnas.map((c) => obj[c]));
  }

  function resultadoSql(tabla, columnas, filtro) {
    return { columnas, filas: filasSql(tabla, columnas, filtro) };
  }

  function pidsFalladosDeBanco(bancoId) {
    const set = new Set();
    state.historial.forEach((intento) => {
      if (intento.bancoId !== bancoId) return;
      (Array.isArray(intento.falladas) ? intento.falladas : []).forEach((f) => {
        if (f && f.pid != null) set.add(String(f.pid));
      });
    });
    return set;
  }

  function contarDisponibles(banco, cfg) {
    const usables = preguntasUsables(banco);
    let pool = usables;
    if (cfg.bloque && cfg.bloque !== '__todos__') {
      pool = pool.filter((p) => (p.bloque || 'Sin bloque') === cfg.bloque);
    }
    if (cfg.modo === 'repaso') {
      const falladas = pidsFalladosDeBanco(banco.id);
      const dificiles = new Set(banco.dificiles.map(String));
      pool = pool.filter((p) => falladas.has(String(p.id)) || dificiles.has(String(p.id)));
    }
    const total = pool.length;
    const usadas = cfg.cantidad > 0 ? Math.min(cfg.cantidad, total) : total;
    return {
      total,
      usadas,
      sinClave: banco.preguntas.filter((p) => p.sinClave).length,
      sinUsar: banco.preguntas.length - usables.length
    };
  }

  function construirSesion(banco, cfg, pidsOverride = null) {
    let pool = preguntasUsables(banco);

    if (cfg.bloque && cfg.bloque !== '__todos__') {
      pool = pool.filter((p) => (p.bloque || 'Sin bloque') === cfg.bloque);
    }

    if (cfg.modo === 'repaso') {
      const falladas = pidsFalladosDeBanco(banco.id);
      const dificiles = new Set(banco.dificiles.map(String));
      pool = pool.filter((p) => falladas.has(String(p.id)) || dificiles.has(String(p.id)));
    }

    if (Array.isArray(pidsOverride) && pidsOverride.length) {
      const set = new Set(pidsOverride.map(String));
      pool = pool.filter((p) => set.has(String(p.id)));
    }

    if (!pool.length) return null;

    const ordenOriginal = new Map(pool.map((p, i) => [p, i]));
    let seleccion = pool.slice();

    if (cfg.cantidad > 0 && cfg.cantidad < seleccion.length) {
      seleccion = shuffle(seleccion).slice(0, cfg.cantidad);
      if (!cfg.ordenPreguntas) {
        seleccion.sort((a, b) => ordenOriginal.get(a) - ordenOriginal.get(b));
      }
    } else if (cfg.ordenPreguntas) {
      seleccion = shuffle(seleccion);
    }

    const preguntas = seleccion.map((p) => {
      let opciones = p.opciones.map((texto, indice) => ({
        texto,
        ok: indice === p.correcta
      }));
      if (cfg.ordenOpciones) opciones = shuffle(opciones);
      return {
        pid: String(p.id),
        nro: p.nro,
        bloque: p.bloque || '',
        enunciado: p.enunciado,
        opciones,
        explicacion: p.explicacion || ''
      };
    });

    const n = preguntas.length;
    const minutos = Math.min(10, Math.max(0.5, Number(cfg.minutosPorPregunta) || 1));
    const limite = cfg.modo === 'examen' ? Math.max(30, Math.round(n * minutos * 60)) : null;

    return {
      id: uid('s'),
      bancoId: banco.id,
      bancoNombre: banco.nombre,
      modo: cfg.modo,
      cfg: {
        modo: cfg.modo,
        cantidad: cfg.cantidad,
        bloque: cfg.bloque,
        ordenPreguntas: !!cfg.ordenPreguntas,
        ordenOpciones: !!cfg.ordenOpciones,
        mostrarTemporizador: cfg.mostrarTemporizador !== false,
        minutosPorPregunta: minutos
      },
      preguntas,
      respuestas: Array(n).fill(null),
      marcadas: [],
      actual: 0,
      limiteSeg: limite,
      restanteSeg: limite,
      iniciadoEn: Date.now(),
      mostrarTemporizador: cfg.mostrarTemporizador !== false
    };
  }

  function calcularResultado(sesion, automatico = false) {
    const total = sesion.preguntas.length;
    const detalle = sesion.preguntas.map((q, i) => {
      const correcta = q.opciones.findIndex((o) => o.ok);
      const respuesta = sesion.respuestas[i];
      const sinResponder = respuesta == null;
      return {
        pid: String(q.pid),
        nro: q.nro,
        bloque: q.bloque || 'Sin bloque',
        enunciado: q.enunciado,
        opciones: q.opciones.map((o) => o.texto),
        correcta,
        respuesta,
        explicacion: q.explicacion || '',
        acierto: !sinResponder && respuesta === correcta,
        sinResponder,
        marcada: sesion.marcadas.includes(i)
      };
    });

    const correctas = detalle.filter((d) => d.acierto).length;
    const sinResponder = detalle.filter((d) => d.sinResponder).length;
    const incorrectas = total - correctas - sinResponder;

    const bloques = new Map();
    detalle.forEach((d) => {
      if (!bloques.has(d.bloque)) bloques.set(d.bloque, { bloque: d.bloque, total: 0, correctas: 0 });
      const b = bloques.get(d.bloque);
      b.total += 1;
      if (d.acierto) b.correctas += 1;
    });
    const porBloque = [...bloques.values()]
      .map((b) => ({ ...b, porcentaje: b.total ? Math.round((b.correctas / b.total) * 100) : 0 }))
      .sort((a, b) => a.porcentaje - b.porcentaje || a.bloque.localeCompare(b.bloque, 'es'));

    let duracion;
    if (sesion.modo === 'examen' && sesion.limiteSeg) {
      duracion = automatico
        ? sesion.limiteSeg
        : Math.max(0, sesion.limiteSeg - (sesion.restanteSeg ?? sesion.limiteSeg));
    } else {
      duracion = Math.max(0, Math.round((Date.now() - sesion.iniciadoEn) / 1000));
    }

    return {
      id: uid('r'),
      fecha: new Date().toISOString(),
      bancoId: sesion.bancoId,
      bancoNombre: sesion.bancoNombre,
      modo: sesion.modo,
      cfg: { ...sesion.cfg },
      automatico: !!automatico,
      total,
      correctas,
      incorrectas,
      sinResponder,
      porcentaje: total ? Math.round((correctas / total) * 100) : 0,
      duracionSeg: duracion,
      promedioSeg: total ? Math.round(duracion / total) : 0,
      porBloque,
      detalle,
      falladas: detalle
        .filter((d) => !d.acierto)
        .map((d) => ({ pid: d.pid, enunciado: d.enunciado, bloque: d.bloque })),
      marcadas: detalle.filter((d) => d.marcada).map((d) => d.pid)
    };
  }

  function rankingFalladas() {
    const mapa = new Map();
    state.historial.forEach((intento) => {
      (Array.isArray(intento.falladas) ? intento.falladas : []).forEach((f) => {
        if (!f || f.pid == null) return;
        const clave = `${intento.bancoId}::${f.pid}`;
        if (!mapa.has(clave)) {
          mapa.set(clave, {
            pid: f.pid,
            enunciado: f.enunciado || 'Pregunta',
            bloque: f.bloque || '',
            bancoNombre: intento.bancoNombre || '',
            cuenta: 0
          });
        }
        const item = mapa.get(clave);
        item.cuenta += 1;
        if (f.enunciado) item.enunciado = f.enunciado;
      });
    });
    return [...mapa.values()]
      .sort((a, b) => b.cuenta - a.cuenta || a.enunciado.localeCompare(b.enunciado, 'es'))
      .slice(0, 8);
  }

  function promedioHistorial() {
    if (!state.historial.length) return null;
    const suma = state.historial.reduce((acc, a) => acc + (Number(a.porcentaje) || 0), 0);

    if (sidebar) sidebar.classList.toggle('oculto', state.pantalla === 'examen');

  function conectarDropzone() {
    const zona = document.getElementById('dropzone');
    if (!zona) return;
    const activar = (e) => {
      e.preventDefault();
      zona.classList.add('es-arrastrando');
    };
    const desactivar = () => zona.classList.remove('es-arrastrando');
    zona.addEventListener('dragenter', activar);
    zona.addEventListener('dragover', activar);
    zona.addEventListener('dragleave', desactivar);
    zona.addEventListener('drop', (e) => {
      e.preventDefault();
      desactivar();
      const archivo = e.dataTransfer?.files?.[0];
      if (archivo) leerArchivo(archivo);
    });
  }

        { izq: 'Ágil', der: 'Entregas cortas, iterativas e incrementales; responde al cambio y prioriza el valor.' }
      ]
    },
    {
      id: 'organizacion',
      titulo: 'Sistemas y organización',
      descripcion: 'Uní cada concepto organizacional con su significado.',
      pares: [
        { izq: 'Entradas', der: 'Recursos, información y capital que ingresan a la organización.' },
        { izq: 'Procesos internos', der: 'Transformación y operación que realiza la organización.' },
        { izq: 'Salidas', der: 'Productos, servicios y resultados que obtiene la organización.' },
        { izq: 'Nivel estratégico', der: 'Alta dirección; decisiones a largo plazo.' },
        { izq: 'Nivel táctico', der: 'Mandos intermedios; coordinación y planificación a mediano plazo.' },
        { izq: 'Nivel operativo', der: 'Trabajadores de base; ejecución de actividades del día a día.' }
      ]
    }
  ];

  const ACTIVIDAD_ORDENAR = [
    {
      id: 'sdlc',
      titulo: 'Fases del SDLC',
      descripcion: 'Reconstruí el orden típico del ciclo de vida del desarrollo de software.',
      items: [
        'Requisitos',
        'Análisis',
        'Diseño',
        'Codificación / Implementación',
        'Pruebas',
        'Mantenimiento / Despliegue'
      ]
    },
    {
      id: 'requerimientos',
      titulo: 'Fases de la Ingeniería de Requerimientos',
      descripcion: 'Ordená las fases elementales del proceso de requerimientos.',
      items: [
        'Concepción',
        'Indagación',
        'Elaboración',
        'Negociación',
        'Especificación',
        'Validación',
        'Administración'
      ]
    }
  ];

  function normalizarActividadTexto(texto) {
    return String(texto == null ? '' : texto)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9ñ]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function itemsCalidad(bloque) {
    return BANCO_CALIDAD.preguntas
      .filter((p) => bloque === 'Todos' || p.bloque === bloque)
      .map((p) => ({
        id: p.id,
        bloque: p.bloque,
        enunciado: p.enunciado,
        respuesta: p.opciones[p.correcta],
        explicacion: p.explicacion
      }));
  }

  function esRespuestaCalidad(texto, factor) {
    const normal = normalizarActividadTexto(texto);
    if (!normal) return false;
    const alias = (ALIAS_CALIDAD[factor] || [factor]).map(normalizarActividadTexto);
    return alias.some((a) => a && (normal === a || normal.includes(a)));
  }

  function htmlActividadProgreso(actual, total, etiqueta) {
    const pct = total ? Math.round((actual / total) * 100) : 0;
    return `
      <div class="progreso">
        <div class="progreso-texto">
          <span>${escapeHtml(etiqueta)}</span>
          <span>${actual} de ${total}</span>
        </div>
        <div class="progreso-barra" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${actual}" aria-label="${escapeHtml(etiqueta)}">
          <div style="width: ${pct}%"></div>
        </div>
      </div>`;
  }

  function htmlActividadMini(tipo, icono, titulo, descripcion) {
    const atributos = tipo === 'calidad'
      ? 'data-accion="act-calidad" data-bloque="Todos"'
      : tipo === 'relacionar'
        ? 'data-accion="act-relacionar" data-ronda="calidad"'
        : 'data-accion="act-ordenar" data-secuencia="sdlc"';
    return `
      <article class="tarjeta tarjeta-destacada actividad-card">
        <div class="tarjeta-cabecera">
          <h3 class="tarjeta-titulo">${escapeHtml(titulo)}</h3>
          <span class="tarjeta-icono" aria-hidden="true">${icono}</span>
        </div>
        <p class="tarjeta-texto">${escapeHtml(descripcion)}</p>
        <button type="button" class="btn btn-bloque mt-4" ${atributos}>Empezar</button>
      </article>`;
  }

  /* ---------------------------- Completar calidad ---------------------------- */

  function iniciarActividadCalidad(bloque = 'Todos') {
    const items = itemsCalidad(bloque);
    if (!items.length) {
      toast('No hay ítems para ese bloque.', 'error');
      return;
    }
    const mezclados = shuffle(items);
    state.actividad = {
      tipo: 'calidad',
      bloque,
      items: mezclados,
      indice: 0,
      resultados: Array(mezclados.length).fill(null),
      aciertos: 0,
      iniciadoEn: Date.now(),
      completado: false
    };
    state.pantalla = 'actividades';
    render({ focus: '#calidad-respuesta' });
  }

  function comprobarCalidad() {
    const a = state.actividad;
    if (!a || a.tipo !== 'calidad' || a.completado) return;
    const item = a.items[a.indice];
    if (!item) return;
    const input = document.getElementById('calidad-respuesta');
    const valor = String(input?.value || '').trim();
    if (!valor) {
      toast('Escribí un factor antes de comprobar.', 'error');
      input?.focus();
      return;
    }
    if (a.resultados[a.indice]) return;
    const acierto = esRespuestaCalidad(valor, item.respuesta);
    a.resultados[a.indice] = { valor, acierto };
    if (acierto) a.aciertos += 1;
    render({ focus: '#feedback-actividad' });
    anunciar(acierto ? 'Respuesta correcta.' : `La respuesta correcta es ${item.respuesta}.`);
  }

  function siguienteCalidad() {
    const a = state.actividad;
    if (!a || a.tipo !== 'calidad') return;
    if (a.indice < a.items.length - 1) {
      a.indice += 1;
      render({ focus: '#calidad-respuesta' });
    } else {
      a.completado = true;
      render({ focus: '#titulo-pantalla' });
    }
  }

  function vistaActividadCalidad() {
    const a = state.actividad;
    if (a.completado) return resumenCalidad();
    const item = a.items[a.indice];
    if (!item) return resumenCalidad();
    const resultado = a.resultados[a.indice];
    const total = a.items.length;
    const esUltimo = a.indice === total - 1;

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="actividad-menu">← Actividades</button>
          <p class="eyebrow">Completar · ${escapeHtml(a.bloque === 'Todos' ? 'todo' : a.bloque)}</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Calidad del software</h1>
          <p class="subtitulo">Escribí a qué factor de calidad ISO 9126 corresponde cada definición o ejemplo. Podés responder con el nombre del factor.</p>
        </div>

        ${htmlActividadProgreso(a.indice + 1, total, 'Pregunta')}

        <div class="tarjeta actividad-panel">
          <div class="actividad-meta">
            <span class="badge">#${a.indice + 1}</span>
            <span class="badge badge-info">${escapeHtml(item.bloque)}</span>
            <span class="badge">Aciertos: ${a.aciertos}</span>
          </div>

          <h2 class="actividad-enunciado">${renderMarkdown(item.enunciado)}</h2>

          ${resultado ? `
            <div class="alerta ${resultado.acierto ? 'alerta-ok' : 'alerta-error'} actividad-feedback" id="feedback-actividad" tabindex="-1" role="status">
              <span class="alerta-icono" aria-hidden="true">${resultado.acierto ? '✓' : '✕'}</span>
              <div>
                <strong>${resultado.acierto ? '¡Correcto!' : 'No es ese factor.'}</strong>
                ${resultado.acierto
                  ? ` Escribiste <strong>${escapeHtml(resultado.valor)}</strong>.`
                  : ` La respuesta correcta es <strong>${escapeHtml(item.respuesta)}</strong>.`}
                ${item.explicacion ? `<div class="explicacion"><p>${renderMarkdown(item.explicacion)}</p></div>` : ''}
              </div>
            </div>
            <div class="fila mt-3">
              <button type="button" class="btn btn-primario" data-accion="calidad-siguiente">
                ${esUltimo ? 'Ver resumen' : 'Siguiente →'}
              </button>
              <button type="button" class="btn" data-accion="actividad-menu">Elegir otra actividad</button>
            </div>` : `
            <form id="form-calidad" class="actividad-form" novalidate>
              <div class="campo">
                <label for="calidad-respuesta">Factor de calidad</label>
                <input type="text" id="calidad-respuesta" name="respuesta" autocomplete="off" spellcheck="false" placeholder="Ej.: Usabilidad" aria-describedby="calidad-ayuda">
                <p class="ayuda" id="calidad-ayuda">Escribí el nombre del factor y presioná Comprobar.</p>
              </div>
              <button type="submit" class="btn btn-primario">Comprobar</button>
            </form>`}
        </div>
      </section>`;
  }

  function resumenCalidad() {
    const a = state.actividad;
    const total = a.items.length;
    const pct = total ? Math.round((a.aciertos / total) * 100) : 0;
    const duracion = Math.max(0, Math.round((Date.now() - a.iniciadoEn) / 1000));

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="actividad-menu">← Actividades</button>
          <p class="eyebrow">Completar · resultado</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Calidad del software</h1>
          <p class="subtitulo">Terminaste la actividad. Revisá las respuestas y volvé a intentarlo si querés.</p>
        </div>

        <div class="resultado-hero actividad-resultado">

            <p class="mensaje-desempeno">${pct >= 75 ? 'Muy bien.' : pct >= 50 ? 'Vas bien.' : 'A repasar.'}</p>
            <div class="resultado-stats">
              <div class="resultado-stat"><strong>${a.aciertos}/${total}</strong><span>Aciertos</span></div>
              <div class="resultado-stat"><strong>${pct}%</strong><span>Porcentaje</span></div>

          ${a.items.map((item, i) => {

            return `
              <article class="revision-item" data-estado="${acierto ? 'ok' : 'mal'}">
                <div class="revision-cabecera">
                  <span class="revision-num">#${i + 1}</span>
                  <span class="badge badge-info">${escapeHtml(item.bloque)}</span>
                  <span class="badge ${acierto ? 'badge-ok' : 'badge-mal'}">${acierto ? 'Correcto' : 'Incorrecto'}</span>
                </div>
                <p class="revision-enunciado">${renderMarkdown(item.enunciado)}</p>
                <p class="texto-chico"><strong>Tu respuesta:</strong> ${escapeHtml(r?.valor || 'Sin responder')}</p>
                <p class="texto-chico"><strong>Correcta:</strong> ${escapeHtml(item.respuesta)}</p>
                ${item.explicacion ? `<p class="revision-explicacion">${renderMarkdown(item.explicacion)}</p>` : ''}
              </article>`;
          }).join('')}
        </div>

        <div class="fila mt-4">
          <button type="button" class="btn btn-primario" data-accion="act-calidad" data-bloque="${escapeHtml(a.bloque)}">Repetir</button>
          <button type="button" class="btn" data-accion="actividad-menu">Elegir otra actividad</button>
        </div>
      </section>`;
  }

  /* ----------------------------- Relacionar ----------------------------- */

  function iniciarActividadRelacionar(rondaId = 'calidad') {
    const ronda = ACTIVIDAD_RELACIONAR.find((r) => r.id === rondaId) || ACTIVIDAD_RELACIONAR[0];
    const pares = shuffle(ronda.pares.map((p, i) => ({ ...p, id: i })));
    state.actividad = {
      tipo: 'relacionar',
      rondaId: ronda.id,
      pares,
      izquierda: shuffle(pares.map((p) => ({ id: p.id, texto: p.izq }))),
      derecha: shuffle(pares.map((p) => ({ id: p.id, texto: p.der }))),
      resueltos: [],
      seleccionIzq: null,
      seleccionDer: null,
      errores: 0,
      mensaje: '',
      completado: false,
      iniciadoEn: Date.now()
    };
    state.pantalla = 'actividades';
    render();
  }

  function manejarMatch(lado, id) {
    const a = state.actividad;
    if (!a || a.tipo !== 'relacionar' || a.completado) return;
    if (a.resueltos.includes(id)) return;

    if (lado === 'izq') a.seleccionIzq = a.seleccionIzq === id ? null : id;
    else a.seleccionDer = a.seleccionDer === id ? null : id;

    if (a.seleccionIzq != null && a.seleccionDer != null) {
      if (a.seleccionIzq === a.seleccionDer) {
        a.resueltos.push(a.seleccionIzq);
        a.mensaje = '¡Correcto! Ese concepto y su definición coinciden.';
      } else {
        a.errores += 1;
        a.mensaje = 'Ese par no coincide. Probá con otra definición.';
      }
      a.seleccionIzq = null;
      a.seleccionDer = null;
      if (a.resueltos.length === a.pares.length) {
        a.completado = true;
      }
    }
    render({ focus: '#feedback-actividad' });
    if (a.mensaje) anunciar(a.mensaje);
  }

  function htmlMatchBoton(lado, item, a) {
    const resuelto = a.resueltos.includes(item.id);
    const seleccionado = lado === 'izq'
      ? a.seleccionIzq === item.id
      : a.seleccionDer === item.id;
    const clases = ['match-item'];
    if (resuelto) clases.push('es-resuelta');
    if (seleccionado) clases.push('es-seleccionada');
    return `
      <button type="button" class="${clases.join(' ')}" data-accion="match-${lado}" data-id="${item.id}" ${resuelto ? 'disabled' : ''} aria-pressed="${seleccionado}">
        <span>${renderInline(item.texto)}</span>
        ${resuelto ? '<span class="match-marca" aria-hidden="true">✓</span>' : ''}
      </button>`;
  }

  function vistaActividadRelacionar() {
    const a = state.actividad;
    if (a.completado) return resumenRelacionar();
    const ronda = ACTIVIDAD_RELACIONAR.find((r) => r.id === a.rondaId) || ACTIVIDAD_RELACIONAR[0];
    const total = a.pares.length;

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="actividad-menu">← Actividades</button>
          <p class="eyebrow">Relacionar · ${escapeHtml(ronda.titulo)}</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Relacionar conceptos</h1>
          <p class="subtitulo">Elegí un concepto y después su definición. Si coincide, el par queda fijo.</p>
        </div>

        ${htmlActividadProgreso(a.resueltos.length, total, 'Pares resueltos')}

        <div class="actividad-barra">
          <span class="badge">Errores: ${a.errores}</span>
          <span class="badge badge-info">${escapeHtml(ronda.descripcion)}</span>
        </div>

        ${a.mensaje ? `
          <div class="alerta ${a.mensaje.startsWith('¡Correcto') ? 'alerta-ok' : 'alerta-warn'} actividad-feedback" id="feedback-actividad" tabindex="-1" role="status">
            <span class="alerta-icono" aria-hidden="true">${a.mensaje.startsWith('¡Correcto') ? '✓' : '!'}</span>
            <div>${escapeHtml(a.mensaje)}</div>
          </div>` : '<div id="feedback-actividad" tabindex="-1"></div>'}

        <div class="match-grid">
          <div class="match-columna">
            <h2 class="seccion-titulo">Conceptos</h2>
            <div class="match-lista">${a.izquierda.map((item) => htmlMatchBoton('izq', item, a)).join('')}</div>
          </div>
          <div class="match-columna">
            <h2 class="seccion-titulo">Definiciones</h2>
            <div class="match-lista">${a.derecha.map((item) => htmlMatchBoton('der', item, a)).join('')}</div>
          </div>
        </div>

        <div class="fila mt-4">
          <button type="button" class="btn" data-accion="relacionar-reiniciar">Mezclar de nuevo</button>
          <button type="button" class="btn" data-accion="actividad-menu">Elegir otra actividad</button>
        </div>
      </section>`;
  }

  function resumenRelacionar() {
    const a = state.actividad;
    const ronda = ACTIVIDAD_RELACIONAR.find((r) => r.id === a.rondaId) || ACTIVIDAD_RELACIONAR[0];
    const duracion = Math.max(0, Math.round((Date.now() - a.iniciadoEn) / 1000));

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="actividad-menu">← Actividades</button>
          <p class="eyebrow">Relacionar · resultado</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">${escapeHtml(ronda.titulo)}</h1>
          <p class="subtitulo">Completaste todos los pares. Repasá las definiciones y volvé a intentarlo si querés.</p>
        </div>

        <div class="resultado-hero actividad-resultado">
          <div class="resultado-info">

            <div class="resultado-stats">
              <div class="resultado-stat"><strong>${a.pares.length}</strong><span>Pares</span></div>
              <div class="resultado-stat"><strong>${a.errores}</strong><span>Errores</span></div>

          <button type="button" class="btn" data-accion="actividad-menu">Elegir otra actividad</button>

  /* ------------------------------ Ordenar ------------------------------ */

  function iniciarActividadOrdenar(secuenciaId = 'sdlc') {
    const secuencia = ACTIVIDAD_ORDENAR.find((s) => s.id === secuenciaId) || ACTIVIDAD_ORDENAR[0];
    state.actividad = {
      tipo: 'ordenar',
      secuenciaId: secuencia.id,
      items: shuffle(secuencia.items.map((texto, i) => ({ id: i, texto }))),
      comprobado: false,
      aciertos: 0,
      movimientos: 0,
      iniciadoEn: Date.now()
    };
    state.pantalla = 'actividades';
    render();
  }

  function moverOrden(indice, direccion) {
    const a = state.actividad;
    if (!a || a.tipo !== 'ordenar' || a.comprobado) return;
    const i = Number(indice);
    const j = i + direccion;
    if (!Number.isInteger(i) || i < 0 || i >= a.items.length) return;
    if (j < 0 || j >= a.items.length) return;
    [a.items[i], a.items[j]] = [a.items[j], a.items[i]];
    a.movimientos += 1;
    state._foco = `[data-accion="orden-${direccion < 0 ? 'subir' : 'bajar'}"][data-i="${j}"]`;
    render();
  }

  function comprobarOrden() {
    const a = state.actividad;
    if (!a || a.tipo !== 'ordenar') return;
    a.comprobado = true;
    a.aciertos = a.items.reduce((acc, item, i) => acc + (item.id === i ? 1 : 0), 0);
    render({ focus: '#feedback-actividad' });
    anunciar(`Acertaste ${a.aciertos} de ${a.items.length} posiciones.`);
  }

  function vistaActividadOrdenar() {
    const a = state.actividad;
    if (a.comprobado) return resumenOrdenar();
    const secuencia = ACTIVIDAD_ORDENAR.find((s) => s.id === a.secuenciaId) || ACTIVIDAD_ORDENAR[0];

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="actividad-menu">← Actividades</button>
          <p class="eyebrow">Ordenar · ${escapeHtml(secuencia.titulo)}</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Ordenar la secuencia</h1>
          <p class="subtitulo">${escapeHtml(secuencia.descripcion)} Usá las flechas para mover cada elemento.</p>
        </div>

        <div class="actividad-barra">
          <span class="badge">${a.items.length} posiciones</span>
          <span class="badge badge-info">Movimientos: ${a.movimientos}</span>
        </div>

        <ol class="orden-lista" aria-label="Elementos para ordenar">
          ${a.items.map((item, i) => `
            <li class="orden-item" id="orden-item-${item.id}">
              <span class="orden-num" aria-hidden="true">${i + 1}</span>
              <span class="orden-texto">${renderInline(item.texto)}</span>
              <span class="orden-acciones">
                <button type="button" class="btn btn-chico" data-accion="orden-subir" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir ${escapeHtml(item.texto)}">↑</button>
                <button type="button" class="btn btn-chico" data-accion="orden-bajar" data-i="${i}" ${i === a.items.length - 1 ? 'disabled' : ''} aria-label="Bajar ${escapeHtml(item.texto)}">↓</button>
              </span>
            </li>`).join('')}
        </ol>

        <div class="fila mt-4">
          <button type="button" class="btn btn-primario" data-accion="orden-comprobar">Comprobar orden</button>
          <button type="button" class="btn" data-accion="orden-mezclar">Mezclar</button>
          <button type="button" class="btn" data-accion="actividad-menu">Elegir otra actividad</button>
        </div>
      </section>`;
  }

  function resumenOrdenar() {
    const a = state.actividad;
    const secuencia = ACTIVIDAD_ORDENAR.find((s) => s.id === a.secuenciaId) || ACTIVIDAD_ORDENAR[0];
    const total = a.items.length;
    const pct = total ? Math.round((a.aciertos / total) * 100) : 0;
    const duracion = Math.max(0, Math.round((Date.now() - a.iniciadoEn) / 1000));

  /* ========================================================================
     12d. Laboratorio SQL: vistas, corrección y progreso
     ======================================================================== */

  const SQL_RESERVADAS_ALIAS = new Set([
    'where', 'inner', 'join', 'left', 'right', 'full', 'on', 'group', 'order',
    'having', 'union', 'cross', 'outer', 'as', 'set', 'values', 'from'
  ]);

  function normalizarSql(texto) {
    let sql = String(texto == null ? '' : texto);
    sql = sql.replace(/--[^\n]*/g, ' ').replace(/\/\*[\s\S]*?\*\//g, ' ');
    sql = sql.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    sql = sql.replace(/^\s*use\s+(ventas|jardineria)\s*;?/, ' ');
    sql = sql.replace(/\bgo\b/g, ' ');
    sql = sql.replace(/[\[\]`"]/g, ' ');
    sql = sql.replace(/\b(dbo|ventas|jardineria)\./g, ' ');
    sql = sql.replace(/\binner\s+join\b/g, 'join');
    sql = sql.replace(/\b(left|right|full)\s+outer\s+join\b/g, '$1 join');
    sql = sql.replace(/<>/g, '!=');
    sql = sql.replace(/\bcount\s*\(\s*1\s*\)/g, 'count(*)');
    sql = sql.replace(/\b(\d+)\.0+\b/g, '$1');

    /* Quita alias de columnas con AS, pero conserva CREATE VIEW ... AS SELECT. */
    sql = sql.replace(/\bas\s+(?!select\b)[a-z_][a-z0-9_]*/g, ' ');
    sql = sql.replace(/\bas\s+'[^']*'/g, ' ');

    /* Convierte FROM CLIENTE c en FROM CLIENTE y luego quita los prefijos. */
    const aliasTablas = {};
    sql = sql.replace(/\b(from|join)\s+([a-z_][a-z0-9_]*)(?:\s+(?:as\s+)?([a-z_][a-z0-9_]*))?/g, (m, palabra, tabla, alias) => {
      if (alias && !SQL_RESERVADAS_ALIAS.has(alias) && alias !== tabla) {
        aliasTablas[alias] = tabla;
        return `${palabra} ${tabla}`;
      }
      return m;
    });
    Object.entries(aliasTablas).forEach(([alias, tabla]) => {
      sql = sql.replace(new RegExp(`\\b${alias}\\.`, 'g'), `${tabla}.`);
    });
    sql = sql.replace(/\b[a-z_][a-z0-9_]*\./g, '');
    sql = sql.replace(/\bnot\s+([a-z_][a-z0-9_]*)\s*=\s*/g, '$1!= ');
    sql = sql.replace(/\basc\b/g, ' ');

    /* Normaliza espacios y signos, pero respeta los textos entre comillas simples. */
    const partes = sql.split(/('(?:''|[^'])*')/g);
    sql = partes.map((parte, i) => {
      if (i % 2 === 1) return parte;
      return parte
        .replace(/\s*([(),;=<>+\-*\/])\s*/g, '$1')
        .replace(/\s+/g, ' ');
    }).join('');
    return sql.replace(/;+$/g, '').trim();
  }

  function sqlEmpiezaBien(texto) {
    const limpio = String(texto || '').replace(/--[^\n]*/g, ' ').replace(/\/\*[\s\S]*?\*\//g, ' ').trim();
    return /^(select|insert|update|delete|create|alter|drop|use)\b/i.test(limpio);
  }

  function sqlParentesisBalanceados(texto) {
    let nivel = 0;
    let enTexto = false;
    const sql = String(texto || '')
      .replace(/--[^\n]*/g, ' ')
      .replace(/\/\*[\s\S]*?\*\//g, ' ');
    for (let i = 0; i < sql.length; i++) {
      const c = sql[i];
      if (c === "'") {
        if (enTexto && sql[i + 1] === "'") { i++; continue; }
        enTexto = !enTexto;
        continue;
      }
      if (enTexto) continue;
      if (c === '(') nivel++;
      if (c === ')') {
        nivel--;
        if (nivel < 0) return false;
      }
    }
    return nivel === 0 && !enTexto;
  }

  function sqlCoincide(texto, ejercicio) {
    const normal = normalizarSql(texto);
    if (!normal) return false;
    if (Array.isArray(ejercicio.requiere) && ejercicio.requiere.length) {
      return ejercicio.requiere.every((req) => normal.includes(normalizarSql(req)));
    }
    const candidatos = [ejercicio.solucion, ...(ejercicio.variantes || [])].map(normalizarSql);
    return candidatos.includes(normal);
  }

  function sqlEjercicioPorId(id) {
    return SQL_EJERCICIOS.find((e) => e.id === id) || null;
  }

  function sqlModuloPorId(id) {
    return SQL_MODULOS.find((m) => m.id === id) || null;
  }

  function sqlEjerciciosFiltrados() {
    return state.sql.filtro === 'todos'
      ? SQL_EJERCICIOS
      : SQL_EJERCICIOS.filter((e) => e.modulo === state.sql.filtro);

  function sqlResueltos() {
    return SQL_EJERCICIOS.filter((e) => state.sql.progreso[e.id]).length;
  }

  function resetearSqlEjercicio() {
    state.sql.ejercicioId = null;
    state.sql.borrador = '';

  function filtrarSql(modulo) {
    state.sql.filtro = modulo || 'todos';
    resetearSqlEjercicio();
    state.pantalla = 'sql';
    render({ focus: '#titulo-pantalla' });
  }

  function sqlRelacionPorId(id) {
    return SQL_RELACION.find((r) => r.id === id) || SQL_RELACION[0];
  }

  function iniciarSqlRelacion(rondaId = 'tablas') {
    const ronda = sqlRelacionPorId(rondaId);
    resetearSqlEjercicio();
    const pares = shuffle(ronda.pares.map((p, i) => ({ ...p, id: i })));
    state.sql.relacion = {
      rondaId: ronda.id,
      pares,
      izquierda: shuffle(pares.map((p) => ({ id: p.id, texto: p.izq }))),
      derecha: shuffle(pares.map((p) => ({ id: p.id, texto: p.der }))),
      resueltos: [],
      seleccionIzq: null,
      seleccionDer: null,
      errores: 0,
      mensaje: '',
      completado: false,
      iniciadoEn: Date.now()
    };
    state.pantalla = 'sql';
    render({ focus: '#titulo-pantalla' });
  }

  function manejarSqlMatch(lado, id) {
    const a = state.sql.relacion;
    if (!a || a.completado) return;
    if (a.resueltos.includes(id)) return;

    if (lado === 'izq') a.seleccionIzq = a.seleccionIzq === id ? null : id;
    else a.seleccionDer = a.seleccionDer === id ? null : id;

    if (a.seleccionIzq != null && a.seleccionDer != null) {
      if (a.seleccionIzq === a.seleccionDer) {
        a.resueltos.push(a.seleccionIzq);
        a.mensaje = '¡Correcto! Ese par coincide.';
      } else {
        a.errores += 1;
        a.mensaje = 'Ese par no coincide. Mirá otra vez la tabla y probá de nuevo.';
      }
      a.seleccionIzq = null;
      a.seleccionDer = null;
      if (a.resueltos.length === a.pares.length) {
        a.completado = true;
        a.mensaje = '¡Completaste la ronda! Podés pasar a la siguiente o mezclar de nuevo.';
        state.sql.progreso[`relacion:${a.rondaId}`] = true;
        safeSet(K.sqlProgreso, state.sql.progreso);
      }
    }
    render({ focus: '#feedback-sql-relacion' });
    if (a.mensaje) anunciar(a.mensaje);
  }

  function htmlSqlMatchBoton(lado, item, a) {
    const resuelto = a.resueltos.includes(item.id);
    const seleccionado = lado === 'izq'
      ? a.seleccionIzq === item.id
      : a.seleccionDer === item.id;
    const clases = ['match-item'];
    if (resuelto) clases.push('es-resuelta');
    if (seleccionado) clases.push('es-seleccionada');
    return `
      <button type="button" class="${clases.join(' ')}" data-accion="sql-match-${lado}" data-id="${item.id}" ${resuelto ? 'disabled' : ''} aria-pressed="${seleccionado}">
        <span>${renderInline(item.texto)}</span>
        ${resuelto ? '<span class="match-marca" aria-hidden="true">✓</span>' : ''}
      </button>`;
  }

  function htmlSqlRelacionCard() {
    const hechas = SQL_RELACION.filter((r) => state.sql.progreso[`relacion:${r.id}`]).length;
    const opciones = SQL_RELACION.map((r) => {
      const hecha = !!state.sql.progreso[`relacion:${r.id}`];
      return `
        <button type="button" class="chip chip-boton" data-accion="sql-relacion" data-ronda="${escapeHtml(r.id)}" aria-label="Relacionar: ${escapeHtml(r.titulo)}${hecha ? ', completada' : ''}">
          ${hecha ? '✓ ' : ''}${escapeHtml(r.titulo)}
        </button>`;
    }).join('');
    return `
      <section class="sql-relacion-card" aria-labelledby="sql-relacion-titulo">
        <div class="sql-relacion-texto">

          <h2 class="seccion-titulo" id="sql-relacion-titulo">Relacioná el esquema VENTAS</h2>

        </div>
        <div class="sql-relacion-opciones">
          <span class="badge badge-info">${hechas} de ${SQL_RELACION.length} rondas</span>
          <div class="chips">${opciones}</div>
        </div>
      </section>`;
  }

  function vistaSqlRelacion() {
    const a = state.sql.relacion;
    if (!a) return vistaBaseDatos();
    const ronda = sqlRelacionPorId(a.rondaId);
    const total = a.pares.length;
    const indice = SQL_RELACION.findIndex((r) => r.id === ronda.id);
    const siguiente = SQL_RELACION[indice + 1] || null;
    const esCorrecto = a.mensaje.startsWith('¡Correcto') || a.mensaje.startsWith('¡Completaste');

    return `
      <section class="pantalla" aria-labelledby="titulo-pantalla">
        <div class="pantalla-cabecera">
          <button type="button" class="btn btn-fantasma btn-chico" data-accion="sql-relacion-lista">← Base de Datos</button>
          <p class="eyebrow">Relacionar · ${escapeHtml(ronda.titulo)}</p>
          <h1 class="titulo-pagina" id="titulo-pantalla" tabindex="-1">Relacioná el esquema VENTAS</h1>
          <p class="subtitulo">${escapeHtml(ronda.descripcion)} Elegí un elemento de la izquierda y después su pareja de la derecha.</p>
        </div>

        ${htmlActividadProgreso(a.resueltos.length, total, 'Pares resueltos')}

        <div class="actividad-barra">
          <span class="badge">Errores: ${a.errores}</span>
          <span class="badge badge-info">${escapeHtml(ronda.izqTitulo)} → ${escapeHtml(ronda.derTitulo)}</span>
        </div>

        ${a.mensaje ? `
          <div class="alerta ${esCorrecto ? 'alerta-ok' : 'alerta-warn'} actividad-feedback" id="feedback-sql-relacion" tabindex="-1" role="status">
            <span class="alerta-icono" aria-hidden="true">${esCorrecto ? '✓' : '!'}</span>
            <div>${escapeHtml(a.mensaje)}</div>
          </div>` : '<div id="feedback-sql-relacion" tabindex="-1"></div>'}

        <div class="match-grid">
          <div class="match-columna">
            <h2 class="seccion-titulo">${escapeHtml(ronda.izqTitulo)}</h2>
            <div class="match-lista">${a.izquierda.map((item) => htmlSqlMatchBoton('izq', item, a)).join('')}</div>
          </div>
          <div class="match-columna">
            <h2 class="seccion-titulo">${escapeHtml(ronda.derTitulo)}</h2>
            <div class="match-lista">${a.derecha.map((item) => htmlSqlMatchBoton('der', item, a)).join('')}</div>
          </div>
        </div>

        <div class="fila mt-4">
          <button type="button" class="btn" data-accion="sql-relacion-reiniciar">Mezclar de nuevo</button>
          ${a.completado ? `
            <button type="button" class="btn btn-primario" data-accion="sql-relacion-siguiente">
              ${siguiente ? 'Siguiente ronda →' : 'Volver a la lista'}
            </button>` : ''}
          <button type="button" class="btn btn-fantasma" data-accion="sql-relacion-lista">Elegir otra ronda</button>
        </div>
      </section>`;
  }

  function reiniciarSqlRelacion() {
    if (state.sql.relacion) iniciarSqlRelacion(state.sql.relacion.rondaId);
  }

  function siguienteSqlRelacion() {
    const a = state.sql.relacion;
    if (!a) return;
    const indice = SQL_RELACION.findIndex((r) => r.id === a.rondaId);
    const siguiente = SQL_RELACION[indice + 1];
    if (siguiente) {
      iniciarSqlRelacion(siguiente.id);
    } else {
      volverListaSql();
      toast('Completaste todas las rondas de relación.', 'ok');
    }
  }

  function comprobarSql() {
    const ejercicio = sqlEjercicioPorId(state.sql.ejercicioId);
    if (!ejercicio) return;
    const input = document.getElementById('sql-respuesta');
    const texto = String(input?.value || '').trim();
    if (!texto) {
      toast('Escribí una sentencia antes de comprobar.', 'error');
      input?.focus();
      return;
    }
    state.sql.borrador = texto;
    state.sql.intentos += 1;

    if (!sqlEmpiezaBien(texto)) {
      state.sql.resultado = {
        acierto: false,
        mensaje: 'Empezá con SELECT, INSERT, UPDATE, DELETE o CREATE. Una sola sentencia por ejercicio.'
      };
      state.sql.pista = true;
      render({ focus: '#feedback-sql' });
      anunciar('La sentencia no empieza con una instrucción SQL reconocida.');
      return;
    }

    if (!sqlParentesisBalanceados(texto)) {
      state.sql.resultado = {
        acierto: false,
        mensaje: 'Revisá los paréntesis y las comillas: hay algo que abre y no cierra.'
      };
      state.sql.pista = true;
      render({ focus: '#feedback-sql' });
      anunciar('Hay paréntesis o comillas sin cerrar.');
      return;
    }

    const acierto = sqlCoincide(texto, ejercicio);
    state.sql.resultado = { acierto, mensaje: '' };
    if (acierto) {
      state.sql.progreso[ejercicio.id] = true;
      safeSet(K.sqlProgreso, state.sql.progreso);
      anunciar('Respuesta correcta. Ejercicio resuelto.');
    } else {
      state.sql.pista = true;
      anunciar('Todavía no. Revisá la pista y volvé a intentarlo.');
    }
    render({ focus: '#feedback-sql' });
  }

  function siguienteSql() {
    const lista = sqlEjerciciosFiltrados();
    const actual = lista.findIndex((e) => e.id === state.sql.ejercicioId);
    const siguiente = actual >= 0 ? lista[actual + 1] : lista[0];
    if (siguiente) {
      abrirSqlEjercicio(siguiente.id);
    } else {
      volverListaSql();
      toast('Terminaste los ejercicios de este filtro.', 'ok');
    }
  }

  function alternarPistaSql() {
    state.sql.pista = !state.sql.pista;
    render();
  }

  function alternarSolucionSql() {
    state.sql.solucion = !state.sql.solucion;
    render();
  }

  async function copiarTexto(texto, mensajeOk) {
    try {
      await navigator.clipboard.writeText(texto);
      toast(mensajeOk || 'Copiado.', 'ok');
    } catch {
      toast('No se pudo copiar. Seleccioná el texto y copialo a mano.', 'error');
    }
  }

  function copiarScriptSql() {
    copiarTexto(SQL_SCRIPT, 'Script de VENTAS copiado.');
  }

  function copiarSolucionSql() {
    const ejercicio = sqlEjercicioPorId(state.sql.ejercicioId);
