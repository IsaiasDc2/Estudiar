<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio · práctica y examen modelo</title>
  <meta name="description" content="Cargá tus preguntas en Markdown o JSON, practicá con feedback inmediato, rendí un examen con temporizador y revisá tus errores. Todo funciona en tu navegador.">
  <meta name="theme-color" content="#0B0E14">
  <script>
    /* Tema antes del primer pintado: evita el destello claro/oscuro. */
    (function () {
      try {
        var pref = localStorage.getItem('estudio.tema.v1');
        try { pref = JSON.parse(pref); } catch (e) { /* valor plano de versiones anteriores */ }
        var sistema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var oscuro = pref === 'oscuro' || (pref !== 'claro' && sistema);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuro ? '#0B0E14' : '#F4F6FB');
      } catch (e) { /* almacenamiento bloqueado: se usa el tema del sistema */ }
    })();
  </script>

/* ==========================================================================
   Estudio · hoja de estilos única
   Sistema visual adaptado de HefestoTech: tokens semánticos, doble tema,
   índigo para la acción, latón para el logro, foco visible y movimiento sobrio.
   ========================================================================== */

:root {
  color-scheme: dark;

  /* Primitivas (paleta HefestoTech) */
  --primitive-night: #0b0e14;
  --primitive-graphite: #121724;
  --primitive-armor: #171e2d;
  --primitive-armor-elevated: #1e2638;
  --primitive-line: #2a3449;
  --primitive-line-soft: #1a2233;
  --primitive-ink: #f1f5f9;
  --primitive-fog: #94a3b8;
  --primitive-fog-deep: #7a8aa3;
  --primitive-indigo: #6366f1;
  --primitive-indigo-solid: #4f46e5;
  --primitive-indigo-deep: #4338ca;
  --primitive-sky: #0ea5e9;
  --primitive-brass: #c9a86a;
  --primitive-brass-deep: #8c7146;
  --primitive-green: #10b981;
  --primitive-green-deep: #047857;
  --primitive-red: #e5484d;
  --primitive-red-deep: #dc2626;
  --primitive-amber: #f59e0b;
  --primitive-amber-deep: #b45309;
  --primitive-paper: #f4f6fb;
  --primitive-paper-surface: #ffffff;
  --primitive-paper-elevated: #eaf0f8;
  --primitive-day-ink: #0f172a;
  --primitive-day-muted: #475569;
  --primitive-day-faint: #64748b;
  --primitive-day-line: #d7dee9;
  --primitive-day-line-soft: #e5eaf2;

  /* Tokens semánticos · tema oscuro (por defecto) */
  --background: var(--primitive-night);
  --surface: var(--primitive-graphite);
  --surface-elevated: var(--primitive-armor);
  --surface-elevated-2: var(--primitive-armor-elevated);
  --text: var(--primitive-ink);
  --text-muted: var(--primitive-fog);
  --text-faint: var(--primitive-fog-deep);
  --border: var(--primitive-line);
  --border-soft: var(--primitive-line-soft);
  --accent: var(--primitive-indigo);
  --accent-solid: var(--primitive-indigo-solid);
  --accent-hover: var(--primitive-indigo-deep);
  --accent-ink: #a5b4fc;
  --accent-sky: var(--primitive-sky);
  --gold: var(--primitive-brass);
  --success: var(--primitive-green);
  --warning: var(--primitive-amber);
  --danger: #f87171;
  --on-accent: #ffffff;
  --on-success: #04150f;
  --on-danger: #0b0e14;
  --focus-ring: rgba(99, 102, 241, 0.45);

  /* Tintes y sombras */
  --accent-soft: rgba(99, 102, 241, 0.12);
  --accent-line: rgba(99, 102, 241, 0.38);
  --gold-soft: rgba(201, 168, 106, 0.1);
  --gold-line: rgba(201, 168, 106, 0.4);
  --success-soft: rgba(16, 185, 129, 0.12);
  --success-line: rgba(16, 185, 129, 0.4);
  --warning-soft: rgba(245, 158, 11, 0.12);
  --warning-line: rgba(245, 158, 11, 0.4);
  --danger-soft: rgba(248, 113, 113, 0.12);
  --danger-line: rgba(248, 113, 113, 0.45);
  --sky-soft: rgba(14, 165, 233, 0.12);
  --scrim: rgba(11, 14, 20, 0.62);
  --shadow-rest: 0 8px 28px rgba(0, 0, 0, 0.32);
  --shadow-lift: 0 12px 34px rgba(0, 0, 0, 0.42);
  --shadow-brand: 0 6px 24px rgba(99, 102, 241, 0.25);
  --grad-brand: linear-gradient(135deg, var(--accent-solid), var(--accent-hover));
  --grad-hairline: linear-gradient(90deg, transparent, var(--accent), transparent);

  /* Tipografía */
  --font-display: "Oswald", "Arial Narrow", "Impact", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --text-h1: clamp(2rem, 1.35rem + 3vw, 3.1rem);
  --text-h2: clamp(1.45rem, 1.1rem + 1.5vw, 2rem);
  --text-h3: clamp(1.12rem, 1rem + 0.55vw, 1.35rem);
  --text-body: 1rem;
  --text-small: 0.875rem;
  --text-xs: 0.78rem;
  --tracking-label: 0.09em;

  /* Espaciado, radios, movimiento */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 2.5rem;
  --space-8: 3.5rem;
  --radio-sm: 8px;
  --radio-md: 12px;
  --radio-lg: 16px;
  --radio-full: 999px;
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 300ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ancho: 1120px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --background: var(--primitive-paper);
  --surface: var(--primitive-paper-surface);
  --surface-elevated: var(--primitive-paper-surface);
  --surface-elevated-2: var(--primitive-paper-elevated);
  --text: var(--primitive-day-ink);
  --text-muted: var(--primitive-day-muted);
  --text-faint: #5b6b80;
  --border: var(--primitive-day-line);
  --border-soft: var(--primitive-day-line-soft);
  --accent: #4f46e5;
  --accent-solid: #4f46e5;
  --accent-hover: #4338ca;
  --accent-ink: #4338ca;
  --accent-sky: #0369a1;
  --gold: #7d643d;
  --success: #036e4f;
  --warning: #92400e;
  --danger: #b91c1c;
  --on-accent: #ffffff;
  --on-success: #ffffff;
  --on-danger: #ffffff;
  --focus-ring: rgba(79, 70, 229, 0.35);
  --accent-soft: rgba(79, 70, 229, 0.09);
  --accent-line: rgba(79, 70, 229, 0.4);
  --gold-soft: rgba(125, 100, 61, 0.1);
  --gold-line: rgba(125, 100, 61, 0.45);
  --success-soft: rgba(4, 120, 87, 0.09);
  --success-line: rgba(4, 120, 87, 0.38);
  --warning-soft: rgba(146, 64, 14, 0.1);
  --warning-line: rgba(146, 64, 14, 0.38);
  --danger-soft: rgba(185, 28, 28, 0.08);
  --danger-line: rgba(185, 28, 28, 0.38);
  --sky-soft: rgba(3, 105, 161, 0.09);
  --scrim: rgba(15, 23, 42, 0.45);
  --shadow-rest: 0 8px 24px rgba(15, 23, 42, 0.07);
  --shadow-lift: 0 14px 34px rgba(15, 23, 42, 0.12);
  --shadow-brand: 0 6px 22px rgba(79, 70, 229, 0.18);
}

/* --------------------------------------------------------------------------
   Base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 96px;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Profundidad de fondo muy sutil, desactivada con movimiento reducido. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 15% -10%, var(--accent-soft), transparent 65%),
    radial-gradient(700px 420px at 95% 0%, var(--sky-soft), transparent 70%);
}

h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
strong { font-weight: 700; }
code, .mono {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.92em;
  background: var(--surface-elevated-2);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  padding: 0.1em 0.35em;
}
::selection { background: var(--accent); color: var(--on-accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--focus-ring);
}

/* --------------------------------------------------------------------------
   Utilidades
   -------------------------------------------------------------------------- */
.contenedor {
  width: 100%;
  max-width: var(--ancho);
  margin-inline: auto;
  padding-inline: clamp(1rem, 4vw, 1.5rem);
}
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}
.oculto { display: none !important; }
.texto-muted { color: var(--text-muted); }
.texto-faint { color: var(--text-faint); }
.texto-chico { font-size: var(--text-small); }
.texto-xs { font-size: var(--text-xs); }
.centrado { text-align: center; }
.ahorarapido { overflow-wrap: anywhere; }
.fila { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.fila-entre { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.columna { display: grid; gap: var(--space-3); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mt-4 { margin-top: var(--space-4); }
.mt-5 { margin-top: var(--space-5); }
.mt-6 { margin-top: var(--space-6); }
.mb-3 { margin-bottom: var(--space-3); }
.mb-4 { margin-bottom: var(--space-4); }
.separador { height: 1px; background: var(--border-soft); border: 0; margin: var(--space-5) 0; }
.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.skip {
  position: fixed;
  top: 8px; left: 8px;
  z-index: 200;
  transform: translateY(-160%);
  background: var(--accent-solid);
  color: var(--on-accent);
  padding: 0.7rem 1rem;
  border-radius: var(--radio-md);
  font-weight: 700;
  text-decoration: none;
  transition: transform var(--dur-2) var(--ease);
}
.skip:focus { transform: translateY(0); color: var(--on-accent); }

/* --------------------------------------------------------------------------
   Cabecera y navegación
   -------------------------------------------------------------------------- */
.cabecera {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--background);
  background: color-mix(in srgb, var(--background) 82%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border-soft);
}
.cabecera-in {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 64px;
  padding-block: var(--space-2);
  flex-wrap: wrap;
}
.marca {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
  border: 0;
  background: none;
  padding: 0.3rem 0.2rem;
  min-height: 44px;
}
.marca:hover { color: var(--text); }
.marca-icono {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--grad-brand);
  color: var(--on-accent);
  font-size: 0.95rem;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
}
.marca-punto { color: var(--gold); }

.nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
  flex-wrap: wrap;
}
.nav-btn {
  min-height: 44px;
  padding: 0.5rem 0.85rem;
  border: 1px solid transparent;
  border-radius: var(--radio-full);
  background: transparent;
  color: var(--text-muted);
  font-size: var(--text-small);
  font-weight: 600;
  transition: color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.nav-btn:hover { color: var(--text); background: var(--surface); }
.nav-btn[aria-current="page"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-line);
}
.btn-tema {
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radio-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 1.05rem;
  transition: color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
}
.btn-tema:hover { color: var(--accent-ink); border-color: var(--accent-line); background: var(--accent-soft); }

/* --------------------------------------------------------------------------
   Sidebar de materias
   -------------------------------------------------------------------------- */
.layout {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: var(--space-6);
  align-items: start;
}
.layout.sin-sidebar { grid-template-columns: minmax(0, 1fr); }
.contenido { min-width: 0; }
.sidebar {
  position: sticky;
  top: calc(64px + var(--space-4));
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface);
  box-shadow: var(--shadow-rest);
}
.sidebar-materias > summary {
  list-style: none;
  cursor: pointer;
}
.sidebar-materias > summary::-webkit-details-marker { display: none; }
.sidebar-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 38px;
  padding: 0.4rem 0.5rem;
  border-radius: var(--radio-sm);
  transition: background var(--dur-2) var(--ease);
}
.sidebar-summary:hover { background: var(--accent-soft); }
.sidebar-eyebrow {
  color: var(--gold);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
}
.sidebar-chevron {
  color: var(--text-muted);
  font-size: 0.8rem;
  transition: transform var(--dur-2) var(--ease);
}
.sidebar-materias:not([open]) .sidebar-chevron { transform: rotate(-90deg); }
.sidebar-materias:not([open]) .sidebar-lista { display: none; }
.sidebar-lista {
  display: grid;
  gap: 0.35rem;
  margin-top: var(--space-2);
}
.sidebar-item {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  width: 100%;
  padding: 0.65rem;
  border: 1px solid transparent;
  border-radius: var(--radio-md);
  background: transparent;
  color: var(--text);
  text-align: left;
  transition: background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.sidebar-item:hover {
  border-color: var(--border);
  background: var(--surface-elevated);
}
.sidebar-item[aria-current="page"] {
  border-color: var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.sidebar-item-icono {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-elevated-2);
  color: var(--accent-ink);
  font-size: 0.9rem;
}
.sidebar-item[aria-current="page"] .sidebar-item-icono {
  background: var(--accent-solid);
  color: var(--on-accent);
}
.sidebar-item-texto { display: grid; gap: 0.1rem; min-width: 0; }
.sidebar-item-texto strong { font-size: var(--text-small); line-height: 1.25; }
.sidebar-item-texto small { color: var(--text-muted); font-size: var(--text-xs); line-height: 1.3; }
.sidebar-nota {
  margin-top: var(--space-3);
  padding: var(--space-3) 0.5rem 0;
  border-top: 1px solid var(--border-soft);
  color: var(--text-faint);
  font-size: var(--text-xs);
  line-height: 1.4;
}

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
  .sidebar { position: static; }
  .sidebar-lista { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 520px) {
  .sidebar-lista { grid-template-columns: minmax(0, 1fr); }
}

/* --------------------------------------------------------------------------
   Estructura de pantallas
   -------------------------------------------------------------------------- */
main { display: block; padding-block: clamp(1.5rem, 4vw, 2.75rem) var(--space-8); }
.pantalla { animation: aparecer var(--dur-3) var(--ease) both; }
@keyframes aparecer {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.pantalla-cabecera { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.eyebrow {
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--gold);
}
.titulo-pagina {
  font-family: var(--font-display);
  font-size: var(--text-h2);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text);
  overflow-wrap: anywhere;
}
.subtitulo {
  color: var(--text-muted);
  max-width: 68ch;
  font-size: 1rem;
  overflow-wrap: anywhere;
}
.seccion { margin-top: var(--space-6); }
.seccion-cabecera {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.seccion-titulo {
  font-family: var(--font-display);
  font-size: var(--text-h3);
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.seccion-sub { color: var(--text-muted); font-size: var(--text-small); }

/* --------------------------------------------------------------------------
   Héroe de inicio
   -------------------------------------------------------------------------- */
.hero {
  position: relative;
  overflow: hidden;
  display: grid;
  gap: var(--space-4);
  padding: clamp(1.4rem, 4vw, 2.75rem);
  border: 1px solid var(--border);
  border-radius: calc(var(--radio-lg) + 6px);
  background:
    linear-gradient(150deg, var(--surface-elevated) 0%, var(--surface) 58%, var(--background) 100%);
  box-shadow: var(--shadow-rest);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: var(--grad-hairline);
  opacity: 0.85;
}
.hero::after {
  content: "";
  position: absolute;
  width: 380px; height: 380px;
  right: -140px; top: -190px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 68%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero-titulo {
  font-family: var(--font-display);
  font-size: var(--text-h1);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: 0.015em;
  text-transform: uppercase;
  max-width: 22ch;
}
.hero-titulo em {
  font-style: normal;
  color: var(--gold);
}
.hero-sub {
  color: var(--text-muted);
  max-width: 62ch;
  font-size: 1.02rem;
}
.hero-acciones { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.hero-datos { display: flex; gap: var(--space-5); flex-wrap: wrap; padding-top: var(--space-2); }
.hero-dato { display: grid; gap: 0.1rem; }
.hero-dato strong {
  font-family: var(--font-display);
  font-size: 1.55rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.hero-dato span {
  font-size: var(--text-xs);
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  font-weight: 700;
}

/* --------------------------------------------------------------------------
   Tarjetas y grillas
   -------------------------------------------------------------------------- */
.grid { display: grid; gap: var(--space-4); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }

.tarjeta {
  position: relative;
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  padding: clamp(1rem, 3vw, 1.4rem);
  box-shadow: var(--shadow-rest);
  min-width: 0;
}
.tarjeta-plana { box-shadow: none; background: var(--surface); }
.tarjeta-destacada { background: linear-gradient(180deg, var(--surface-elevated) 0%, var(--surface) 100%); }
.tarjeta-destacada::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  border-radius: var(--radio-lg) var(--radio-lg) 0 0;
  background: var(--grad-hairline);
  opacity: 0.8;
}
.tarjeta-cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.tarjeta-titulo {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.15;
}
.tarjeta-texto { color: var(--text-muted); font-size: var(--text-small); }
.tarjeta-icono {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--accent-ink);
  font-size: 1.15rem;
}

/* --------------------------------------------------------------------------
   Botones
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 44px;
  padding: 0.66rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  color: var(--text);
  font-size: 0.94rem;
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  transition:
    transform var(--dur-1) var(--ease),
    border-color var(--dur-2) var(--ease),
    background var(--dur-2) var(--ease),
    color var(--dur-2) var(--ease),
    box-shadow var(--dur-2) var(--ease);
}
.btn:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
.btn:active { transform: scale(0.985); }
.btn[disabled], .btn[aria-disabled="true"] {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-primario {
  border-color: transparent;
  background: var(--grad-brand);
  color: var(--on-accent);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.08) inset;
}
.btn-primario:hover {
  background: var(--grad-brand);
  color: var(--on-accent);
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: var(--shadow-brand);
}
.btn-primario:active { transform: translateY(0) scale(0.985); }
.btn-peligro {
  color: var(--danger);
  border-color: var(--danger-line);
  background: var(--danger-soft);
}
.btn-peligro:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.btn-fantasma { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn-fantasma:hover { background: var(--surface-elevated-2); border-color: var(--border); color: var(--text); }
.btn-chico { min-height: 36px; padding: 0.4rem 0.7rem; font-size: var(--text-xs); border-radius: var(--radio-sm); }
.btn-icono {
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-weight: 700;
}
.btn-icono:hover { color: var(--accent-ink); border-color: var(--accent-line); }
.btn-bloque { width: 100%; }

/* --------------------------------------------------------------------------
   Chips, badges y avisos
   -------------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-height: 30px;
  padding: 0.28rem 0.7rem;
  border-radius: var(--radio-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.02em;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.chip-activo, .chip[aria-pressed="true"] {
  color: var(--accent-ink);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}
.chip-boton { cursor: pointer; }
.chip-boton:hover { color: var(--text); border-color: var(--accent-line); }
@media (pointer: coarse) {
  .chip-boton, .btn-chico { min-height: 44px; }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.18rem 0.55rem;
  border-radius: var(--radio-full);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  max-width: 100%;
  overflow-wrap: anywhere;
}
.badge-ok { color: var(--success); background: var(--success-soft); border-color: var(--success-line); }
.badge-mal { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
.badge-warn { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-line); }
.badge-info { color: var(--accent-sky); background: var(--sky-soft); border-color: var(--accent-sky); border-color: color-mix(in srgb, var(--accent-sky) 40%, transparent); }
.badge-gold { color: var(--gold); background: var(--gold-soft); border-color: var(--gold-line); }
.badge-accent { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-line); }

.alerta {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.85rem 1rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--text-small);
  color: var(--text-muted);
  overflow-wrap: anywhere;
}
.alerta strong { color: var(--text); }
.alerta-icono { flex: 0 0 auto; font-size: 1rem; line-height: 1.5; }
.alerta-error { border-color: var(--danger-line); background: var(--danger-soft); }
.alerta-warn { border-color: var(--warning-line); background: var(--warning-soft); }
.alerta-info { border-color: var(--accent-line); background: var(--accent-soft); }
.alerta-ok { border-color: var(--success-line); background: var(--success-soft); }

/* --------------------------------------------------------------------------
   Formularios
   -------------------------------------------------------------------------- */
.campo { display: grid; gap: 0.35rem; min-width: 0; }
.campo > label, .etiqueta {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-muted);
}
.campo input[type="text"],
.campo input[type="number"],
.campo input[type="search"],
.campo select,
.campo textarea,
.input {
  width: 100%;
  min-height: 44px;
  padding: 0.62rem 0.8rem;
  border-radius: var(--radio-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.campo textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.campo input:hover, .campo select:hover, .campo textarea:hover { border-color: var(--text-faint); }
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--focus-ring);
}
.campo input::placeholder, .campo textarea::placeholder { color: var(--text-faint); opacity: 1; }
.campo .ayuda { font-size: var(--text-xs); color: var(--text-faint); }
.campo .ayuda code { color: var(--text-muted); }
.campo .error-texto { font-size: var(--text-xs); color: var(--danger); font-weight: 600; }
.campo[data-invalido="true"] input, .campo[data-invalido="true"] textarea { border-color: var(--danger); }
.campo input[aria-invalid="true"], .campo textarea[aria-invalid="true"], .campo select[aria-invalid="true"] { border-color: var(--danger); }
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
    linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 2.2rem;
}

.check {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
}
.check:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.check input {
  flex: 0 0 auto;
  width: 20px; height: 20px;
  margin-top: 0.15rem;
  accent-color: var(--accent-solid);
  cursor: pointer;
}
.check span { display: grid; gap: 0.1rem; }
.check strong { font-size: 0.92rem; font-weight: 650; }
.check small { color: var(--text-muted); font-size: var(--text-xs); line-height: 1.4; }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend {
  padding: 0;
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

/* --------------------------------------------------------------------------
   Carga de archivos
   -------------------------------------------------------------------------- */
.dropzone {
  display: grid;
  place-items: center;
  gap: 0.6rem;
  text-align: center;
  padding: 1.5rem 1rem;
  border: 1.5px dashed var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  color: var(--text-muted);
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.dropzone:hover, .dropzone.es-arrastrando {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.dropzone.es-arrastrando { transform: scale(1.01); }
.dropzone-icono { font-size: 1.6rem; line-height: 1; color: var(--accent-ink); }
.dropzone p { font-size: var(--text-small); }
.dropzone .texto-xs { color: var(--text-faint); }

/* --------------------------------------------------------------------------
   Listas de bancos
   -------------------------------------------------------------------------- */
.lista-bancos { display: grid; gap: var(--space-3); }
.banco-card {
  display: grid;
  gap: var(--space-3);
  padding: 1rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.banco-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-brand); transform: translateY(-1px); }
.banco-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.banco-nombre {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.banco-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; color: var(--text-muted); font-size: var(--text-xs); }
.banco-acciones { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* --------------------------------------------------------------------------
   Pantalla de revisión de carga
   -------------------------------------------------------------------------- */
.preview-grid { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) {
  .preview-grid { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; }
}
.preview-stats { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.stat {
  display: grid;
  gap: 0.1rem;
  min-width: 90px;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.stat-valor {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.1;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--text-faint);
  font-weight: 700;
}
.lista-issues { display: grid; gap: 0.4rem; max-height: 280px; overflow-y: auto; padding-right: 0.25rem; }
.issue {
  display: flex;
  gap: 0.6rem;
  align-items: flex-start;
  padding: 0.5rem 0.65rem;
  border-radius: var(--radio-sm);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  font-size: var(--text-small);
  overflow-wrap: anywhere;
}
.issue-nro {
  flex: 0 0 auto;
  min-width: 2.2rem;
  padding: 0.1rem 0.35rem;
  border-radius: 5px;
  background: var(--surface-elevated-2);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.issue-error { border-color: var(--danger-line); }
.issue-error .issue-nro { background: var(--danger-soft); color: var(--danger); }
.issue-warn { border-color: var(--warning-line); }
.issue-warn .issue-nro { background: var(--warning-soft); color: var(--warning); }

/* --------------------------------------------------------------------------
   Configuración de sesión
   -------------------------------------------------------------------------- */
.modo-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.modo-card {
  position: relative;
  display: grid;
  gap: 0.35rem;
  padding: 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.modo-card:hover { border-color: var(--accent-line); }
.modo-card input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}
.modo-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-ring); }
.modo-card:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.modo-card-titulo {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 750;
  font-size: 0.98rem;
}
.modo-card-titulo .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
.modo-card:has(input:checked) .modo-card-titulo .punto { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.modo-card-desc { color: var(--text-muted); font-size: var(--text-xs); line-height: 1.45; }

.config-grid { display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .config-grid { grid-template-columns: minmax(0, 1fr); } }
.config-panel { display: grid; gap: var(--space-4); }
.resumen-config {
  position: sticky;
  top: 88px;
  display: grid;
  gap: var(--space-3);
  padding: 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface-elevated);
}
@media (max-width: 860px) { .resumen-config { position: static; } }
.resumen-lista { display: grid; gap: 0.4rem; font-size: var(--text-small); }
.resumen-lista li { display: flex; justify-content: space-between; gap: 1rem; padding-bottom: 0.4rem; border-bottom: 1px dashed var(--border-soft); }
.resumen-lista li:last-child { border-bottom: 0; padding-bottom: 0; }
.resumen-lista span:first-child { color: var(--text-muted); }
.resumen-lista span:last-child { font-weight: 650; text-align: right; }

/* --------------------------------------------------------------------------
   Examen / práctica
   -------------------------------------------------------------------------- */
.examen-barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.examen-barra-grupo { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.temporizador {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 40px;
  padding: 0.35rem 0.7rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-variant-numeric: tabular-nums;
  font-weight: 750;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
}
.temporizador.es-urgente {
  color: var(--danger);
  border-color: var(--danger-line);
  background: var(--danger-soft);
  animation: pulso 1.6s ease-in-out infinite;
}
@keyframes pulso { 50% { opacity: 0.62; } }

.progreso { display: grid; gap: 0.35rem; margin-bottom: var(--space-5); }
.progreso-texto {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: 650;
}
.progreso-barra {
  height: 7px;
  border-radius: var(--radio-full);
  background: var(--surface-elevated-2);
  overflow: hidden;
  border: 1px solid var(--border-soft);
}
.progreso-barra > div {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent-solid), var(--accent-sky));
  transition: width var(--dur-3) var(--ease);
}

.examen-grid { display: grid; gap: var(--space-5); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 940px) {
  .examen-grid { grid-template-columns: minmax(0, 1fr) 264px; }
}
.examen-main { min-width: 0; }
.examen-side {
  display: grid;
  gap: var(--space-3);
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface-elevated);
}
@media (min-width: 940px) { .examen-side { position: sticky; top: 88px; } }

.pregunta-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.pregunta-num {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--accent-ink);
}
.enunciado {
  font-size: clamp(1.12rem, 1rem + 0.6vw, 1.38rem);
  font-weight: 650;
  line-height: 1.5;
  letter-spacing: -0.01em;
  max-width: 70ch;
  overflow-wrap: anywhere;
}
.enunciado code { font-size: 0.88em; }

.opciones { display: grid; gap: 0.65rem; margin-top: var(--space-5); }
.opcion {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  padding: 0.95rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
  cursor: pointer;
  transition:
    border-color var(--dur-2) var(--ease),
    background var(--dur-2) var(--ease),
    box-shadow var(--dur-2) var(--ease),
    transform var(--dur-1) var(--ease);
  overflow-wrap: anywhere;
}
.opcion:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.opcion:active { transform: scale(0.997); }
.opcion input {
  position: absolute;
  opacity: 0;
  width: 1px; height: 1px;
  pointer-events: none;
}
.opcion:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 4px var(--focus-ring); }
.opcion-letra {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--surface-elevated-2);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  text-transform: uppercase;
  transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
}
.opcion-texto { flex: 1; min-width: 0; padding-top: 0.1rem; line-height: 1.5; }
.opcion-marca {
  flex: 0 0 auto;
  font-size: var(--text-xs);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 0.3rem;
}
.opcion.es-seleccionada {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.opcion.es-seleccionada .opcion-letra { background: var(--accent-solid); border-color: transparent; color: var(--on-accent); }
.opcion.es-correcta {
  border-color: var(--success);
  background: var(--success-soft);
  box-shadow: 0 0 0 1px var(--success) inset;
}
.opcion.es-correcta .opcion-letra { background: var(--success); border-color: transparent; color: var(--on-success); }
.opcion.es-correcta .opcion-marca { color: var(--success); }
.opcion.es-incorrecta {
  border-color: var(--danger);
  background: var(--danger-soft);
  box-shadow: 0 0 0 1px var(--danger) inset;
}
.opcion.es-incorrecta .opcion-letra { background: var(--danger); border-color: transparent; color: var(--on-danger); }
.opcion.es-incorrecta .opcion-marca { color: var(--danger); }
.opcion:has(input:disabled) { cursor: default; }

.feedback {
  display: grid;
  gap: 0.5rem;
  margin-top: var(--space-4);
  padding: 1rem 1.1rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface);
  animation: aparecer var(--dur-2) var(--ease) both;
}
.feedback-ok { border-color: var(--success-line); background: var(--success-soft); }
.feedback-mal { border-color: var(--danger-line); background: var(--danger-soft); }
.feedback-titulo {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 800;
  font-size: 0.98rem;
}
.feedback-ok .feedback-titulo { color: var(--success); }
.feedback-mal .feedback-titulo { color: var(--danger); }
.feedback p { color: var(--text-muted); font-size: var(--text-small); }
.feedback strong { color: var(--text); }

.explicacion {
  display: grid;
  gap: 0.35rem;
  margin-top: var(--space-3);
  padding: 0.9rem 1rem;
  border-left: 2px solid var(--gold);
  border-radius: 0 var(--radio-sm) var(--radio-sm) 0;
  background: var(--gold-soft);
}
.explicacion-titulo {
  font-size: var(--text-xs);
  font-weight: 800;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--gold);
}
.explicacion p { color: var(--text); font-size: var(--text-small); line-height: 1.6; }

.acciones-pregunta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-soft);
}
.acciones-grupo { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.mapa { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 0.4rem; }
.mapa-btn {
  position: relative;
  aspect-ratio: 1;
  min-height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-weight: 750;
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.mapa-btn:hover { border-color: var(--accent-line); color: var(--text); }
.mapa-btn.es-respondida { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
.mapa-btn.es-marcada { border-color: var(--warning-line); background: var(--warning-soft); color: var(--warning); }
.mapa-btn.es-respondida.es-marcada {
  border-color: var(--warning);
  background: linear-gradient(135deg, var(--warning-soft) 0 50%, var(--accent-soft) 50% 100%);
  color: var(--text);
}
.mapa-btn.es-actual { outline: 2px solid var(--accent); outline-offset: 2px; color: var(--text); }
.mapa-btn.es-actual::after {
  content: "";
  position: absolute;
  inset: auto 0 3px 50%;
  width: 4px; height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: var(--accent);
}
.leyenda { display: flex; flex-wrap: wrap; gap: 0.35rem 0.8rem; font-size: var(--text-xs); color: var(--text-muted); }
.leyenda-item { display: inline-flex; align-items: center; gap: 0.35rem; }
.punto { width: 9px; height: 9px; border-radius: 3px; border: 1px solid var(--border); background: var(--surface); }
.punto-respondida { background: var(--accent-soft); border-color: var(--accent-line); }
.punto-marcada { background: var(--warning-soft); border-color: var(--warning-line); }
.punto-actual { outline: 2px solid var(--accent); outline-offset: 1px; }

kbd {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  min-height: 24px;
  padding: 0.1rem 0.35rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  background: var(--surface-elevated-2);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 700;
}
.ayuda-lista { display: grid; gap: 0.55rem; }
.ayuda-lista li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-size: var(--text-small); color: var(--text-muted); }
.ayuda-lista li span:last-child { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }

/* --------------------------------------------------------------------------
   Resultados
   -------------------------------------------------------------------------- */
.resultado-hero {
  display: grid;
  gap: var(--space-5);
  grid-template-columns: minmax(0, 1fr);
  align-items: center;
  padding: clamp(1.2rem, 4vw, 2rem);
  border: 1px solid var(--border);
  border-radius: calc(var(--radio-lg) + 4px);
  background: linear-gradient(160deg, var(--surface-elevated) 0%, var(--surface) 70%);
  box-shadow: var(--shadow-rest);
}
@media (min-width: 760px) {
  .resultado-hero { grid-template-columns: 190px minmax(0, 1fr); }
}
.gauge { width: 190px; max-width: 100%; justify-self: center; }
.gauge-bg { fill: none; stroke: var(--surface-elevated-2); stroke-width: 12; }
.gauge-fg {
  fill: none;
  stroke: var(--accent);
  stroke-width: 12;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset 650ms var(--ease), stroke var(--dur-2) var(--ease);
}
.gauge-fg.es-ok { stroke: var(--success); }
.gauge-fg.es-warn { stroke: var(--warning); }
.gauge-fg.es-bad { stroke: var(--danger); }
.gauge-texto {
  fill: var(--text);
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 600;
  text-anchor: middle;
}
.gauge-sub {
  fill: var(--text-muted);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-anchor: middle;
  text-transform: uppercase;
}
.resultado-info { display: grid; gap: var(--space-3); min-width: 0; }
.mensaje-desempeno {
  font-family: var(--font-display);
  font-size: clamp(1.35rem, 1.1rem + 1vw, 1.9rem);
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1.12;
}
.resultado-stats { display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 110px), 1fr)); }
.resultado-stat {
  display: grid;
  gap: 0.1rem;
  padding: 0.65rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.resultado-stat strong {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.resultado-stat span { font-size: var(--text-xs); color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }

.bloques { display: grid; gap: 0.8rem; }
.bloque-fila { display: grid; gap: 0.35rem; }
.bloque-cabecera { display: flex; justify-content: space-between; gap: 1rem; font-size: var(--text-small); }
.bloque-nombre { font-weight: 650; overflow-wrap: anywhere; }
.bloque-datos { color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bloque-barra { height: 8px; border-radius: var(--radio-full); background: var(--surface-elevated-2); overflow: hidden; }
.bloque-barra > div { height: 100%; border-radius: inherit; background: var(--accent); transition: width 650ms var(--ease); }
.bloque-barra > div.es-ok { background: var(--success); }
.bloque-barra > div.es-warn { background: var(--warning); }
.bloque-barra > div.es-bad { background: var(--danger); }

.revision-filtros { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: var(--space-4); }
.revision-lista { display: grid; gap: var(--space-3); }
.revision-item {
  display: grid;
  gap: 0.65rem;
  padding: 1rem 1.1rem;
  border: 1px solid var(--border);
  border-left: 2px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
}
.revision-item[data-estado="ok"] { border-left-color: var(--success); }
.revision-item[data-estado="mal"] { border-left-color: var(--danger); }
.revision-item[data-estado="blanco"] { border-left-color: var(--warning); }
.revision-cabecera { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.revision-num {
  font-size: var(--text-xs);
  font-weight: 800;
  color: var(--text-faint);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.revision-enunciado { font-weight: 650; line-height: 1.5; overflow-wrap: anywhere; }
.revision-opciones { display: grid; gap: 0.3rem; }
.revision-opcion {
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
  padding: 0.4rem 0.55rem;
  border-radius: var(--radio-sm);
  border: 1px solid transparent;
  font-size: var(--text-small);
  color: var(--text-muted);
  flex-wrap: wrap;
  overflow-wrap: anywhere;
}
.revision-opcion > span { min-width: 0; }
.revision-opcion .letra { font-weight: 800; color: var(--text-faint); }
.revision-opcion.es-correcta { color: var(--success); background: var(--success-soft); border-color: var(--success-line); }
.revision-opcion.es-elegida-mal { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
.revision-opcion.es-elegida-ok { color: var(--success); background: var(--success-soft); border-color: var(--success-line); }
.revision-opcion .marca { margin-left: auto; font-size: var(--text-xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
.revision-explicacion { font-size: var(--text-small); color: var(--text-muted); border-top: 1px dashed var(--border-soft); padding-top: 0.55rem; }
.revision-explicacion strong { color: var(--gold); }

/* --------------------------------------------------------------------------
   Historial
   -------------------------------------------------------------------------- */
.grafico {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.grafico svg { display: block; width: 100%; min-width: 620px; height: auto; }
.grafico .grilla { stroke: var(--border-soft); stroke-width: 1; }
.grafico .eje-texto { fill: var(--text-faint); font-size: 10px; font-family: var(--font-body); }
.grafico .linea { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.grafico .punto { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.grafico .punto:hover { fill: var(--accent); }

.tabla-scroll { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radio-md); }
table { width: 100%; border-collapse: collapse; font-size: var(--text-small); min-width: 560px; }
caption { text-align: left; padding: 0.7rem 0.9rem; color: var(--text-muted); font-size: var(--text-xs); }
th, td { padding: 0.65rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
th {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-label);
  color: var(--text-faint);
  font-weight: 800;
  background: var(--surface);
  position: sticky;
  top: 0;
}
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface); }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.puntaje-celda { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 750; font-variant-numeric: tabular-nums; }

.ranking { display: grid; gap: 0.55rem; }
.ranking-item {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.7rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.ranking-pos {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--gold-soft);
  border: 1px solid var(--gold-line);
  color: var(--gold);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.9rem;
}
.ranking-texto { flex: 1; min-width: 0; display: grid; gap: 0.1rem; }
.ranking-texto strong { font-size: var(--text-small); font-weight: 650; line-height: 1.4; overflow-wrap: anywhere; }
.ranking-texto small { color: var(--text-faint); font-size: var(--text-xs); overflow-wrap: anywhere; }
.ranking-cuenta { flex: 0 0 auto; font-size: var(--text-xs); font-weight: 800; color: var(--danger); }

/* --------------------------------------------------------------------------
   Editor de preguntas
   -------------------------------------------------------------------------- */
.preguntas-lista { display: grid; gap: 0.55rem; }
.pregunta-item {
  display: grid;
  gap: 0.5rem;
  padding: 0.8rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface);
}
.pregunta-item-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.pregunta-item-texto { font-size: var(--text-small); line-height: 1.5; overflow-wrap: anywhere; }
.pregunta-item-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
.pregunta-item-acciones { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.opciones-editor { display: grid; gap: 0.5rem; }

/* --------------------------------------------------------------------------
   Estados vacíos
   -------------------------------------------------------------------------- */
.vacio {
  display: grid;
  place-items: center;
  gap: 0.55rem;
  text-align: center;
  padding: clamp(2rem, 7vw, 3.5rem) 1rem;
  border: 1px dashed var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface);
}
.vacio-icono {
  display: grid;
  place-items: center;
  width: 52px; height: 52px;
  border-radius: 14px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--accent-ink);
  font-size: 1.4rem;
}
.vacio h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.vacio p { color: var(--text-muted); font-size: var(--text-small); max-width: 46ch; }

/* --------------------------------------------------------------------------
   Modales y avisos flotantes
   -------------------------------------------------------------------------- */
.modal {
  width: min(560px, calc(100vw - 2rem));
  max-height: min(86vh, 760px);
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radio-lg);
  background: var(--surface-elevated);
  color: var(--text);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}
.modal[open] { animation: modalEntrar var(--dur-3) var(--ease) both; }
@keyframes modalEntrar {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: none; }
}
.modal::backdrop {
  background: var(--scrim);
  backdrop-filter: blur(3px);
}
.modal-in { display: grid; gap: var(--space-4); padding: clamp(1.1rem, 4vw, 1.6rem); max-height: min(86vh, 760px); overflow-y: auto; }
.modal-cabecera { display: grid; gap: 0.2rem; padding-right: 2rem; }
.modal-titulo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  line-height: 1.15;
}
.modal-cuerpo { color: var(--text-muted); font-size: var(--text-small); }
.modal-cuerpo p + p { margin-top: 0.6rem; }
.modal-cerrar {
  position: absolute;
  top: 0.7rem; right: 0.7rem;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radio-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font-size: 1.15rem;
}
.modal-cerrar:hover { background: var(--surface-elevated-2); color: var(--text); border-color: var(--border); }
.modal-acciones { display: flex; gap: 0.55rem; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 480px) {
  .modal-acciones .btn { flex: 1 1 100%; }
}

.toasts {
  position: fixed;
  left: 50%;
  bottom: max(1rem, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 120;
  display: grid;
  gap: 0.5rem;
  width: min(430px, calc(100vw - 2rem));
  pointer-events: none;
}
.toast {
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
  padding: 0.7rem 0.9rem;
  border-radius: var(--radio-md);
  border: 1px solid var(--border);
  background: var(--surface-elevated);
  color: var(--text);
  font-size: var(--text-small);
  box-shadow: var(--shadow-lift);
  animation: toastEntrar var(--dur-3) var(--ease) both;
  pointer-events: auto;
}
.toast-ok { border-color: var(--success-line); }
.toast-error { border-color: var(--danger-line); }
.toast-icono { flex: 0 0 auto; }
@keyframes toastEntrar {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* --------------------------------------------------------------------------
   Pie
   -------------------------------------------------------------------------- */
.pie {
  border-top: 1px solid var(--border-soft);
  padding-block: var(--space-5);
  color: var(--text-faint);
  font-size: var(--text-xs);
}
.pie-in { display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.pie strong { color: var(--text-muted); }

/* --------------------------------------------------------------------------
   Actividades interactivas
   -------------------------------------------------------------------------- */
.actividad-card { display: grid; gap: var(--space-3); align-content: start; }
.actividad-card .fila { gap: 0.4rem; }
.actividad-panel { display: grid; gap: var(--space-4); padding: clamp(1rem, 3vw, 1.5rem); }
.actividad-meta, .actividad-barra { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.actividad-enunciado {
  font-size: clamp(1.08rem, 1rem + 0.5vw, 1.3rem);
  font-weight: 650;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.actividad-form { display: grid; gap: var(--space-3); max-width: 42rem; }
.actividad-form .btn { justify-self: start; }
.actividad-feedback { margin-top: var(--space-3); }
.actividad-resultado { grid-template-columns: minmax(0, 1fr); }
.actividad-resultado .resultado-info { max-width: 70ch; }

.match-grid {
  display: grid;
  gap: var(--space-4);
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
}
.match-columna { display: grid; gap: var(--space-2); min-width: 0; }
.match-lista { display: grid; gap: 0.5rem; }
.match-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  width: 100%;
  min-height: 48px;
  padding: 0.7rem 0.8rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
  color: var(--text);
  text-align: left;
  font-size: var(--text-small);
  line-height: 1.4;
  overflow-wrap: anywhere;
  transition: border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.match-item:hover:not(:disabled) { border-color: var(--accent-line); background: var(--accent-soft); }
.match-item.es-seleccionada {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.match-item.es-resuelta {
  border-color: var(--success-line);
  background: var(--success-soft);
  color: var(--success);
  cursor: default;
}
.match-item:disabled { cursor: default; }
.match-marca { flex: 0 0 auto; font-weight: 800; }
.match-item code { font-size: 0.82em; overflow-wrap: anywhere; }

.orden-lista { display: grid; gap: 0.5rem; }
.orden-item {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radio-md);
  background: var(--surface-elevated);
}
.orden-num {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-elevated-2);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.orden-texto { flex: 1; min-width: 0; font-size: var(--text-small); overflow-wrap: anywhere; }
.orden-acciones { display: flex; gap: 0.3rem; flex: 0 0 auto; }
